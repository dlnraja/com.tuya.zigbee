# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Runs the test suite on Node 22, the runtime Homey apps use since firmware 12.9.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
name: Node 22 runtime tests
# WHY (docs/knowledge/HOMEY_FIRMWARE.md): since Homey v12.9.0, apps run on Node 22 on every platform.
# The homey CLI needs Node 24, but app code must stay Node 22 compatible, so the test suite runs on 22.
on:
  push:
    paths: ['lib/**', 'drivers/**/*.js', 'app.js', 'test/**', 'package.json', '.github/workflows/node22-tests.yml']
  pull_request:
    paths: ['lib/**', 'drivers/**/*.js', 'app.js', 'test/**', 'package.json']
  workflow_dispatch:
# P3069: on a busy master (several workers pushing every few minutes) cancel-in-progress killed every
# run before it finished, so nobody saw a verdict for an hour. Now a push to a branch lets the running
# job finish; GitHub keeps only the newest waiting run in the group and drops the ones in between, so
# at most one run plus one queued run exist and no extra minutes are spent. Pull requests still
# cancel the older run, since only the latest PR head matters there. See docs/knowledge/CI_CONCURRENCY.md.
concurrency:
  group: node22-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
      - name: Resilience + memwarn tests (hard)
        run: npx mocha test/zigbee-resilience.test.js test/memwarn-guard.test.js --timeout 10000
      - name: Memory leak + budget tests (hard, P2914)
        run: node --expose-gc node_modules/.bin/mocha test/p2914-memory-leak.test.js --timeout 120000
      - name: Memory budget report (P2914)
        if: always()
        run: node --expose-gc scripts/ci/memory-budget.js --budget-mb "$(node -p "require('./scripts/ci/memory-budget.json').codeHeapBudgetMb")"
      - name: Full suite on Node 22
        run: npx mocha "test/**/*.test.js" --timeout 10000
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="All mocha suites passed on Node 22."; else s="A mocha suite failed on Node 22; the red step names the file."; fi
          node scripts/lib/report-writer.js --title "Node 22 tests (mocha)" --summary "$s" --headers "part|what it checks" --row "resilience|reconnect and memory-warning guards" --row "memory|leak and heap budget" --row "full suite|every test file under mocha" --thanks "Node.js test runner" --thanks "Mocha" >> "$GITHUB_STEP_SUMMARY"
  # P3057-3: mocha exits with its own count, so node:test failures (process.exitCode) never failed the job.
  # Strict job: every node:test file under `node --test`; a failure fails the run unless it is in the
  # branch's frozen baseline (test/node-test-known-failures.json, may only shrink).
  # P3065 (CI speed): own job, in parallel with the mocha suite (was a trailing step: ~3 min of the
  # ~11 min wall). Same command, same gate; the workflow run still fails if either job fails.
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
      - name: Workflow lessons gate (P3092: moved couples + ZCL aliases)
        run: node tools/ci/workflow-lessons-gate.js
      - name: node:test strict (P3057-3)
        run: node tools/ci/node-test-strict.js --concurrency 4
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Every node:test file passed, or failed only inside the frozen baseline."; else s="A node:test file failed outside the frozen baseline."; fi
          node scripts/lib/report-writer.js --title "Node 22 tests (node:test strict)" --summary "$s" --headers "part|what it checks" --row "strict|node --test on every file, baseline may only shrink" --thanks "Node.js test runner" --thanks "Mocha" >> "$GITHUB_STEP_SUMMARY"
