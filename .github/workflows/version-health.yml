# <<< about
# 🩺 Version Health — crash/regression watcher (apps-api)
# Weekly: pulls build states from the Athom Apps API and flags versions with
# crashes on test/live or processing_failed builds. Complements the forum
# sentiment tracking (AGENTS.md) with hard numbers from the store backend.

name: 🩺 Version Health

on:
  schedule:
    - cron: '27 5 * * 1,4'  # Monday & Thursday ~05:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-health
  cancel-in-progress: false

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  version-health:
    name: 🩺 Crash/regression watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install deps
        run: npm ci --prefer-offline --no-audit || npm install

      - name: 🩺 Version health check
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/ci/version-health-check.js
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Twice a week: reads build states from the Athom Apps API and flags versions with crashes or failed processing."; else s="Stopped early ($JOB_STATUS); the red step above says why. Twice a week: reads build states from the Athom Apps API and flags versions with crashes or failed processing."; fi
          node scripts/lib/report-writer.js --title "version-health" --summary "$s" --headers "item|value" --row "job|version-health" --row "result|$JOB_STATUS" --thanks "Athom's official Homey app GitHub Actions (athombv)" --thanks "the Homey developer docs on build channels" >> "$GITHUB_STEP_SUMMARY" || true
