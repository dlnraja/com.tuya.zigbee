# Publish Zigbee Bastien (private house App ID only) — P2606 / P2738
# Creates / updates Athom app com.dlnraja.tuya.zigbee.bastien
# NEVER retargets Universal Tuya or Stable App IDs.
# Default: workflow_dispatch only (first create + on-site install). Push optional.
#
# WHY(P2738 Gmail 2026-09-25): Bastien #114 + Universal #3370 PF socket hang while
# #113 / #3371 testing healthy — prefer soft-expect direct-api (no CLI createBuild spam);
# Wait Athom + skip promote when draft_ok=false (P2726); one force_publish after cooldown.

name: Publish Zigbee Bastien

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force Athom createBuild even if soft-expect would skip'
        type: boolean
        default: true
  push:
    branches:
      - bastien-home
    paths:
      # P2930: every path that ends up in the Athom payload. Code-only commits (app.js, settings,
      # locales, capabilities, config, prepare-publish/prune scripts) used to never publish.
      # No double publish: the version write-back commit is [skip ci] and the group below serializes.
      - '.homeycompose/**'
      - 'app.json'
      - 'app.js'
      - 'api.js'
      - 'package.json'
      - 'package-lock.json'
      - 'drivers/**'
      - 'lib/**'
      - 'capabilities/**'
      - 'settings/**'
      - 'locales/**'
      - 'assets/**'
      - 'config/**'
      - 'workers/**'
      - 'scripts/prepare-publish.js'
      - 'scripts/maintenance/**'
      - '.homeyignore'
      - '.homeychangelog.json'

permissions:
  contents: read
  actions: read

concurrency:
  # P139/P2696: shared Athom API mutex with master + stable (Gmail socket hang flood).
  group: athom-developer-api-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  EXPECTED_APP_ID: 'com.dlnraja.tuya.zigbee.bastien'
  HOMEY_API_TIMEOUT_MS: '120000'
  HOMEY_BUILD_POLL_TIMEOUT_MS: '360000'
  HOMEY_DRAFT_WAIT_MS: '600000'
  # WHY(P2738): tip PF lands in <60s — early soft-continue (was 180s burn)
  HOMEY_DRAFT_EARLY_FAIL_MS: '60000'
  HOMEY_PUBLISH_FINAL_MAX_MB: '50'
  HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB: '50'
  HOMEY_PUBLISH_SOURCE_MAX_MB: '50'
  HOMEY_ZIGBEE_MAX_TOTAL_COMBOS: '14000'
  HOMEY_ZIGBEE_MAX_DRIVER_COMBOS: '1500'
  HOMEY_ZIGBEE_MAX_CASE_FORMS: '2'
  AI_PLAN_MODE: forfait
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  publish-bastien:
    name: Publish Bastien house app
    runs-on: ubuntu-latest
    timeout-minutes: 75  # idle wait (≤25) + publish + draft + final gate (≤15), like master 516c83444c
    permissions:
      contents: write  # P2915: version write-back commit only
    steps:
      - name: Checkout bastien-home
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: bastien-home
          fetch-depth: 1

      - name: Guard Bastien App ID only
        run: |
          set -euo pipefail
          AID=$(node -p "require('./app.json').id")
          VID=$(node -p "require('./app.json').version")
          echo "app_id=$AID version=$VID"
          if [ "$AID" != "$EXPECTED_APP_ID" ]; then
            echo "::error::Refusing publish — app.json id=$AID expected $EXPECTED_APP_ID"
            exit 1
          fi
          if [ "$AID" = "com.dlnraja.tuya.zigbee" ] || [ "$AID" = "com.dlnraja.tuya.zigbee.stable" ]; then
            echo "::error::Bastien publish must never use public App IDs"
            exit 1
          fi
          echo "OK Bastien App ID locked"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: Contre quoi P2606 + P260x wall remotes
        run: |
          npm run check:p2606
          npm run check:p2608 || true
          npm run check:p2609 || true

      - name: Sync app.json zigbee from compose (P2626/P2627)
        run: |
          set -euo pipefail
          node scripts/maintenance/sync-appjson-zigbee.js
          node -e "
            const fs=require('fs');
            const app=JSON.parse(fs.readFileSync('app.json','utf8'));
            for (const id of ['button_wireless_1','button_wireless_3','climate_sensor','remote_button_wireless_wall']) {
              const d=app.drivers.find(x=>x.id===id);
              if (!d) continue;
              const c=JSON.parse(fs.readFileSync('drivers/'+id+'/driver.compose.json','utf8'));
              if (c.capabilities) d.capabilities=c.capabilities;
              if (c.capabilitiesOptions) d.capabilitiesOptions=c.capabilitiesOptions;
              if (c.class) d.class=c.class;
              if (c.energy) d.energy=c.energy;
            }
            fs.writeFileSync('app.json', JSON.stringify(app));
            console.log('caps synced');
          "
          npm run check:p2626
          npm run check:p2625 || true
          npm run check:p2627 || true
      # WHY(2026-10-11): runs #38093168267/#38094461142 failed the gate at 1.0.122 <= 1.0.122 because this
      # workflow never bumped. Raise to the highest Athom/floor version, then +1 patch (runner-local; the
      # Athom API keeps the next run strictly above). Gate below stays mandatory.
      - name: Bump Bastien patch above highest uploaded
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_CHANGELOG: 'Reliability fixes'
        run: |
          node .github/scripts/athom-version-floor.js --apply
          node .github/scripts/bump-homey-version.js patch
          grep -m1 '"version"' app.json
      # WHY(2026-10-10 user rule): never upload a version <= highest Athom build (strictly incremental).
      - name: Strictly-incremental version gate
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: node .github/scripts/athom-version-floor.js --gate
      - name: Homey app build
        run: |
          set -euo pipefail
          npx homey app build
          node -e "
            const fs=require('fs');
            const id='com.dlnraja.tuya.zigbee.bastien';
            for (const f of ['app.json','.homeybuild/app.json']) {
              if (!fs.existsSync(f)) continue;
              const j=JSON.parse(fs.readFileSync(f,'utf8'));
              if (j.id !== id) {
                console.error('BAD id after build', f, j.id);
                process.exit(1);
              }
              console.log('build_ok', f, j.id, j.version);
            }
          "

      - name: Prepare Publish Directory
        run: npm run prepare-publish

      - name: Footprint report (ROM/RAM, warn-only)
        continue-on-error: true
        run: node scripts/ci/footprint-report.js || true

      # WHY(ported from master c25f077831/45a2d8f1a9): never upload while a build of this app is still processing
      # (Athom invalid_state). Bounded 12 min inside a 25 min step; never fails the job.
      - name: Wait for Athom idle (previous Bastien build final)
        continue-on-error: true
        timeout-minutes: 25
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: node .github/scripts/wait-athom-idle.js ${{ env.EXPECTED_APP_ID }}

      - name: Publish Bastien draft → Test
        id: publish_bastien
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_FORCE_PUBLISH: ${{ github.event.inputs.force_publish == true && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEY_PAT:-}" ]; then
            echo "::error::HOMEY_PAT secret missing — cannot create Athom app"
            exit 1
          fi
          PUBLISH_DIR="${HOMEY_PUBLISH_DIR:-$(node -p "require('path').join(require('os').tmpdir(), 'homey-publish-temp')")}"
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "::error::Prepared publish directory missing: $PUBLISH_DIR"
            exit 1
          fi
          # Re-lock identity inside prepared dir (prepare-publish must not retarget)
          node -e "
            const fs=require('fs'); const path=require('path');
            const id='com.dlnraja.tuya.zigbee.bastien';
            for (const f of ['app.json','.homeycompose/app.json'].map(r=>path.join(process.env.PUBLISH_DIR||'$PUBLISH_DIR',r))) {
              if (!fs.existsSync(f)) continue;
              const j=JSON.parse(fs.readFileSync(f,'utf8'));
              if (j.id !== id) { console.error('BAD id in', f, j.id); process.exit(1); }
              console.log('locked', f, j.id, j.version);
            }
          "
          cd "$PUBLISH_DIR"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund || true
          fi
          # P2830d: lossless payload pruning (node_modules docs/tests/maps, backups, undeclared pair views), as on master.
          node "$GITHUB_WORKSPACE/scripts/maintenance/prune-publish-payload.cjs" "$PUBLISH_DIR" || echo "::warning::prune-publish-payload failed; uploading unpruned payload"
          # P2900: per-upload size row for the socket-hang-up/size correlation CSV (shared with master/stable).
          node "$GITHUB_WORKSPACE/.github/scripts/publish-size-telemetry.js" measure "$PUBLISH_DIR" || true
          # P2902: local pre-upload check (Athom processing_failed has no error body).
          node "$GITHUB_WORKSPACE/scripts/ci/payload-preflight.cjs" "$PUBLISH_DIR" || { [ "${PAYLOAD_PREFLIGHT:-}" = warn ] || { echo "::error::payload preflight failed (see ERROR lines)"; exit 2; }; }
          # WHY(P2738): Homey CLI always createBuild — that flooded #114 PF while #113 healthy.
          # Prefer soft-expect direct-api (tip-lag / already-test / in-flight → exit 0, no spam).
          # Force path only on workflow_dispatch force_publish=true (cooldown one-shot).
          set +e
          if [ ! -f "$GITHUB_WORKSPACE/scripts/direct-api-publish.js" ]; then
            echo "::error::direct-api-publish.js missing — refuse Homey CLI createBuild spam"
            exit 1
          fi
          FORCE_FLAG=""
          if [ "${HOMEY_FORCE_PUBLISH:-0}" = "1" ]; then
            FORCE_FLAG="--force"
            echo "::notice::Bastien force publish (P2384 one-shot) via direct Athom API"
          else
            echo "::notice::Bastien soft-expect publish (P2732/P2738) — no Homey CLI createBuild"
          fi
          publish_output=$(HOMEY_PAT="$HOMEY_PAT" HOMEY_API_TIMEOUT_MS="${HOMEY_API_TIMEOUT_MS:-180000}" \
            node "$GITHUB_WORKSPACE/scripts/direct-api-publish.js" --path "$PUBLISH_DIR" --channel test $FORCE_FLAG 2>&1)
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if [ "$publish_status" -ne 0 ]; then
            if printf '%s\n' "$publish_output" | grep -Eiq 'already been published|currently in review|Create a Homey App|SOFT-EXPECT'; then
              echo "::notice::Athom soft-path / first-create note for $EXPECTED_APP_ID"
            fi
            # Soft-expect tip-lag already exits 0; real failures stay red
            exit "$publish_status"
          fi
          if printf '%s\n' "$publish_output" | grep -Eiq 'SOFT-EXPECT:|tip-lag-expected-pf|already-test|in-flight'; then
            echo "::notice::Bastien soft-expect skipped createBuild (P139/P2732) — healthy tip stays; no bump-loop"
          fi
          echo "Bastien draft publish completed"
          echo "## Zigbee Bastien published" >> "$GITHUB_STEP_SUMMARY"
          echo "- App ID: \`$EXPECTED_APP_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Test install](https://homey.app/a/$EXPECTED_APP_ID/test/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install on Bastien Pro: update Test channel or \`homey app install\` from clone" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait Athom draft ready (P2726)
        id: wait_draft
        continue-on-error: true
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          APP_ID: ${{ env.EXPECTED_APP_ID }}
          TARGET_APP_ID: ${{ env.EXPECTED_APP_ID }}
          HOMEY_DRAFT_WAIT_MS: ${{ env.HOMEY_DRAFT_WAIT_MS }}
          HOMEY_DRAFT_EARLY_FAIL_MS: ${{ env.HOMEY_DRAFT_EARLY_FAIL_MS }}
        run: |
          set +e
          node .github/scripts/wait-athom-draft-ready.js
          rc=$?
          set -e
          # WHY(P2738): early soft-continue writes processing_failed_degraded — do not promote PF tip
          if [ -n "${GITHUB_OUTPUT:-}" ] && grep -q 'processing_failed_degraded=true' "$GITHUB_OUTPUT" 2>/dev/null; then
            node .github/scripts/publish-size-telemetry.js record processing_failed-first || true
            echo "::warning::Bastien tip PF soft-continued — skip promote (keep healthy older Test)"
            echo "draft_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            node .github/scripts/publish-size-telemetry.js record draft-not-ready || true
            echo "::warning::Bastien draft not ready (processing_failed / invalid_state) — skip promote"
            echo "draft_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # P2900b: result row also on the first-upload path (CSV had measures only when no retry ran).
          node .github/scripts/publish-size-telemetry.js record uploaded-ok || true
          echo "draft_ok=true" >> "$GITHUB_OUTPUT"

      # WHY(P2900, 20/10/2026 Paris): Bastien was the only app with no retry after an Athom processing_failed
      # (socket hang up / AggregateError), so one flake left Test behind until the next push. Same shared policy
      # as master and stable: budget + jittered backoff from athom-retry-policy.js, each retry rebuilt with a
      # strictly higher patch version (re-checked by the floor gate), unknown failures and tip-lag never retried.
      - name: Re-upload on Athom processing_failed (fresh higher version)
        id: reupload
        if: steps.wait_draft.outputs.draft_ok == 'false' && steps.publish_bastien.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          APP_ID: ${{ env.EXPECTED_APP_ID }}
          TARGET_APP_ID: ${{ env.EXPECTED_APP_ID }}
          HOMEY_DRAFT_WAIT_MS: ${{ env.HOMEY_DRAFT_WAIT_MS }}
          HOMEY_DRAFT_EARLY_FAIL_MS: ${{ env.HOMEY_DRAFT_EARLY_FAIL_MS }}
          HOMEY_CHANGELOG: 'Reliability fixes'
        run: |
          set +e
          PUBLISH_DIR="${HOMEY_PUBLISH_DIR:-$(node -p "require('path').join(require('os').tmpdir(), 'homey-publish-temp')")}"
          # P2924: loop bound = largest budget; shouldRetry below still enforces the per-kind budget.
          MAXR=$(node .github/scripts/athom-retry-policy.js max)
          for retry in $(seq 1 "$MAXR"); do
            V=$(node -p "require('./app.json').version")
            status=$(node scripts/ci/homey-build-status.js "$APP_ID" 2>&1)
            row=$(printf '%s\n' "$status" | grep -F "\"version\":\"$V\"" | head -1)
            # P3025: shared per-version classifier (same file as stable): row -> empty-error = transient. Failover: inline rule.
            KIND=$(printf '%s\n' "$status" | node .github/scripts/athom-classify-failure.js --version "$V" 2>/dev/null)
            if [ -z "$KIND" ] || [ "$KIND" = "not-failed" ]; then
              KIND=$(printf '%s' "$row" | node .github/scripts/athom-retry-policy.js classify)
              # Athom often returns processing_failed with no error text (history: mostly socket hang up): transient budget.
              if [ "$KIND" = "unknown" ] && ! printf '%s' "$row" | grep -Eqi '"[a-zA-Z]*(err|reason|message|log)[a-zA-Z]*":'; then KIND=transient; fi
            fi
            HOMEY_EXPECTED_VERSION=$V TRANSIENT_RETRY=$((retry-1)) node .github/scripts/publish-size-telemetry.js record processing_failed "$KIND"
            if ! printf '%s' "$row" | grep -qi 'processing_failed'; then echo "v$V is not processing_failed (tip-lag / in-flight): no re-upload"; break; fi
            if [ "$KIND" = "unknown" ] || [ "$(node -e "const p=require('./.github/scripts/athom-retry-policy');console.log(p.shouldRetry(process.argv[1],process.argv[2])?'RETRY':'STOP')" "$KIND" $((retry-1)))" != "RETRY" ]; then echo "::warning::v$V failed ($KIND): not retryable by policy"; break; fi
            DELAY=$(node .github/scripts/athom-retry-policy.js backoff "$retry")
            echo "::warning::Athom processing_failed ($KIND) for v$V; backoff ${DELAY}s then rebuild as a new patch (retry $retry/$MAXR)"
            sleep "$DELAY"
            node .github/scripts/athom-version-floor.js --apply && node .github/scripts/bump-homey-version.js patch || { echo "::error::bump failed"; break; }
            NEWV=$(node -p "require('./app.json').version")
            if [ "$NEWV" = "$V" ] || [ "$(printf '%s\n%s\n' "$V" "$NEWV" | sort -V | tail -1)" != "$NEWV" ]; then echo "::error::refusing non-increasing $NEWV (was $V)"; break; fi
            node .github/scripts/athom-version-floor.js --gate || break
            npx homey app build && npm run prepare-publish || { echo "::error::rebuild failed"; break; }
            (cd "$PUBLISH_DIR" && { [ -f package-lock.json ] && npm ci --omit=dev --ignore-scripts --no-audit --no-fund || true; })
            node scripts/maintenance/prune-publish-payload.cjs "$PUBLISH_DIR" || true
            node .github/scripts/publish-size-telemetry.js measure "$PUBLISH_DIR" || true
            HOMEY_PAT="$HOMEY_PAT" HOMEY_API_TIMEOUT_MS=180000 node scripts/direct-api-publish.js --path "$PUBLISH_DIR" --channel test --force || echo "::warning::re-upload attempt failed"
            OUT=$(mktemp)
            GITHUB_OUTPUT="$OUT" node .github/scripts/wait-athom-draft-ready.js; rc=$?
            if [ "$rc" -eq 0 ] && ! grep -q 'processing_failed_degraded=true' "$OUT"; then
              HOMEY_EXPECTED_VERSION=$NEWV TRANSIENT_RETRY=$retry node .github/scripts/publish-size-telemetry.js record uploaded-ok
              echo "draft_ok=true" >> "$GITHUB_OUTPUT"; echo "version=$NEWV" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "draft_ok=false" >> "$GITHUB_OUTPUT"
          echo "### Bastien Test NOT updated after re-uploads (Athom processing_failed)" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload publish size telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: publish-size-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-size/
          if-no-files-found: ignore
          retention-days: 90

      # P2620: draft→test only when draft_ok (P2726/P2738 — never promote PF tip)
      - name: Install promotion tools
        if: (steps.wait_draft.outputs.draft_ok == 'true' || steps.reupload.outputs.draft_ok == 'true')
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 \
            libxshmfence1 2>/dev/null || true
          npm install puppeteer athom-api --no-save

      - name: "Bastien Tier 1: Promote draft→test (Puppeteer)"
        id: promote_puppeteer
        if: (steps.wait_draft.outputs.draft_ok == 'true' || steps.reupload.outputs.draft_ok == 'true')
        continue-on-error: true
        timeout-minutes: 8
        env:
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          DRY_RUN: "false"
          TARGET_APP_ID: ${{ env.EXPECTED_APP_ID }}
          FORUM_AUTO_POST: "0"
        run: node .github/scripts/auto-promote-puppeteer.js

      - name: "Bastien Tier 2: Promote via API"
        id: promote_api
        if: (steps.wait_draft.outputs.draft_ok == 'true' || steps.reupload.outputs.draft_ok == 'true') && steps.promote_puppeteer.outcome != 'success'
        continue-on-error: true
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          TARGET_APP_ID: ${{ env.EXPECTED_APP_ID }}
        run: node .github/scripts/auto-publish-draft.js

      - name: Verify Bastien Test channel
        id: verify_bastien_test
        # WHY(P2723/P2738): soft-continue exit 0 on tip-lag; warn loudly — no bump-loop
        continue-on-error: true
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          APP_ID: ${{ env.EXPECTED_APP_ID }}
          TARGET_APP_ID: ${{ env.EXPECTED_APP_ID }}
        run: |
          set +e
          node .github/scripts/verify-test-version.js
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Bastien Test verify did not confirm tip — Athom PF / tip-lag (P139 soft-continue)"
            echo "bastien_test_ok=false" >> "$GITHUB_OUTPUT"
            echo "### Bastien Test tip-lag (soft-continue)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Expected tip not on Test — install healthy older tip on house Pro; one force after cooldown" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "bastien_test_ok=true" >> "$GITHUB_OUTPUT"
          echo "### Bastien Test OK" >> "$GITHUB_STEP_SUMMARY"

      # WHY(ported from master 9cfe3f5d08): no false green — the run goes red unless this version reached
      # Test (P2723/P2738 soft-continue kept for promote/verify; this only reports the true final state,
      # and keeps the P2400 dispatch-dedupe from treating a processing_failed tip as published).
      - name: Athom final state gate (red unless Test)
        if: always() && steps.publish_bastien.outcome == 'success'
        timeout-minutes: 15
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: node .github/scripts/assert-athom-final.js

      # WHY(P2915/P2917): Bastien Test reached 1.0.182 while the branch said 1.0.179. Write back the highest
      # CONFIRMED Test version (Athom state "test"), [skip ci], once, on a clean tree (never a built app.json),
      # rebase + 3 bounded tries, no dispatch (no loop).
      - name: Version write-back ([skip ci])
        if: always() && steps.publish_bastien.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: bash .github/scripts/version-writeback.sh bastien-home com.dlnraja.tuya.zigbee.bastien
