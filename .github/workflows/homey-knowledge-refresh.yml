# Weekly Homey knowledge + tooling refresh
# Triggers: cron Mon 05:47 UTC + workflow_dispatch | Secrets: GITHUB_TOKEN only | Free, no AI
name: Homey knowledge refresh (weekly)

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homey-knowledge-refresh
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            data/sources
            data/leads
            docs/knowledge
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Homey sources (SDK docs, news, athombv, npm), changes only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/source-registry.js --only homey-sdk-changelog,homey-sdk-sitemap,homey-news,homey-sdk-v3-docs,athom-dev-blog,npm-homey-cli,npm-homey-lib,athombv-node-homey,athombv-zigbeedriver,athombv-zigbee-clusters,athombv-matter-bridge --max-calls 60
      - name: Tooling versions (homey CLI, homey-lib, Node requirement)
        id: tool
        run: node .github/scripts/homey-tooling-refresh.js
      - name: Draft PR when something changed
        if: ${{ steps.tool.outputs.changed == 'true' || hashFiles('data/leads/source-proposals.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet && { echo "nothing to commit"; exit 0; }
          b="bot/homey-knowledge-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$b"
          git add -A data/sources data/leads docs/knowledge .github/workflows
          git commit -m "docs(knowledge): weekly Homey SDK/news/tooling refresh [skip ci]"
          git push -u origin "$b"
          gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$b" \
            --title "Weekly Homey knowledge/tooling refresh $(date -u +%F)" \
            --body "Automatic, free, no AI. Review data/leads/source-proposals.json and docs/knowledge/HOMEY_TOOLING_WATCH.md. Runtime libs are proposals only."
