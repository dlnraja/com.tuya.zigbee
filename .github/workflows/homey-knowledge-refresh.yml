# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Weekly refresh of Homey firmware and tooling notes; version bumps stay proposals in the docs.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters contributors; zigpy / ZHA, deCONZ,
#   tuya-local, tinytuya and localtuya authors; Blakadder's Zigbee device database.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Weekly Homey knowledge + tooling refresh
# Triggers: cron Mon 05:47 UTC + Thu 09:23 UTC (backup slot: GitHub may delay or drop a schedule) + workflow_dispatch
# Secrets: GITHUB_TOKEN only | Free, no AI
# Never commits .github/workflows: node-version bumps stay a proposal in docs/knowledge/HOMEY_TOOLING_WATCH.md.
# One draft PR per 6 days: a run skips when a refresh PR opened in that window is still open.
name: Homey knowledge refresh (weekly)

on:
  schedule:
    - cron: '47 5 * * 1'
    - cron: '23 9 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homey-knowledge-refresh
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Skip when a recent refresh PR is still open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '6 days ago' +%Y-%m-%dT%H:%M:%SZ)
          open=$(gh pr list --state open --json number,headRefName,createdAt \
            --jq "[.[] | select(.headRefName | startswith(\"bot/homey-knowledge-\")) | select(.createdAt >= \"$since\") | .number] | first // empty" || true)
          if [ -n "$open" ]; then
            echo "::notice::refresh PR #$open (opened in the last 6 days) is still open, nothing new to propose"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          token: ${{ github.token }}
          sparse-checkout: |
            .github
            data/sources
            data/leads
            docs/knowledge
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          node-version: '24'
      - name: Homey sources (SDK docs, news, athombv, npm), changes only
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/source-registry.js --only homey-sdk-changelog,homey-sdk-sitemap,homey-news,homey-sdk-v3-docs,athom-dev-blog,npm-homey-cli,npm-homey-lib,athombv-node-homey,athombv-zigbeedriver,athombv-zigbee-clusters,athombv-matter-bridge --max-calls 60
      - name: Tooling versions (homey CLI, homey-lib, Node requirement)
        id: tool
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: node .github/scripts/homey-tooling-refresh.js
      - name: Draft PR when something changed
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.tool.outputs.changed == 'true' || hashFiles('data/leads/source-proposals.json') != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Workflow files are never part of this commit (bot token has no `workflows` permission and
          # node-version bumps are proposals only).
          git checkout -- .github/workflows 2>/dev/null || true
          git diff --quiet -- data/sources data/leads docs/knowledge && [ -z "$(git ls-files --others --exclude-standard -- data/sources data/leads docs/knowledge)" ] && { echo "nothing to commit"; exit 0; }
          b="bot/homey-knowledge-$(date -u +%Y%m%d)"
          # A same-day re-run must not collide with the branch an earlier run already pushed.
          if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then b="${b}-${GITHUB_RUN_ID}"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$b"
          git add -A data/sources data/leads docs/knowledge
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::workflow files staged, refusing to commit them"; exit 1
          fi
          git commit -m "docs(knowledge): weekly Homey SDK/news/tooling refresh [skip ci]"
          git push -u origin "$b"
          gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$b" \
            --title "Weekly Homey knowledge/tooling refresh $(date -u +%F)" \
            --body "Automatic, free, no AI. Review data/leads/source-proposals.json and docs/knowledge/HOMEY_TOOLING_WATCH.md. Runtime libs and CI node-version bumps are proposals only (HOMEY_TOOLING_WATCH.md)."
