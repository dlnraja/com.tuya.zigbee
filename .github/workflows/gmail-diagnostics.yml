# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Analyses diagnostic mails four times a day; works with local rules, AI only within free quota.
# Ideas from (thank you): Homey users who send diagnostic reports by mail; the Homey developer docs on app
#   diagnostics.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Gmail Diagnostics Auto-Analysis
# Triggers: cron: 0 0,6,12,18 * * * + workflow_dispatch | Secrets: CEREBRAS_API_KEY,GH_PAT,GMAIL_APP_PASSWORD,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_EMAIL,GMAIL_REFRESH_TOKEN,GOOGLE_API_KEY,HF_TOKEN,HOMEY_PAT,HOMEY_PAT_API,KIMI_API_KEY,MISTRAL_API_KEY,NVIDIA_API_KEY,OPENROUTER_API_KEY,TOGETHER_API_KEY
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: Gmail Diagnostics Auto-Analysis
# <!-- badges:start -->
# [![Gmail Diagnostics Auto-Analysis](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/gmail-diagnostics.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/gmail-diagnostics.yml)
# <!-- badges:end -->


on:
  schedule:
    # R69: every 6 hours (00, 06, 12, 18 UTC) for faster turnaround
    # Auto-enrich-closed-loop.yml runs every 4h and includes gmail scan
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      all_history:
        description: "Fetch diagnostics from the historical baseline instead of the rolling window"
        type: boolean
        default: false
        required: false
      since:
        description: "Optional start date for IMAP search, for example 2019-01-01"
        required: false
      until:
        description: "Optional exclusive end date for IMAP search, for example 2024-01-01"
        required: false
      max_results:
        description: "Maximum matching emails to fetch per IMAP window"
        default: "1000"
        required: false
      max_total_results:
        description: "Maximum matching emails to keep across all IMAP windows"
        default: "5000"
        required: false
      chunk_days:
        description: "Split historical IMAP fetch into N-day windows; 0 disables chunking"
        default: "0"
        required: false
      reprocess:
        description: "Ignore processed state and rebuild the diagnostic chronology"
        type: boolean
        default: false
        required: false
      auto_implement:
        description: "Allow fingerprint implementation from sanitized diagnostics"
        type: boolean
        default: false
        required: false
      require_access:
        description: "Fail the workflow when Gmail IMAP and OAuth diagnostics access are both unavailable"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: gmail-diagnostics
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  AI_PLAN_MODE: forfait
  AI_ALLOW_PAID: "false"
  AI_GLOBAL_DAILY_CAP: '80'
  AI_SOFT_STOP_PERCENT: '60'
  AI_FORCE_LOCAL: "true"
  GMAIL_DIAG_AI_MAX: "0"
  AI_ALLOW_REMOTE: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  fetch-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: "P2227 AI forfait plan guard (no paid overage)"
        continue-on-error: true
        run: |
          node tools/ci/ai-plan-guard.js --preflight
          node tools/ci/ai-quota-report.js || true
          # Apply included caps into job env via GITHUB_ENV
          eval "$(node tools/ci/ai-plan-guard.js --apply-env)"
          {
            echo "AI_PLAN_MODE=${AI_PLAN_MODE:-forfait}"
            echo "AI_ALLOW_PAID=false"
            echo "AI_GLOBAL_DAILY_CAP=${AI_GLOBAL_DAILY_CAP:-80}"
            echo "AI_SOFT_STOP_PERCENT=${AI_SOFT_STOP_PERCENT:-60}"
            echo "GMAIL_DIAG_AI_MAX=0"
          } >> "$GITHUB_ENV"
      - name: Gmail auth health preflight
        continue-on-error: true
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          GMAIL_HEALTH_STRICT: "false"
        run: |
          node .github/scripts/gmail-auth-cascade.js --json || true
          node .github/scripts/gmail-token-keepalive.js || true
      # v5.13.3 / P2226: IMAP → OAuth → local (Cursor plugin is IDE-only)
      # WHY(2026-10-11): .github/state/** is gitignored, so the "commit state" step below never stages
      # anything and the processed-message list was lost after every run (each run re-read the same
      # 100 mails: "0 new FPs", "No ... state changes to push"). Persist it in the free Actions cache.
      - name: Restore Gmail diagnostics state (cache)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .github/state/diagnostics-state.json
            .github/state/diagnostics-report.json
          key: gmail-diag-state-${{ github.run_id }}
          restore-keys: gmail-diag-state-
      - name: Fetch diagnostics via Gmail
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          GMAIL_ALLOW_LOCAL_FALLBACK: "1"
          GOOGLE_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.GOOGLE_API_KEY || '' }}
          NVIDIA_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.NVIDIA_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.MISTRAL_API_KEY || '' }}
          KIMI_API_KEY: '' # cancelled paid plan (2026-10): provider neutralized
          TOGETHER_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.TOGETHER_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.CEREBRAS_API_KEY || '' }}
          HF_TOKEN: ${{ vars.AI_DISABLED != 'true' && secrets.HF_TOKEN || '' }}
          OPENROUTER_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.OPENROUTER_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_DIAG_ALL_HISTORY: ${{ github.event.inputs.all_history || 'false' }}
          GMAIL_DIAG_SINCE: ${{ github.event.inputs.since || '' }}
          GMAIL_DIAG_UNTIL: ${{ github.event.inputs.until || '' }}
          GMAIL_DIAG_MAX_RESULTS: ${{ github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_MAX_TOTAL_RESULTS: ${{ github.event.inputs.max_total_results || github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '0' }}
          GMAIL_DIAG_STATE_LIMIT: ${{ github.event.inputs.max_total_results || '5000' }}
          GMAIL_DIAG_REPROCESS: ${{ github.event.inputs.reprocess || 'false' }}
          GMAIL_DIAG_AUTO_IMPLEMENT: ${{ github.event.inputs.auto_implement || 'false' }}
          GMAIL_DIAG_REQUIRE_ACCESS: ${{ github.event.inputs.require_access || 'false' }}
          DRY_RUN: ${{ github.event.inputs.auto_implement == 'true' && 'false' || 'true' }}
        run: |
          if [ -z "${GMAIL_EMAIL:-}" ] && [ -n "${HOMEY_EMAIL:-}" ]; then export GMAIL_EMAIL="$HOMEY_EMAIL"; fi
          if [ -z "${GMAIL_APP_PASSWORD:-}" ] && [ -n "${HOMEY_PASSWORD:-}" ]; then export GMAIL_APP_PASSWORD="$HOMEY_PASSWORD"; fi
          node .github/scripts/fetch-gmail-diagnostics.js
      - name: Privacy gate for Gmail outputs
        run: node .github/scripts/privacy-redactor.js .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/diagnostics-crossref.yml diagnostics
      # P2908: findings of each diagnostics mail go to data/progress/ledger.json as diag:<hash>
      # (kind, couples, identities not in a driver, error count, app version; no mail text, no sender).
      # Idempotent (findings hash) and bounded (100 per run). A rolling queue in the Actions cache
      # re-applies the last 300 findings, so a commit refused by safe-auto-commit loses nothing.
      - name: Restore diagnostics ledger queue (cache)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .github/state/diag-ledger-queue.json
          key: diag-ledger-queue-${{ github.run_id }}
          restore-keys: diag-ledger-queue-
      - name: Ledger intake (diagnostics findings, P2908)
        id: diag_ledger
        continue-on-error: true
        run: |
          # WHY(first run 39385111240): the ledger is shared with other writers; a checkout taken
          # minutes earlier made the gated commit hit a rebase conflict. Write on the newest master.
          git pull -q --ff-only origin master || echo "::warning::ledger intake: could not fast-forward, writing on the checkout"
          node scripts/progress/ledger-intake.js diag .github/state/diagnostics-report.json --max=100
      - name: Commit ledger (gated)
        if: steps.diag_ledger.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=gmail-diag-ledger --max-per-day=4 \
            --message="chore(ledger): diagnostics findings" \
            --paths="data/progress/ledger.json"
      - name: Save diagnostics ledger queue (cache)
        if: always() && hashFiles('.github/state/diag-ledger-queue.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .github/state/diag-ledger-queue.json
          key: diag-ledger-queue-${{ github.run_id }}
      - name: "P2233 Recursive diag/interview treat (f647 methodology)"
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          GMAIL_DIAG_RECURSIVE_INBOX: "1"
        run: |
          node tools/ci/diag-recursive-inbox-automate.js --from-diagnostics-report || true
          node .github/scripts/privacy-redactor.js \
            reports/diag-recursive-treat-*/SUMMARY.json \
            reports/diag-recursive-treat-*/CASES.json \
            reports/diag-recursive-treat-*/TREAT.md \
            .github/state/diag-recursive-inbox/automate-status.json || true
      - name: Diagnostic history gate
        run: npm run check:diag-history
      - name: "Regression lessons gate (MUST-KEEP fatals, shared rules-gates)"
        uses: ./.github/actions/rules-gates
        with:
          only: regression-lessons
      - name: "P100 Diag protocol gate (crash + sacred-couple cross-ref + dry apply)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm run check:diag-protocol || true
          node .github/scripts/privacy-redactor.js \
            .github/state/gmail-crash-patterns.json \
            .github/state/gmail-unique-fps.json \
            .github/state/gmail-fps-crossref-v2.json \
            .github/state/sacred-couple-dry-gate.json \
            .github/state/p101-sacred-lot2-report.json || true

      - name: "🔍 Infer-enrich from incomplete (dry-run)"
        if: always()
        continue-on-error: true
        run: node tools/ci/infer-enrich-from-incomplete.js --dry-run || true

      - name: "🔍 Infer-enrich apply (auto_implement only)"
        if: always() && (github.event.inputs.auto_implement == 'true')
        continue-on-error: true
        run: |
          node tools/ci/infer-enrich-from-incomplete.js --apply || true
          node tools/ci/ensure-case-variants.js --apply || true

      - name: "🛡️ Anti-bot strip + P2138 after infer-enrich apply (shared rules-gates, soft)"
        if: always() && (github.event.inputs.auto_implement == 'true')
        continue-on-error: true
        uses: ./.github/actions/rules-gates
        with:
          only: anti-bot,p2138
          strip: 'true'
          soft: 'true'

      # WHY(P2529): after Gmail diags — deep functional audit (soft, complementary)
      - name: "P2529 deep functional enrich (soft)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          npm run enrich:functional -- --skip-gates 2>&1 | tee deep-functional-gmail.log || echo "P2529_SOFT_WARN"
          npm run check:p2529 || echo "P2529_GATE_WARN"

      - name: "Light Z2M/ZHA sync (best-effort, OOM-safe)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ vars.FIRECRAWL_DISABLED != 'true' && secrets.FIRECRAWL_API_KEY || '' }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          if [ ! -f tools/ci/mega-crawler.js ]; then
            echo "mega-crawler missing — skip light sync"
            exit 0
          fi
          if [ -z "${GH_PAT:-}" ] && [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "No GH token — light sync may be rate-limited; continuing best-effort"
          fi
          timeout 200 npm run sync:z2m-zha:light || echo "z2m/zha light sync skipped/failed (non-blocking)"

      - name: Commit state
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .github/scripts/privacy-redactor.js .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/diagnostics-crossref.yml .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json .github/state/sacred-couple-dry-gate.json diagnostics
          git add .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json .github/state/sacred-couple-dry-gate.json 2>/dev/null || true
          COUNT=$(node -p "try{JSON.parse(require('fs').readFileSync('.github/state/diagnostics-report.json')).count||0}catch(e){0}")
          VER=$(node -p "require('./app.json').version" 2>/dev/null || echo "?")
          if ! git diff --staged --quiet; then
            git commit -m "Diagnostics update $(date -u +%Y-%m-%d) [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "No Gmail diagnostic state changes to push"
          fi
      - name: Save Gmail diagnostics state (cache)
        if: always() && hashFiles('.github/state/diagnostics-state.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .github/state/diagnostics-state.json
            .github/state/diagnostics-report.json
          key: gmail-diag-state-${{ github.run_id }}

      - name: Homey Device Diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node .github/scripts/homey-device-diagnostics.js

      - name: Collect & aggregate diagnostics
        if: always()
        continue-on-error: true
        env:
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/collect-diagnostics.js

      - name: Commit all diagnostics
        continue-on-error: true
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .github/scripts/privacy-redactor.js .github/state/diagnostics-report.json .github/state/diagnostics-crossref.yml .github/state/homey-device-report.json diagnostics
          git add diagnostics/ .github/state/diagnostics-*.json .github/state/homey-device-report.json 2>/dev/null || true
          COUNT=$(node -p "try{JSON.parse(require('fs').readFileSync('.github/state/diagnostics-report.json')).count||0}catch(e){0}")
          if ! git diff --staged --quiet; then
            git commit -m "Diagnostics update $(date -u +%Y-%m-%d) [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "No aggregated diagnostic changes to push"
          fi
      - name: Diagnostic history gate after aggregation
        if: always()
        run: npm run check:diag-history

      - name: "Protocol Pattern Detection (Multi-Protocol)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: node .github/scripts/protocol-pattern-detector.js

      - name: "Pattern Detector (feed resolver)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: node .github/scripts/pattern-detector.js

      - name: "Restore resolver state cache"
        if: always()
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .github/state/resolver-state.json
            .github/state/ai-rate-state.json
          key: resolver-state-${{ github.run_id }}
          restore-keys: |
            resolver-state-

      - name: "Diagnostic Auto-Resolver (cross-ref diags+patterns → issues/PRs)"
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_ONLY_SHADOW: "true"
          # WHY(P2394): never auto-post GitHub walls (AI-slop). Scan+state only unless explicitly enabled.
          DRY_RUN: "true"
          GITHUB_RESOLVER_COMMENT: "0"
        run: node .github/scripts/diagnostic-auto-resolver.js

      - name: "Resolution Summary"
        if: always()
        continue-on-error: true
        run: node .github/scripts/resolution-summary.js

      - name: Commit resolver state
        continue-on-error: true
        if: always()
        run: |
          node .github/scripts/privacy-redactor.js .github/state/resolver-*.json .github/state/pattern-*.json
          git add .github/state/resolver-*.json .github/state/pattern-*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Resolved issues + patterns update [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "No resolver state changes to push"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: sanitized-diagnostics-report
          path: |
            .github/state/diagnostics-report.json
            .github/state/diagnostics-crossref.yml
            .github/state/gmail-crash-patterns.json
            .github/state/gmail-unique-fps.json
            .github/state/gmail-fps-crossref-v2.json
            .github/state/sacred-couple-dry-gate.json
            diagnostics/summary.json
          retention-days: 30
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Analyses diagnostic mails four times a day; works with local rules, AI only within free quota."; else s="Stopped early ($JOB_STATUS); the red step above says why. Analyses diagnostic mails four times a day; works with local rules, AI only within free quota."; fi
          node scripts/lib/report-writer.js --title "gmail-diagnostics" --summary "$s" --headers "item|value" --row "job|fetch-diagnostics" --row "result|$JOB_STATUS" --thanks "Homey users who send diagnostic reports by mail" --thanks "the Homey developer docs on app diagnostics" >> "$GITHUB_STEP_SUMMARY" || true

  # P2936: full cross-research of every item this workflow handles (kill switch: vars.XR_ENABLED=false,
  # report-only: vars.XR_APPLY=false). Bounded (max items, net/OCR caps), cached, no paid API.
  cross-research:
    needs: [fetch-diagnostics]
    if: ${{ always() && vars.XR_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
    concurrency:
      group: cross-research-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: ./.github/actions/cross-research
        env:
          XR_ENABLED: ${{ vars.XR_ENABLED }}
          XR_APPLY: ${{ vars.XR_APPLY }}
        with:
          items: diags
          max: '80'
          id: xr-gmail-diagnostics
