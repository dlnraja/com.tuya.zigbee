# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Daily and per-PR homey app validation.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# TITAN Protocol v2 — Validate Homey App
# Restored and improved 2026-06-16
name: 🔍 Validate Homey App

on:
  schedule:
    - cron: '0 12 * * *'  # Daily 12:00 UTC
  pull_request:
    branches: [master, main, stable-v5]
    paths:
      - '**.js'
      - '**.json'
      - 'drivers/**'
      - 'lib/**'
      - '.github/**'
      - 'package*.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      level:
        description: "Validation level"
        required: false
        type: choice
        options: [debug, publish, verified]
        default: publish

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit || npm install

      - name: 🛡️ GitHub Actions & YAML Policy Gate
        run: npm run check:yaml

      - name: 🗣️ Google Assistant / Alexa Voice-Safety Gate
        run: npm run check:voice

      - name: ⏱️ Homey Timer Context Guard
        run: npm run check:timer-context

      - name: 🕵️ Agent-config hidden-text gate (P2800, no AI)
        run: npm run check:p2800

      - name: 📦 Get App Info
        id: info
        run: |
          VERSION=$(node -p "require('./app.json').version")
          NAME=$(node -p "require('./app.json').name.en")
          DRIVERS=$(ls -d drivers/*/ 2>/dev/null | wc -l)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "drivers=$DRIVERS" >> $GITHUB_OUTPUT
          echo "📦 $NAME v$VERSION - $DRIVERS drivers"

      - name: 🔨 Build app
        run: npx homey app build

      - name: 🧹 Sanitize generated manifest after build
        run: |
          node scripts/maintenance/fix-large-images.js
          node scripts/maintenance/optimize-build-images.cjs
          node scripts/maintenance/optimize-build-svgs.cjs
          node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json

      - name: 🔍 JS Syntax Check
        run: |
          FAIL=0
          for f in $(find lib drivers -name "*.js" 2>/dev/null); do
            if ! node -c "$f" 2>/dev/null; then
              echo "❌ Syntax error: $f"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✅ All JS files pass syntax check" || exit 1

      - name: 🔍 Fingerprint Collision Check
        run: |
          node .github/scripts/fp-collision-check.js --baseline .github/fingerprint-collision-baseline.json

      - name: 🛡️ Anti-bot regression gate
        run: node tools/ci/anti-bot-regression-gate.js

      - name: 🛡️ P2138 sacred-couple matrix gate
        run: node tools/ci/p2138-sacred-couple-matrix-gate.js

      - name: 🛡️ P2448/P2449 knob + declared flow wiring
        run: npm run check:p244x

      - name: 🛡️ P246x anti-regression family (Moes EF00 / IAS / battery)
        run: npm run check:p246x

      - name: 🛡️ P2487–P2490 complementary failover family
        run: npm run check:p248x

      - name: 🛡️ P249x AI efficiency + Homey button UI charter
        run: npm run check:p249x

      - name: 🛡️ P2495 publish path aggregator
        run: npm run check:publish

      - name: 🛡️ P217 fork harvest sacred-couple gate
        run: node tools/ci/p217-fork-harvest-gate.js

      - name: 🧭 P3018 DP + endpoint coverage (report-only; duplicate numeric keys fail)
        # WHY: legitimate gaps (no upstream converter, undeclared secondary EP) are reported, not blocking;
        # a duplicate DP / numeric key in one object literal silently drops a mapping → hard fail.
        run: node scripts/kb/dp-endpoint-coverage.js --check

      - name: 🧭 P3075 family completeness per gang / channel / phase (report-only)
        # WHY: DPs, clusters, capabilities and Flow cards per channel, per family; gaps are leads, never a failure.
        run: node scripts/kb/family-completeness.js --check

      - name: 🖼️ Driver Images Pre-Check
        run: |
          MISS=0
          for d in drivers/*/; do
            DR=$(basename "$d")
            for S in small large xlarge; do
              [ ! -f "$d/assets/images/$S.png" ] && { echo "::error::$DR missing $S.png"; MISS=$((MISS+1)); }
            done
          done
          [ $MISS -gt 0 ] && echo "::warning::$MISS missing driver images"
          echo "✅ $MISS missing image(s)"

      - name: 🔍 Validate (npx)
        run: npx homey app validate --level ${{ inputs.level || 'publish' }}

      - name: 🧹 Sanitize generated manifest after validation
        run: node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json

      - name: ✅ Summary
        if: success()
        run: |
          echo "## ✅ ${{ steps.info.outputs.name }} v${{ steps.info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Level | ${{ inputs.level || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drivers | ${{ steps.info.outputs.drivers }} |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failed
        if: failure()
        run: |
          echo "## ❌ Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "Run \`npx homey app validate --level publish\` locally for details." >> $GITHUB_STEP_SUMMARY
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Daily and per-PR homey app validation."; else s="Stopped early ($JOB_STATUS); the red step above says why. Daily and per-PR homey app validation."; fi
          node scripts/lib/report-writer.js --title "validate" --summary "$s" --headers "item|value" --row "job|validate" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
