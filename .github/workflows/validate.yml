# TITAN Protocol v2 — Validate Homey App
# Restored and improved 2026-06-16
name: 🔍 Validate Homey App

on:
  schedule:
    - cron: '0 12 * * *'  # Daily 12:00 UTC
  pull_request:
    branches: [master, main, stable-v5]
    paths:
      - '**.js'
      - '**.json'
      - 'drivers/**'
      - 'lib/**'
      - '.github/**'
      - 'package*.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      level:
        description: "Validation level"
        required: false
        type: choice
        options: [debug, publish, verified]
        default: publish

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit || npm install

      - name: 🛡️ GitHub Actions & YAML Policy Gate
        run: npm run check:yaml

      - name: 🗣️ Google Assistant / Alexa Voice-Safety Gate
        run: npm run check:voice

      - name: ⏱️ Homey Timer Context Guard
        run: npm run check:timer-context

      - name: 📦 Get App Info
        id: info
        run: |
          VERSION=$(node -p "require('./app.json').version")
          NAME=$(node -p "require('./app.json').name.en")
          DRIVERS=$(ls -d drivers/*/ 2>/dev/null | wc -l)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "drivers=$DRIVERS" >> $GITHUB_OUTPUT
          echo "📦 $NAME v$VERSION - $DRIVERS drivers"

      - name: 🔨 Build app
        run: npx homey app build

      - name: 🧹 Sanitize generated manifest after build
        run: |
          node scripts/maintenance/fix-large-images.js
          node scripts/maintenance/optimize-build-images.cjs
          node scripts/maintenance/optimize-build-svgs.cjs
          node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json

      - name: 🔍 JS Syntax Check
        run: |
          FAIL=0
          for f in $(find lib drivers -name "*.js" 2>/dev/null); do
            if ! node -c "$f" 2>/dev/null; then
              echo "❌ Syntax error: $f"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✅ All JS files pass syntax check" || exit 1

      - name: 🔍 Fingerprint Collision Check
        run: |
          node .github/scripts/fp-collision-check.js --baseline .github/fingerprint-collision-baseline.json

      - name: 🛡️ Anti-bot regression gate
        run: node tools/ci/anti-bot-regression-gate.js

      - name: 🛡️ P2138 sacred-couple matrix gate
        run: node tools/ci/p2138-sacred-couple-matrix-gate.js

      - name: 🛡️ P2448/P2449 knob + declared flow wiring
        run: npm run check:p244x

      - name: 🛡️ Flow titleFormatted [[args]] gate (P2749f)
        run: npm run check:flow-titleformatted

      - name: 🛡️ P246x anti-regression family (Moes EF00 / IAS / battery)
        run: npm run check:p246x

      - name: 🛡️ P2487–P2490 complementary failover family
        run: npm run check:p248x

      - name: 🛡️ P249x AI efficiency + Homey button UI charter
        run: npm run check:p249x

      - name: 🛡️ P257x VicHY radar / EF00 / anti-FP family
        run: npm run check:p257x
          npm run check:p2580

      - name: 🛡️ P2495 publish path aggregator
        run: npm run check:publish

      - name: 🛡️ P217 fork harvest sacred-couple gate
        run: node tools/ci/p217-fork-harvest-gate.js

      - name: 🖼️ Driver Images Pre-Check
        run: |
          MISS=0
          for d in drivers/*/; do
            DR=$(basename "$d")
            for S in small large xlarge; do
              [ ! -f "$d/assets/images/$S.png" ] && { echo "::error::$DR missing $S.png"; MISS=$((MISS+1)); }
            done
          done
          [ $MISS -gt 0 ] && echo "::warning::$MISS missing driver images"
          echo "✅ $MISS missing image(s)"

      - name: 🔍 Validate (npx)
        run: npx homey app validate --level ${{ inputs.level || 'publish' }}

      - name: 🧹 Sanitize generated manifest after validation
        run: node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json

      - name: ✅ Summary
        if: success()
        run: |
          echo "## ✅ ${{ steps.info.outputs.name }} v${{ steps.info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Level | ${{ inputs.level || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drivers | ${{ steps.info.outputs.drivers }} |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failed
        if: failure()
        run: |
          echo "## ❌ Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "Run \`npx homey app validate --level publish\` locally for details." >> $GITHUB_STEP_SUMMARY
