# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Internal notifications on issue and PR events (no secrets in the output).
# Ideas from (thank you): Renovate and Dependabot for the merge-when-green pattern; the actions/stale and
#   actions/labeler maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Secure Notifications (Enhanced)
# Triggers: issues,pull_request,workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).
#
# P2829 anti-spam: do NOT fan-out on every Unified-CI / syntax / code-quality /
# auto-fix completion — that floods GitHub Action emails (and cancels siblings).
# workflow_run watches Auto-Publish ONLY, and digest-event runs only on failure.

name: Secure Notifications (Enhanced)

# <!-- badges:start -->
# [![Secure Notifications (Enhanced)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/notifications.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/notifications.yml)
# <!-- badges:end -->


on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]
  # WHY(P2829): one watcher only — Auto-Publish failures matter; CI green/red spam does not
  workflow_run:
    workflows:
      - 'Auto-Publish on Push'
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # All workflow_run (CI) events share ONE group: a burst collapses to the latest run.
  # digest-event.js also dedupes: ≤1 CI comment per 30 min (extra lines buffered, flushed later).
  # Other events keep the ORIGINAL group (workflow + ref).
  # Issue events get a per-issue group so two issues opened together are both triaged.
  group: ${{ github.event_name == 'workflow_run' && format('{0}-ci-events', github.workflow) || (github.event_name == 'issues' && format('{0}-issue-{1}', github.workflow, github.event.issue.number)) || format('{0}-{1}', github.workflow, github.ref) }}
  # WHY(P2829): cancel storms themselves email watchers — do not cancel siblings
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  notify-maintainers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "contains(github.event.repository.name, 'tuya.zigbee') && github.event_name != 'workflow_run'"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Fetch and Dump Diagnostics securely
        continue-on-error: true
        env:
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          npm ci --prefer-offline --no-audit || npm install
          node .github/scripts/homey-device-diagnostics.js || true
          node .github/scripts/privacy-redactor.js .github/state/homey-device-report.json .github/state/diagnostics-report.json diagnostics || true
          
      # WHY(P2829): log-only — never SMTP/Gmail; name must not imply outbound email
      - name: Log event (no outbound mail)
        run: |
          echo "Event triggered in the repository: ${{ github.event_name }}"
          echo "Details: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}"
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Internal notifications on issue and PR events (no secrets in the output)."; else s="Stopped early ($JOB_STATUS); the red step above says why. Internal notifications on issue and PR events (no secrets in the output)."; fi
          node scripts/lib/report-writer.js --title "notifications" --summary "$s" --headers "item|value" --row "job|notify-maintainers" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" >> "$GITHUB_STEP_SUMMARY" || true

  auto-triage:
    name: 🏷️ Auto-triage new issue (labels + "what we already know")
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # labels + one triage comment on the new issue
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      github.event_name == 'issues' && github.event.action == 'opened' &&
      !endsWith(github.event.issue.user.login, '[bot]')
    steps:
      - name: 📥 Checkout (scripts + driver manifests + offline caches, read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/digest
            scripts/lib
            scripts/sync/data
            drivers
            lib
            data
            .homeycompose/flow
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🏷️ Triage
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/digest/triage.js

  digest-event:
    name: 🔔 PR / CI-master event → tracking issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # job-scoped permissions: the original notify-maintainers job keeps contents: read only
    permissions:
      contents: read
      issues: write   # one comment on the "🤖 Daily digest" tracking issue
      actions: read   # failed job names of the CI run
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
      )
    steps:
      - name: 📥 Checkout (scripts only, base repo)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/digest
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🔔 Digest event
        # Fork PRs get a read-only token → comment impossible; never fail the PR for that.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_EVENT_DEDUPE_MIN: '30'
        run: node scripts/digest/digest-event.js
