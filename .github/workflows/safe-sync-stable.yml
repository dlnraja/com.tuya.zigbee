# Safe Sync master → stable-v5 (P52)
# Triggers: cron: 25 4 * * * + workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: Safe Sync master → stable-v5 (P52)

# P74: defaults.run.shell: bash is REQUIRED by Fleetwood Integrity check
defaults:
  run:
    shell: bash

on:
  schedule:
    # Daily at 04:25 UTC (after the auto-fix-all bot at 03:00; staggered
    # 2026-07-29: was 04:00, collided with activity-monitor + publish-self-heal)
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safe-sync-stable
  cancel-in-progress: false
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  safe-sync:
    name: Sync safe changes to stable-v5
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout stable-v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: stable-v5
          fetch-depth: 50

      - name: Fetch master
        run: git fetch origin master --depth=50

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Run safe-sync tool
        run: |
          echo "═══ P52 Auto Safe Sync master → stable-v5 ═══"
          node tools/ci/apply-safe-sync.js || echo "Sync tool not found, using manual approach"

      - name: Apply safe changes manually (if tool not present)
        run: |
          SAFE_FILES="lib/tuya/fingerprints.json lib/battery/ data/mfs_db.json lib/LocalFirstEngine.js lib/SDK3CompatBridge.js lib/LowLevelBridge.js lib/utils/safe-timers.js"
          for f in $SAFE_FILES; do
            if [ -f "$f" ] && git show "origin/master:$f" > /tmp/master_file 2>/dev/null; then
              if ! diff -q "$f" /tmp/master_file > /dev/null; then
                cp /tmp/master_file "$f"
                echo "  ✓ updated $f"
              fi
            fi
          done

      - name: Drop synced rows whose driver does not exist on stable
        run: |
          # WHY(2026-10-03): master-only drivers (e.g. mc101z_pwm_dimmer) were copied into stable
          # data/mfs_db.json → "orphan ambiguous" mfs drift and a failed
          # stable Syntax Check. Keep only rows whose driverId has a drivers/<id>/ folder on stable.
          node -e '
            const fs=require("fs");
            const have=new Set(fs.readdirSync("drivers").filter(d=>fs.existsSync("drivers/"+d+"/driver.compose.json")));
            for (const f of ["data/mfs_db.json"]) { // fingerprints.json keeps legacy alias driverIds — not pruned
              if (!fs.existsSync(f)) continue;
              const raw=fs.readFileSync(f,"utf8"); const j=JSON.parse(raw); let n=0;
              for (const [k,v] of Object.entries(j)) {
                const id=v&&typeof v==="object"?v.driverId:null;
                if (typeof id==="string"&&id&&id!=="multi"&&!have.has(id)) { delete j[k]; n++; }
              }
              if (n) {
                const ind=raw.startsWith("{\n  ")?2:0;
                fs.writeFileSync(f, JSON.stringify(j,null,ind)+(raw.endsWith("\n")?"\n":""));
                console.log("pruned "+n+" master-only row(s) from "+f);
              }
            }'

      - name: 🛡️ Couple guard (pins, sacred-keep, curated removals, golden)
        # WHY(2026-10-11): auto-fix-all / sync re-added curated removals (vrcfo4i0, heobian) and
        # stripped pinned couples. Skip (restore) any offending file, then fail if still dirty.
        run: |
          if [ -f tools/ci/automation-couple-guard.js ]; then
            node tools/ci/automation-couple-guard.js --revert
            node tools/ci/automation-couple-guard.js --check
          fi

      - name: Bump stable version
        run: |
          # Get current version (strip any legacy -stable suffix: pre-release
          # versions are rejected by `homey app validate --level publish`)
          CURRENT=$(node -e "const c=require('./.homeycompose/app.json');console.log(c.version)")
          echo "Current version: $CURRENT"
          # Bump patch — plain semver x.y.z only
          NEW=$(echo ${CURRENT%-stable} | awk -F. '{print $1"."$2"."$3+1}')
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('.homeycompose/app.json','utf8'));
            c.version='$NEW';
            c.stableNotes='P52-auto: synced safe changes from master';
            fs.writeFileSync('.homeycompose/app.json',JSON.stringify(c,null,2));
            // keep app.json / package.json / changelog in step (2026-10-03: 5.12.355 vs 5.12.356 drift)
            const a=fs.readFileSync('app.json','utf8'); const aj=JSON.parse(a); aj.version='$NEW';
            fs.writeFileSync('app.json', a.startsWith('{\\n')?JSON.stringify(aj,null,2)+'\\n':JSON.stringify(aj));
            const pk=JSON.parse(fs.readFileSync('package.json','utf8')); pk.version='$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pk,null,2)+'\\n');
            const cl=JSON.parse(fs.readFileSync('.homeychangelog.json','utf8'));
            if (!cl['$NEW']) cl['$NEW']={en:'Device database and reliability updates.',fr:'Mises à jour de la base d’appareils et de la fiabilité.'};
            fs.writeFileSync('.homeychangelog.json', JSON.stringify(cl,null,2)+'\\n');
            console.log('Bumped to $NEW');
          "

      - name: Commit + push
        run: |
          git add .homeycompose/app.json app.json package.json .homeychangelog.json lib/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.email="p52-bot@homey-mavis.local" -c user.name="P52 Sync Bot" commit -m "chore(P52-auto): sync safe changes from master"
          git push origin stable-v5
          echo "✓ Pushed to stable-v5"
