# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Checks that our scripts keep forum and upstream actions in shadow (read-only) mode.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# GitHub Shadow Policy
# Triggers: pull_request,push,workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

defaults:
  run:
    shell: bash

name: "GitHub Shadow Policy"

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # P3026: read-only policy check, never publishes: one run per ref, a newer push cancels the older run.
  group: shadow-policy-check-${{ github.ref }}
  cancel-in-progress: true
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - name: Install deps
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline --no-audit || npm install --no-audit
          else
            echo "No package.json"
          fi
      - name: Enforce read-only upstream policy
        run: |
          node --check .github/scripts/github-shadow-policy.js
          node --check .github/scripts/check-github-shadow-policy.js
          node .github/scripts/check-github-shadow-policy.js
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Checks that our scripts keep forum and upstream actions in shadow (read-only) mode."; else s="Stopped early ($JOB_STATUS); the red step above says why. Checks that our scripts keep forum and upstream actions in shadow (read-only) mode."; fi
          node scripts/lib/report-writer.js --title "shadow-policy-check" --summary "$s" --headers "item|value" --row "job|policy" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
