# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Builds and deploys the Device Finder site to GitHub Pages.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels; the GitHub Pages actions maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Deploy Device Finder to GitHub Pages
# Triggers: cron: 0 9 * * * + push,schedule,workflow_dispatch,workflow_run | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: "Deploy Device Finder to GitHub Pages"

# <!-- badges:start -->
# [![Deploy Device Finder to GitHub Pages](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/deploy-pages.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/deploy-pages.yml)
# <!-- badges:end -->


on:
  schedule:
    - cron: '0 9 * * *'  # Daily 09:00 UTC — keep Device Finder updated
  workflow_dispatch:
  # A workflow_run on "UNIFIED ENGINE — Daily Galaxy Orchestrator" used to sit
  # here, but no workflow carries that name, so the trigger could never fire.
  # The daily schedule plus the path filter below already cover every case it
  # was meant to catch.
  push:
    branches: [master, main]
    paths:
      - 'drivers/*/driver.compose.json'
      - 'app.json'
      - 'package.json'
      - '.homeychangelog.json'
      - 'README.md'
      - '.github/scripts/generate-device-finder.js'
      - '.github/scripts/device-finder-*.js'
      - '.github/scripts/generate-dashboards-page.js'
      - '.github/scripts/generate-wifi-page.js'
      - '.github/scripts/generate-inbox-page.js'
      - '.github/scripts/generate-readme.js'
      - '.github/pages-build/**'
      - 'docs/**'
      - 'CREDITS.md'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit || npm install

      - name: Collect Device Data
        continue-on-error: true
        run: node .github/scripts/device-finder-collect.js

      - name: Export live data feed (P92.77 — app OTA-data)
        run: node .github/scripts/export-live-data-feed.js

      - name: Generate Device Finder
        run: node .github/scripts/generate-device-finder.js

      - name: Docs site generators — unit tests
        run: node --test docs/tools/test/*.test.js

      - name: Fetch stable-v5 and bastien-home manifests (SSOT of the other two apps)
        continue-on-error: true
        run: |
          mkdir -p /tmp/apps
          for b in stable-v5 bastien-home; do
            git fetch --depth=1 origin "$b" && git show FETCH_HEAD:app.json > "/tmp/apps/$b.json" || rm -f "/tmp/apps/$b.json"
          done

      - name: Generate docs site (/docs/)
        run: |
          ARGS="--app master=app.json"
          for b in stable-v5 bastien-home; do [ -s "/tmp/apps/$b.json" ] && ARGS="$ARGS --app $b=/tmp/apps/$b.json"; done
          node docs/tools/build-site.js --out .github/pages-build/docs $ARGS

      - name: Check docs links
        run: node docs/tools/check-links.js .github/pages-build/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .github/pages-build
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Builds and deploys the Device Finder site to GitHub Pages."; else s="Stopped early ($JOB_STATUS); the red step above says why. Builds and deploys the Device Finder site to GitHub Pages."; fi
          node scripts/lib/report-writer.js --title "deploy-pages" --summary "$s" --headers "item|value" --row "job|build" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" --thanks "the GitHub Pages actions maintainers" >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHY(P2796): environment jobs do not inherit workflow id-token; OIDC deploy failed with
    # "Ensure GITHUB_TOKEN has permission id-token: write" despite top-level permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # WHY: run 36955102264 failed on a transient OIDC "Failed to get ID Token / Request timeout";
      # one delayed retry instead of a red run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before Pages OIDC retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
