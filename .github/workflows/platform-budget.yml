# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Reports payload size, memory and Actions/API usage against the platform limits. Read-only.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P3026: platform budget report (Athom payload, Homey memory, GitHub Actions/repo/API limits).
# Read-only: builds and prepares the payload in RUNNER_TEMP, never uploads to Athom, never pushes.
# Report mode (exit 0) until stable; then set "mode": "block" in config/platform-limits.json.
# Doc: docs/knowledge/KB/PLATFORM_LIMITS.md

name: "Platform Budget (P3026)"

on:
  push:
    branches: [master, stable-v5, bastien-home]
    paths:
      - "app.json"
      - ".homeycompose/**"
      - "drivers/**"
      - "lib/**"
      - "assets/**"
      - "locales/**"
      - ".homeyignore"
      - "package-lock.json"
      - "scripts/prepare-publish.js"
      - "scripts/ci/platform-budget-gate.js"
      - "config/platform-limits.json"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

concurrency:
  # Never publishes: one run per ref.
  group: platform-budget-${{ github.ref }}
  # P3069: a push run finishes and newer pushes wait as one queued run (no extra minutes); PRs still cancel.
  # See docs/knowledge/CI_CONCURRENCY.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  GMAIL_DIAG_AI_MAX: '0' # P2542 forfait triple (gate tools/ci/p2542-local-auto-improve-gate.js)

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit
      - name: npm cache key freshness (report only)
        run: node scripts/ci/npm-cache-key.js || echo "::notice title=npm cache key::stale, run node scripts/ci/npm-cache-key.js --write"
      - name: Use the publish caps of auto-publish-on-push
        run: |
          grep -oE 'HOMEY_ZIGBEE_(MAX_TOTAL_COMBOS|MAX_DRIVER_COMBOS|MAX_CASE_FORMS|TOPUP_MAX_TOTAL|TOPUP_MAX_DRIVER): *"?[0-9]+' .github/workflows/auto-publish-on-push.yml \
            | sed -E 's/: *"?/=/' >> "$GITHUB_ENV" || true
      - name: Build + prepare payload (local only, no upload)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          npx homey app build
          node scripts/prepare-publish.js || echo "::warning title=platform budget::prepare-publish failed, payload measures skipped"
      - name: Platform budget gate
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
        run: node scripts/ci/platform-budget-gate.js --online --publish-dir "${HOMEY_PUBLISH_DIR:-$RUNNER_TEMP/homey-publish-temp}" --out "$RUNNER_TEMP/platform-budget-report.json"
      # P3048: the AI-free digest (automation-loop.yml) reads the published-payload combos from this artifact.
      - name: Keep the report for the digest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-budget-report
          path: ${{ runner.temp }}/platform-budget-report.json
          retention-days: 14
          if-no-files-found: ignore
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Reports payload size, memory and Actions/API usage against the platform limits. Read-only."; else s="Stopped early ($JOB_STATUS); the red step above says why. Reports payload size, memory and Actions/API usage against the platform limits. Read-only."; fi
          node scripts/lib/report-writer.js --title "platform-budget" --summary "$s" --headers "item|value" --row "job|budget" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
