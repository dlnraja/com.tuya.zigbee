# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Weekly check that the CI secrets we rely on are present (names only, values never printed).
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
name: Homey Secrets Health
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: homey-secrets-health
  cancel-in-progress: false
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: Refresh account token (rotates HOMEY_REFRESH_TOKEN)
        env:
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/ci/homey-token-refresh.js || true
      - name: Check secrets (read-only)
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_TOKEN: ${{ secrets.HOMEY_TOKEN }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/ci/homey-secrets-health.js
      - name: Athom build status (read-only; real HOMEY_PAT probe via delegation token)
        if: always()
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: |
          node scripts/ci/homey-build-status.js com.dlnraja.tuya.zigbee
          node scripts/ci/homey-build-status.js com.dlnraja.tuya.zigbee.stable || true
      - name: Upload status file
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: homey-secrets-health
          path: data/status/
          retention-days: 30
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly check that the CI secrets we rely on are present (names only, values never printed)."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly check that the CI secrets we rely on are present (names only, values never printed)."; fi
          node scripts/lib/report-writer.js --title "homey-secrets-health" --summary "$s" --headers "item|value" --row "job|check" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
