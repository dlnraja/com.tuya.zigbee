name: Homey Secrets Health
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homey-secrets-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: Refresh account token (rotates HOMEY_REFRESH_TOKEN)
        env:
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/ci/homey-token-refresh.js || true
      - name: Check secrets (read-only)
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_TOKEN: ${{ secrets.HOMEY_TOKEN }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/ci/homey-secrets-health.js
      - name: Upload status file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homey-secrets-health
          path: data/status/homey-secrets-health.json
          retention-days: 30
