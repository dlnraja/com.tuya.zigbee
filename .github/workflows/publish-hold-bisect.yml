# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Halves the held-driver group after an Athom AggregateError and re-dispatches the next half at
#   the next allowed slot (P3095).
# Ideas from (thank you): Athom's official Homey app GitHub Actions (athombv); the Homey developer docs on
#   build channels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P3095 (31/10/2026): AggregateError self-fix loop for config/publish-hold-drivers.json, 100% in GitHub Actions.
# Triggers: workflow_run (auto-publish finished) + cron hourly + workflow_dispatch | Secrets: GITHUB_TOKEN only.
# Reads the verdict artifact of the auto-publish run (Athom result as already classified there, no Athom call),
# runs one bisect step (.github/scripts/publish-hold-bisect.js), commits hold/state/ledger via bot-commit-guard,
# then dispatches auto-publish with the next group. The P3036 gate there still decides the slot + breaker.
name: Publish hold bisect (P3095)

on:
  workflow_run:
    workflows: ['Auto-Publish on Push']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed the queue with every held id not yet queued (true/false)'
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  GMAIL_DIAG_AI_MAX: '0'

defaults:
  run:
    shell: bash

concurrency:
  group: publish-hold-bisect
  cancel-in-progress: false

jobs:
  step:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master
          fetch-depth: 1
      - name: Read verdict of the finished auto-publish run
        if: github.event_name == 'workflow_run'
        run: |
          gh run download "${{ github.event.workflow_run.id }}" -n p3095-outcome -D p3095-in 2>/dev/null || echo "no p3095 verdict artifact (not a release_held upload)"
      - name: Bisect step + next dispatch decision
        id: s
        env:
          SEED: ${{ github.event.inputs.seed || 'false' }}
        run: |
          set -e
          [ "$SEED" = "true" ] && node .github/scripts/publish-hold-bisect.js seed
          if [ -f p3095-in/outcome.json ]; then
            o=$(node -e "const j=require('./p3095-in/outcome.json');console.log(j.outcome||'other')")
            r=$(node -e "const j=require('./p3095-in/outcome.json');console.log(j.released||'')")
            v=$(node -e "const j=require('./p3095-in/outcome.json');console.log(j.version||'')")
            PUBLISH_HOLD_RELEASE="$r" node .github/scripts/publish-hold-bisect.js after "$o" "$v" "" "${{ github.event.workflow_run.id }}"
          fi
          active=$(gh run list -w auto-publish-on-push.yml -b master -L 10 --json status -q '[.[]|select(.status!="completed")]|length' || echo 1)
          out=$(ACTIVE_RUNS="$active" node .github/scripts/publish-hold-bisect.js dispatch); echo "$out"
          rel=$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')
          echo "release=$rel" >> "$GITHUB_OUTPUT"
      - name: Commit hold / state / ledger (bot-commit-guard)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/publish-hold-drivers.json config/publish-hold-bisect-state.json docs/knowledge/athom-publish-outcomes.jsonl docs/status/publish-hold-isolated 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          bash scripts/ci/bot-commit-guard.sh
          git commit -m "chore(P3095): publish-hold bisect step [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0; sleep $((i*15)); done
          echo "::error::P3095 state push failed 3x"; exit 1
      - name: Dispatch auto-publish with the next group (P3036 gate decides the slot)
        if: steps.s.outputs.release != ''
        env:
          REL: ${{ steps.s.outputs.release }}
        run: gh workflow run auto-publish-on-push.yml --ref master -f release_held="$REL"
