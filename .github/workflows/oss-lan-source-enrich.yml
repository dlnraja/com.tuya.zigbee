# P2658 — OSS LAN source enrich (TinyTuya / HA tuya-local / Homey peers)
# Feeds complementary scanners + peer probe into data/ for algos. Never forum POST.
name: OSS LAN Source Enrich

on:
  schedule:
    # Tue/Fri 05:55 UTC — clear of Sunday peer-probe and blakadder 04:15
    - cron: '55 5 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # safe-auto-commit: single refusal comment on the tracking issue

concurrency:
  group: oss-lan-source-enrich
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'

jobs:
  enrich:
    name: Scan OSS LAN sources
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: npm ci (prefer) / npm install
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: TinyTuya scanner (complementary data)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scanners/tinytuya-scanner.js || echo "tinytuya soft-skip"

      - name: HA tuya-local scanner (complementary data)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scanners/tuya-local-scanner.js || echo "tuya-local soft-skip"

      - name: Homey Store peer probe
        continue-on-error: true
        run: npm run probe:homey-peers || echo "peer-probe soft-skip"

      - name: GitHub leads scan (issues, comments, peer apps, forks + branches; incremental)
        id: leads_scan
        continue-on-error: true
        timeout-minutes: 12
        env:
          # GITHUB_TOKEN only: read-only public API, no AI, hard request budget per run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scanners/github-leads-scan.js --max-requests=${{ vars.LEADS_SCAN_MAX_REQUESTS || '150' }} --min-delay=800 --max-delay=2500

      - name: Commit leads cursor + scan output (gated)
        if: steps.leads_scan.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=github-leads-scan \
            --message="chore(leads): incremental GitHub leads scan (cursor + output)" \
            --paths="docs/automation/leads-other-apps-cursor.json data/leads/github-leads.json data/leads/peer-flow-cards.json"

      # Spec 005/009: upstream thread index moved to johan-thread-intel.yml (daily).

      # P2791 — systematic image reading: issue/comment screenshots (interviews, DP logs, settings,
      # capability tables) are OCR'd locally with tesseract (free, no AI), capped per run, with a
      # resumable cursor. Output is a lead file only; nothing is applied from OCR text directly.
      - name: Install tesseract (free local OCR; best-effort)
        id: ocr_install
        if: vars.IMAGE_OCR_DISABLED != 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr >/dev/null 2>&1 || \
            { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr >/dev/null; }
          tesseract --version | head -1

      - name: Issue image OCR scan (capped, incremental)
        id: image_ocr
        if: vars.IMAGE_OCR_DISABLED != 'true' && steps.ocr_install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/scanners/issue-image-ocr.js \
            --max-issues=${{ vars.IMAGE_OCR_MAX_ISSUES || '40' }} \
            --max-images=${{ vars.IMAGE_OCR_MAX_IMAGES || '25' }} \
            --max-requests=${{ vars.IMAGE_OCR_MAX_REQUESTS || '150' }}

      - name: Commit image OCR cursor + output (gated)
        if: steps.image_ocr.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=image-ocr \
            --message="chore(leads): incremental issue image OCR (cursor + output)" \
            --paths="data/leads/image-ocr.json data/leads/image-ocr-cursor.json"

      # P2790 — strict-rule intake: exact mfr+pid in the source + exactly one driver already listing
      # that pid → fingerprint written; strong firmware keywords → quirk recorded as "documented";
      # new human comments on the tracking issue → same rule + ONE status reply. Everything else
      # stays a lead (data/leads/strict-apply-report.json). Kill switch: vars.STRICT_APPLY_DISABLED.
      - name: Strict-rule intake (leads, quirk records, tracking-issue triage)
        id: strict_apply
        if: vars.STRICT_APPLY_DISABLED != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull -q --rebase --autostash origin master || true
          node scripts/leads/strict-apply.js --source=leads --max=${{ vars.STRICT_APPLY_MAX || '5' }}
          node scripts/leads/strict-apply.js --source=quirks
          node scripts/leads/strict-apply.js --source=issue557 --max=${{ vars.STRICT_APPLY_MAX || '5' }} --reply
          # P2793 — max-coverage audit: known manufacturerName + externally sourced productId, exactly one
          # same-class driver, no couple on two drivers (data/leads/coverage-audit-report.json). Capped.
          node scripts/leads/coverage-audit.js --max=${{ vars.COVERAGE_AUDIT_MAX || '3' }}
          # P2794 — dual-couple classification, report only (data/leads/dual-couples.json); never removes.
          node scripts/leads/dual-couples.js
          # P2797 — gang patterns (1-gang vs multi-gang couples), report only (data/leads/gang-patterns.json).
          node scripts/leads/gang-patterns.js

      - name: Commit strict-rule intake (gated)
        if: steps.strict_apply.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=strict-apply \
            --message="feat(leads): strict-rule fingerprints / quirk records from sourced leads" \
            --paths="drivers app.json lib/data/firmware-quirks.json data/leads"

      - name: Contre quoi gates
        run: |
          npm run check:p2656
          npm run check:p2657
          npm run check:p2658

      - name: Upload scanner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-lan-source-data
          path: |
            data/scanners/
            reports/homey-store-peers-*/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit scanner outputs if changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanners/*.json reports/homey-store-peers-*/SUMMARY.md reports/homey-store-peers-*/athom-probe-wide.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No scanner data changes"
            exit 0
          fi
          git pull --rebase origin master || true
          git commit -m "chore(P2658): refresh TinyTuya/tuya-local/peer probe data [skip ci]"
          git push origin HEAD:master || true

  # P2790 — stable-v5 backport of device-compat-only couples written by the strict rule on master
  # (data/leads/auto-applied.json). Same driver must already list the pid on stable; [skip ci].
  stable-backport:
    name: Backport strict-rule couples to stable-v5
    needs: enrich
    if: always() && vars.STRICT_APPLY_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master
      - name: Checkout stable-v5
        uses: actions/checkout@v4
        with:
          ref: stable-v5
          path: stable
          fetch-depth: 20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Apply + commit (gated, [skip ci])
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: stable
        run: |
          node ../master/scripts/leads/strict-apply.js --source=backport --backport-from=../master --root=.
          if git diff --quiet; then echo "nothing to backport"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node ../master/scripts/ci/safe-auto-commit.js --id=stable-backport --branch=stable-v5 \
            --message="feat(leads): backport strict-rule device couples from master" \
            --paths="drivers app.json"
