# 🌍 Forum Poll (P69)
# Triggers: cron: 15 2,6,10,14,18,22 * * * + workflow_dispatch
# Secrets: GITHUB_TOKEN; HOMEY_EMAIL+HOMEY_PASSWORD (or DISCOURSE_API_KEY) for PM harvest only
# Never posts. PM + public scan + screenshot/media scan.
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: 🌍 Forum Poll (P69)

on:
  schedule:
    # Every 4 hours (02, 06, 10, 14, 18, 22 UTC). Coordinates with
    # - 02:00 UTC: mega-crawl (also polls forum)
    # - */4 cron: auto-enrich-closed-loop
    # Dedicated run for redundancy and clearer logs.
    - cron: '15 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Homey forum topic ID (default 140352 — Universal TUYA Zigbee)'
        required: false
        type: string
        default: '140352'
      max_posts:
        description: 'Max posts to fetch per topic'
        required: false
        type: string
        default: '40'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forum-poll
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  forum-poll:
    name: 🌍 Poll Homey Forum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Free reader fallback chain (Jina Reader keyless + Firecrawl if keyed)
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SMART_FETCH_READER_FALLBACK: '1'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install deps
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline --no-audit || npm install --no-audit
          else
            echo "No package.json"
          fi

      - name: 🌍 Poll Forum
        id: poll
        run: |
          TOPIC="${{ inputs.topic_id || '140352' }}"
          MAX="${{ inputs.max_posts || '40' }}"
          echo "## 🌍 Forum Poll" >> $GITHUB_STEP_SUMMARY
          echo "Topic ID: $TOPIC, Max posts: $MAX" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node tools/ci/forum-poll.js --topic="$TOPIC" --max="$MAX" 2>&1 | tee forum-poll.log || echo "FORUM_SKIP"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .github/state/forum/latest.json ]; then
            echo "### Latest forum state" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            head -c 2000 .github/state/forum/latest.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # READ-ONLY: scan own + satellite threads. NEVER posts. Prefer silent enrichment (T157628).
      - name: 🔇 Silent multi-topic forum scan
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          SMART_FETCH_READER_FALLBACK: '1'
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REPLY_TOPICS: '140352'
          FORUM_AUTO_POST: '0'
        run: |
          echo "## 🔇 Silent multi-topic scan (SHADOW — no replies / no AI paste)" >> $GITHUB_STEP_SUMMARY
          MAX="${{ inputs.max_posts || '40' }}"
          export SHADOW_FORUM=1 DISCOURSE_WRITE=0 FORUM_AUTO_POST=0 REPLY_TOPICS=
          if [ -f tools/ci/forum-silent-multi-scan.js ]; then
            node tools/ci/forum-silent-multi-scan.js --max="$MAX" 2>&1 | tee forum-silent-multi.log || echo "SILENT_SCAN_SKIP"
          else
            echo "forum-silent-multi-scan.js missing — skip"
          fi
          if [ -f tools/ci/silent-enrichment-orchestrator.js ]; then
            echo "## 🔇 Silent enrichment (forum+sync+investigate need-action, no user wait)" >> $GITHUB_STEP_SUMMARY
            node tools/ci/silent-enrichment-orchestrator.js --phase=forum --skip-scan 2>&1 | tee forum-enrich.log || echo "ENRICH_ORCH_WARN"
            node tools/ci/silent-enrichment-orchestrator.js --phase=gates --skip-scan 2>&1 | tee forum-gates.log || echo "GATES_WARN"
          elif [ -f tools/ci/forum-actionable-processor.js ]; then
            echo "## 📋 Forum actionable processor (P2210 — post-by-post cross-ref)" >> $GITHUB_STEP_SUMMARY
            node tools/ci/forum-actionable-processor.js 2>&1 | tee forum-actionable-processor.log || echo "PROCESSOR_SKIP"
          fi
          if [ -f tools/ci/forum-ai-paste-gate.js ]; then
            node tools/ci/forum-ai-paste-gate.js --scan-defaults || echo "AI_PASTE_GATE_WARN"
          fi
          if [ -f .github/state/forum/multi-silent-digest.json ]; then
            echo "### Digest totals" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "const d=require('./.github/state/forum/multi-silent-digest.json'); console.log(JSON.stringify({totals:d.totals,topics:d.topics.map(t=>({id:t.id,scanned:t.scanned,actionable:(t.actionable||[]).length,newFP:(t.newFPs||[]).length,err:t.error})),null,2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f .github/state/forum/actionable-processor-report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "const r=require('./.github/state/forum/actionable-processor-report.json'); console.log(JSON.stringify(r.totals,null,2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f .github/state/forum/topic-140352-parse.json ]; then
            echo "### Topic 140352 parse (P2214)" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "const r=require('./.github/state/forum/topic-140352-parse.json'); console.log(JSON.stringify({liveHighest:r.analysis.liveHighest,digestHighest:r.analysis.digestHighestActionable,gap:r.analysis.newPostsSinceDigestScan,status:r.analysis.status},null,2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/forum-verify-$(date -u +%F)/NEED_ACTION.md ]; then
            echo "### NEED_ACTION auto-investigate (shadow)" >> $GITHUB_STEP_SUMMARY
            head -n 25 "reports/forum-verify-$(date -u +%F)/NEED_ACTION.md" >> $GITHUB_STEP_SUMMARY || true
          fi
          # P2225: inventory + critical-first Homey-gap stacks (SHADOW)
          if [ -f tools/ci/inventory-features-bugs.js ]; then
            node tools/ci/inventory-features-bugs.js --write-report || echo "INVENTORY_WARN"
            echo "### Features + bugs inventory" >> $GITHUB_STEP_SUMMARY
            head -n 30 "reports/resilience-$(date -u +%F)/INVENTORY.md" >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f tools/ci/project-resilience-orchestrator.js ]; then
            node tools/ci/project-resilience-orchestrator.js --write-report --critical-first --critical-only || echo "RESILIENCE_CRITICAL_WARN"
          fi
          echo "Policy: SHADOW forum — implement silently, never paste unchecked AI." >> $GITHUB_STEP_SUMMARY

      # READ-ONLY: image alts, download URLs, diag UUIDs on public threads. Never posts.
      - name: 🖼️ Forum media / screenshot scan
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMART_FETCH_READER_FALLBACK: '1'
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FORUM_AUTO_POST: '0'
        run: |
          echo "## 🖼️ Forum media deep scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tools/ci/forum-media-deep-scan.js ]; then
            node tools/ci/forum-media-deep-scan.js --max=40 --topics=140352,26439,89271 || echo "MEDIA_SCAN_SKIP"
          else
            echo "forum-media-deep-scan.js missing — skip"
          fi

      - name: 🔇 Forum PM read-only (SSO, never POST)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_USERNAME: dlnraja
          FORUM_USERNAME: dlnraja
          FORUM_AUTO_POST: '0'
          DRY_RUN: 'true'
          FORUM_PM_MAX_THREADS: '20'
        run: |
          echo "## 🔇 Forum private messages (read-only)" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${HOMEY_EMAIL:-}" ] && [ -z "${DISCOURSE_API_KEY:-}" ]; then
            echo "No HOMEY_EMAIL or DISCOURSE_API_KEY — skip PM harvest"
            exit 0
          fi
          if [ -f tools/ci/forum-pm-read-only.js ]; then
            node tools/ci/forum-pm-read-only.js
          else
            echo "forum-pm-read-only.js missing — skip"
          fi
          if [ -f .github/state/forum/pm-inbox.json ]; then
            echo "PM harvest written (never posted)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🛡️ P2138 sacred-couple matrix (checkout integrity)
        if: always()
        run: node tools/ci/p2138-sacred-couple-matrix-gate.js

      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: forum-poll
          path: |
            .github/state/forum/
            .github/state/forum-activity-data.json
            forum-poll.log
            forum-silent-multi.log
            forum-actionable-processor.log
            reports/forum-verify-*/
          if-no-files-found: warn
          retention-days: 7
