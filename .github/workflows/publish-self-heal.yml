name: 🩹 Publish Self-Heal

# Auto-runs periodically to detect stuck/failed publishes and re-trigger them.
# Catches the "stuck past 60min timeout" pattern that GHA sometimes has.
# Runs every 4h, 2h after the scheduled publish-stable cron.

on:
  schedule:
    # Every 4 hours, offset from mega-crawl and publish schedules
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
defaults:
  run:
    shell: bash


concurrency:
  group: publish-self-heal
  cancel-in-progress: true

jobs:
  heal:
    name: 🩹 Self-heal stuck publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🔍 Find recent publish runs
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # P139/P195: watch master Auto-Publish only. Never cancel/re-run
          # Publish Stable→Test — shared App ID would overwrite the 9.0.x soak.
          STUCK_RUNS=$(gh run list \
            --workflow "Auto-Publish on Push" \
            --limit 5 \
            --json databaseId,status,createdAt,updatedAt \
            | python3 scripts/ci/find-stuck-runs.py)
          echo "## 🔍 Stuck Auto-Publish runs (>90 min in_progress)" >> $GITHUB_STEP_SUMMARY
          echo "$STUCK_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "stuck_runs=$STUCK_RUNS" >> $GITHUB_OUTPUT

      - name: 🛑 Cancel stuck runs
        if: steps.find.outputs.stuck_runs != 'OK'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🛑 Cancelling stuck Auto-Publish runs" >> $GITHUB_STEP_SUMMARY
          for run_id in $(echo "${{ steps.find.outputs.stuck_runs }}" | awk '{print $1}'); do
            echo "- Cancelling $run_id" >> $GITHUB_STEP_SUMMARY
            gh run cancel "$run_id" 2>&1 || true
          done

      - name: 🔁 Re-trigger Auto-Publish (master only)
        if: steps.find.outputs.stuck_runs != 'OK'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🔁 Re-triggering Auto-Publish on Push (master)" >> $GITHUB_STEP_SUMMARY
          echo "P139: never workflow-run Publish Stable→Test from self-heal." >> $GITHUB_STEP_SUMMARY
          gh workflow run "Auto-Publish on Push" --ref master 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: ✅ All good
        if: steps.find.outputs.stuck_runs == 'OK'
        run: |
          echo "## ✅ No stuck publish runs detected" >> $GITHUB_STEP_SUMMARY
