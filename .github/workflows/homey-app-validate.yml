# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Runs homey app validate at every level on code changes.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
name: Homey App Validate (all levels)
on:
  # P3026: docs/reports-only pushes cannot change what Homey validates; skip them to save runner
  # slots (20 concurrent jobs on the Free plan). No required status check depends on this workflow.
  pull_request:
    paths-ignore: ['docs/**', 'reports/**', '**/*.md']
  push:
    branches: [master, stable-v5, bastien-home]
    paths-ignore: ['docs/**', 'reports/**', '**/*.md']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: homey-app-validate-${{ github.ref }}
  # P3069: a push run finishes and newer pushes wait as one queued run (no extra minutes); PRs still cancel.
  # See docs/knowledge/CI_CONCURRENCY.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: homey app validate --level debug (blocking)
        run: bash scripts/ci/homey-validate-safe.sh --level debug
      - name: homey app validate --level publish (blocking)
        run: bash scripts/ci/homey-validate-safe.sh --level publish
      - name: homey app validate --level verified (report only)
        continue-on-error: true
        run: bash scripts/ci/homey-validate-safe.sh --level verified 2>&1 | tee /tmp/verified.log; exit ${PIPESTATUS[0]}
      - name: Publish payload build + size/structure report
        if: always()
        run: |
          rm -rf /tmp/homey-publish-temp
          npx homey app build >/dev/null 2>&1 || true
          node scripts/prepare-publish.js >/tmp/prepare.log 2>&1 || { tail -20 /tmp/prepare.log; exit 1; }
          cd /tmp/homey-publish-temp
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, collections
          a = json.load(open('app.json'))
          ids = [d['id'] for d in a['drivers']]
          combos = sum(len((d.get('zigbee') or {}).get('manufacturerName') or []) * len((d.get('zigbee') or {}).get('productId') or []) for d in a['drivers'])
          fids = [c['id'] for k in a.get('flow', {}) for c in a['flow'][k]]
          size = sum(os.path.getsize(os.path.join(p, f)) for p, _, fs in os.walk('.') if 'node_modules' not in p for f in fs)
          print(f"### Publish payload v{a['version']}")
          print(f"- drivers: {len(ids)} (dup ids: {[k for k, v in collections.Counter(ids).items() if v > 1]})")
          print(f"- zigbee mfr×pid combos: {combos}")
          print(f"- flow cards: {len(fids)} (dup ids: {sum(1 for v in collections.Counter(fids).values() if v > 1)})")
          print(f"- app.json: {os.path.getsize('app.json')/1e6:.2f} MB, payload (no node_modules): {size/1e6:.1f} MB")
          PY
      - name: Manifest processor audit (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          [ -f scripts/validate/manifest-processor-audit.js ] || { echo "audit script missing"; exit 0; }
          for p in .homeybuild/app.json /tmp/homey-publish-temp/app.json; do
            [ -f "$p" ] && { echo "### Processor audit: $p" | tee -a "$GITHUB_STEP_SUMMARY"; node scripts/validate/manifest-processor-audit.js "$p" 2>&1 | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"; }
          done
          exit 0
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Runs homey app validate at every level on code changes."; else s="Stopped early ($JOB_STATUS); the red step above says why. Runs homey app validate at every level on code changes."; fi
          node scripts/lib/report-writer.js --title "homey-app-validate" --summary "$s" --headers "item|value" --row "job|validate" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
