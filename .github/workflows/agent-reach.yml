# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Cross-checks the forum watchers through a second free channel (RSS / web readers) and reports
#   channel health.
# Ideas from (thank you): the Homey Community forum members who share fingerprints and diagnostics (read-only,
#   never quoted); Discourse for its public JSON/RSS endpoints; Panniantong/agent-reach for the multi-channel
#   reader idea.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# 🛰️ Agent Reach — free channel layer (RSS / web-readers / health)
# Integrates Panniantong/agent-reach (https://github.com/Panniantong/agent-reach)
# as a cross-check channel for the forum monitors: its RSS backend
# (feedparser) parses the Homey community feeds independently from the
# Discourse JSON scrapers, and `agent-reach doctor` gives a channel-health
# signal. Web reading itself is covered by lib/scraper/reader-fallback.js
# (Jina Reader — the same backend Agent Reach's web channel routes to).
# Schedule: weekly Monday ~04:42 UTC + workflow_dispatch.

name: 🛰️ Agent Reach Channels

on:
  schedule:
    - cron: '42 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-reach
  cancel-in-progress: false

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  agent-reach:
    name: 🛰️ Agent Reach RSS cross-check + doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: 📦 Install Agent Reach (pinned commit)
        run: |
          # Pinned to a reviewed commit, not a floating branch.
          pip install "https://github.com/Panniantong/agent-reach/archive/c1eecd61bf42.zip"

      - name: 🩺 Channel health (doctor)
        continue-on-error: true # doctor exits non-zero when any channel is down — that IS the report
        run: |
          mkdir -p .github/state
          agent-reach doctor --json > .github/state/agent-reach-health.json || true
          agent-reach doctor || true

      - name: 📡 RSS cross-check (forum feeds via Agent Reach backend)
        run: |
          python - <<'PY'
          import json, time
          import feedparser

          FEEDS = {
              "posts": "https://community.homey.app/posts.rss",
              "topic-140352": "https://community.homey.app/t/app-pro-universal-tuya-zigbee-device-app-test/140352.rss",
          }
          out = {"fetchedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "feeds": {}}
          for name, url in FEEDS.items():
              feed = feedparser.parse(url)
              entries = [{
                  "title": e.get("title", ""),
                  "link": e.get("link", ""),
                  "published": e.get("published", ""),
                  "author": e.get("author", ""),
              } for e in feed.entries[:25]]
              out["feeds"][name] = {"count": len(feed.entries), "latest": entries}
              print(f"{name}: {len(feed.entries)} entries")
          with open(".github/state/forum-rss-crosscheck.json", "w") as fh:
              json.dump(out, fh, indent=1)
          PY

      - name: 📤 Upload state artifacts
        # .github/state is gitignored in this repo (volatile by design), so
        # results ship as run artifacts instead of commits.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: agent-reach-state
          path: |
            .github/state/agent-reach-health.json
            .github/state/forum-rss-crosscheck.json
          retention-days: 30
