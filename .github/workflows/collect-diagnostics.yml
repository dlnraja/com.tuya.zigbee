# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Weekly collection of diagnostics into a report artifact.
# Ideas from (thank you): Homey users who send diagnostic reports by mail; the Homey developer docs on app
#   diagnostics.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# 🇺‌🇳‌🇮‌🇫‌🇮‌🇪‌🇩‌ ‌🇨‌🇴‌🇳‌🇸‌🇴‌🇱‌🇮‌🇩‌🇦‌🇹‌🇮‌🇴‌🇳‌ ‌🇻‌8‌.‌5‌.‌1‌7‌ — ENABLED
name: Collect Diagnostics
# <!-- badges:start -->
# [![Collect Diagnostics](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/collect-diagnostics.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/collect-diagnostics.yml)
# <!-- badges:end -->


on:
  schedule:
    - cron: '15 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: collect-diagnostics
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --prefer-offline --no-audit || npm install

      - name: Collect diagnostics from all sources
        continue-on-error: true
        env:
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/collect-diagnostics.js
      - name: Privacy gate for collected diagnostics
        if: always()
        run: node .github/scripts/privacy-redactor.js diagnostics .github/state/diagnostics-report.json .github/state/homey-device-report.json

      - name: "Regression lessons gate (MUST-KEEP fatals)"
        if: always()
        run: node tools/ci/regression-lessons-gate.js

      - name: "P100 Diag protocol gate (crash + sacred-couple cross-ref + dry apply)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm run check:diag-protocol || true
          node .github/scripts/privacy-redactor.js \
            .github/state/gmail-crash-patterns.json \
            .github/state/gmail-unique-fps.json \
            .github/state/gmail-fps-crossref-v2.json \
            .github/state/sacred-couple-dry-gate.json || true

      - name: "Light Z2M/ZHA sync (best-effort, OOM-safe)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ vars.FIRECRAWL_DISABLED != 'true' && secrets.FIRECRAWL_API_KEY || '' }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          if [ ! -f tools/ci/mega-crawler.js ]; then
            echo "mega-crawler missing — skip light sync"
            exit 0
          fi
          timeout 200 npm run sync:z2m-zha:light || echo "z2m/zha light sync skipped/failed (non-blocking)"

      - name: "🔍 Infer-enrich from incomplete (dry-run report)"
        if: always()
        continue-on-error: true
        run: node tools/ci/infer-enrich-from-incomplete.js --dry-run || true

      - name: Commit diagnostics
        continue-on-error: true
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "diagnostics" ] && [ "$(ls -A diagnostics/ 2>/dev/null)" ]; then
            node .github/scripts/privacy-redactor.js diagnostics .github/state/diagnostics-report.json .github/state/homey-device-report.json .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json
            git add diagnostics/ .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json .github/state/sacred-couple-dry-gate.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              [ -f scripts/ci/bot-commit-guard.sh ] && { bash scripts/ci/bot-commit-guard.sh || exit 1; }  # P3093
              git commit -m "Diagnostics update $(date -u +%Y-%m-%d) [skip ci]"
              bash scripts/ci/verified-git-push.sh master
            else
              echo "No diagnostic changes to commit"
            fi
          else
            echo "::warning::diagnostics/ directory is empty or missing — skipping commit"
          fi

      - name: "Pattern Detector (analyze collected diagnostics)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: node .github/scripts/pattern-detector.js

      - name: "Resolution Summary"
        if: always()
        continue-on-error: true
        run: node .github/scripts/resolution-summary.js

      - name: Privacy gate before artifact upload
        if: always()
        run: node .github/scripts/privacy-redactor.js diagnostics

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: diagnostics-summary-${{ github.run_id }}
          path: |
            diagnostics/summary.json
            .github/state/infer-enrich-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify artifact upload
        continue-on-error: true
        if: always()
        run: |
          if [ -f "diagnostics/summary.json" ]; then
            echo "Diagnostics summary ready for upload"
          else
            echo "::warning::diagnostics/summary.json not found — diagnostics collection may have failed"
          fi

      # P3021b: ledger wiring (same pattern as gmail-diagnostics P2908 / forum-poll P2909).
      - name: Ledger intake (P3021b)
        id: p3021b_ledger
        if: always()
        continue-on-error: true
        run: |
          git pull -q --ff-only origin master || echo "::warning::ledger intake: could not fast-forward, writing on the checkout"
          node scripts/progress/ledger-intake.js diag .github/state/diagnostics-report.json --by=collect-diagnostics --queue=.github/state/diag-ledger-queue-collect-diagnostics.json --max=100
      - name: Commit ledger (gated, P3021b)
        if: always() && steps.p3021b_ledger.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=collect-diagnostics-ledger --max-per-day=4 \
            --message="chore(ledger): collect-diagnostics findings" \
            --paths="data/progress/ledger.json"
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly collection of diagnostics into a report artifact."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly collection of diagnostics into a report artifact."; fi
          node scripts/lib/report-writer.js --title "collect-diagnostics" --summary "$s" --headers "item|value" --row "job|collect" --row "result|$JOB_STATUS" --thanks "Homey users who send diagnostic reports by mail" --thanks "the Homey developer docs on app diagnostics" >> "$GITHUB_STEP_SUMMARY" || true
