# Universal Tuya Zigbee - Monthly Device Scan
# v9.0.34 - Updated 2026-06-15
# Scans Z2M for new Tuya devices and creates issues for missing fingerprints

name: 📡 Monthly Device Scan

# <!-- badges:start -->
# [![📡 Monthly Device Scan](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/monthly-scan.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/monthly-scan.yml)
# <!-- badges:end -->


on:
  schedule:
    - cron: '43 0 1 * *'  # 1st of month at 00:43 UTC (staggered: was 00:00, avoids simultaneous monthly runs)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-scan
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  scan:
    name: 🔍 Scan Z2M for New Devices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # AI providers — circular chain (ai-helper.js handles rate limiting)
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || '' }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY || '' }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || '' }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit || npm install

      - name: 🔍 Scan zigbee2mqtt converters
        run: |
          echo "## 📡 Z2M Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "Scanning zigbee2mqtt for new Tuya devices..."
          curl -s https://raw.githubusercontent.com/Koenkk/zigbee-herdsman-converters/master/src/devices/tuya.ts > /tmp/tuya.ts
          # Match both _TZ3000 and _TZE200/_TZE204/_TZE284 patterns
          grep -oE "_T[A-Z][A-Za-z0-9]{3,5}_[a-z0-9]{4,16}" /tmp/tuya.ts | sort -u > /tmp/z2m_ids.txt
          Z2M_COUNT=$(wc -l < /tmp/z2m_ids.txt)
          echo "Found $Z2M_COUNT manufacturer IDs in Z2M"
          echo "| Source | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Z2M Total | $Z2M_COUNT |" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Compare with current DB
        continue-on-error: true
        id: compare
        run: |
          echo "Comparing with existing manufacturerName entries..."
          grep -ohE '"_T[A-Z][A-Za-z0-9_]+"' drivers/*/driver.compose.json | tr -d '"' | sort -u > /tmp/current_ids.txt
          CURRENT_COUNT=$(wc -l < /tmp/current_ids.txt)
          comm -23 /tmp/z2m_ids.txt /tmp/current_ids.txt > /tmp/missing_ids.txt
          MISSING_COUNT=$(wc -l < /tmp/missing_ids.txt)
          echo "Current IDs: $CURRENT_COUNT"
          echo "Missing IDs: $MISSING_COUNT"
          echo "| Current App | $CURRENT_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Missing | $MISSING_COUNT |" >> $GITHUB_STEP_SUMMARY
          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Missing IDs (first 20)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 /tmp/missing_ids.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "has_missing=true" >> $GITHUB_OUTPUT
          else
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Persist missing IDs for enrich
        if: steps.compare.outputs.has_missing == 'true'
        run: |
          mkdir -p .github/state
          node -e "
            const fs=require('fs');
            const missing=fs.readFileSync('/tmp/missing_ids.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
            const out={
              generatedAt:new Date().toISOString(),
              source:'monthly-scan-z2m',
              missingMfrs:missing,
              issues:[]
            };
            fs.writeFileSync('.github/state/bot-auto-scan-candidates.json', JSON.stringify(out,null,2)+'\n');
            console.log('Queued', missing.length, 'missing mfrs');
          "

      - name: Create issue if new devices found
        continue-on-error: true
        if: steps.compare.outputs.has_missing == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const missing = fs.readFileSync('/tmp/missing_ids.txt', 'utf8').trim();
            if (missing) {
              // Avoid duplicate open [Auto] Z2M issues — update latest open if present
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'auto-scan',
                per_page: 20,
              });
              const existing = (open.data || []).find(i =>
                String(i.title || '').startsWith('[Auto] New Tuya devices found in zigbee2mqtt')
              );
              const body = `Monthly scan found new manufacturerName IDs:\n\`\`\`\n${missing}\n\`\`\`\nQueued for enrich; bot triage will close after processing.`;
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.setOutput('issue_number', String(existing.number));
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '[Auto] New Tuya devices found in zigbee2mqtt',
                  body,
                  labels: ['enhancement', 'auto-scan']
                });
                core.setOutput('issue_number', String(created.data.number));
              }
            }

      - name: Treat & close bot auto-scan issue
        continue-on-error: true
        if: steps.compare.outputs.has_missing == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ALLOW_BOT_ISSUE_CLOSE: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/ci/auto-bot-issue-triage.js

      - name: Commit scan state
        continue-on-error: true
        if: steps.compare.outputs.has_missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/bot-auto-scan-candidates.json .github/state/bot-issue-triage-report.json || true
          if ! git diff --cached --quiet; then
            git pull --rebase origin master || true
            git commit -m "auto: monthly Z2M scan candidates [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          fi
