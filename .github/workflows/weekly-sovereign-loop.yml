# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Weekly heavy pass on free GitHub minutes; later automation only reads its report.
# Ideas from (thank you): Renovate and Dependabot for the merge-when-green pattern; the actions/stale and
#   actions/labeler maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Weekly Sovereign Loop (P136) — quota-safe autopilot backbone
# Heavy work on GitHub Actions free minutes. Cursor Automation (weekly) only reads the report
# and applies bounded reliability fixes — does NOT re-run mega crawls.

name: Weekly Sovereign Loop

on:
  schedule:
    # Sundays 06:20 UTC — once/week, clear of temporal-monitor (06:00), mega-crawl (02:00), P32 (03:30)
    - cron: '20 6 * * 0'
  workflow_dispatch:
    inputs:
      dispatch_sources:
        description: 'Also dispatch mega-crawl / gmail / forum / triage / publish-diagnose / safe-sync / self-improve'
        type: boolean
        default: true

concurrency:
  group: weekly-sovereign-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read
  checks: read

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  sovereign:
    name: Weekly loop + report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Ensure state dirs
        run: mkdir -p .github/state reports

      - name: Install deps (for matrix gate)
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: Rules gates (shared, core)
        uses: ./.github/actions/rules-gates

      - name: Run weekly sovereign loop
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            export GH_TOKEN="$GH_PAT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dispatch_sources }}" = "true" ]; then
            ARGS="--dispatch"
          fi
          # Soft-fail overall so the report always uploads; Cursor brain reads recommendations
          set +e
          node tools/ci/weekly-sovereign-loop.js $ARGS
          CODE=$?
          set -e
          echo "loop_exit=$CODE" >> "$GITHUB_OUTPUT"
          echo "loop_exit=$CODE" >> "$GITHUB_ENV"
          exit 0
        id: loop

      - name: Upload weekly report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: weekly-sovereign-loop
          path: |
            reports/WEEKLY_SOVEREIGN_LOOP.md
            .github/state/weekly-sovereign-loop.json
          if-no-files-found: warn

      - name: Commit report if changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .github/state/** is gitignored — only commit the markdown report Cursor reads
          git add reports/WEEKLY_SOVEREIGN_LOOP.md || true
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          # Commit BEFORE pull — avoids "index contains uncommitted changes" rebase failure
          git commit -m "chore(P136): weekly sovereign loop report [skip ci]" || exit 0
          # Verified push — P3025 shared bounded rebase-retry (step continue-on-error handles soft failure)
          bash .github/scripts/git-push-retry.sh --branch master

      - name: Summary
        run: |
          {
            echo "## Weekly Sovereign Loop"
            echo ""
            echo "loop_exit=\`${loop_exit:-n/a}\`"
            echo ""
            if [ -f reports/WEEKLY_SOVEREIGN_LOOP.md ]; then
              head -n 100 reports/WEEKLY_SOVEREIGN_LOOP.md
            else
              echo "Report missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # P2936: full cross-research of every item this workflow handles (kill switch: vars.XR_ENABLED=false,
  # report-only: vars.XR_APPLY=false). Bounded (max items, net/OCR caps), cached, no paid API.
  cross-research:
    needs: [sovereign]
    if: ${{ always() && vars.XR_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
    concurrency:
      group: cross-research-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: ./.github/actions/cross-research
        env:
          XR_ENABLED: ${{ vars.XR_ENABLED }}
          XR_APPLY: ${{ vars.XR_APPLY }}
        with:
          items: all
          max: '500'
          id: xr-weekly-sovereign-loop
