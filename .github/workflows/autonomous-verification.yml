# Autonomous Verification (P37)
# Triggers: cron: 15 */6 * * * + workflow_dispatch | Secrets: GITHUB_TOKEN only
# + ci-health job (free replacement for the Grok "Homey CI health" routine): red/green of every
#   workflow on master + stable-v5, comments on the "🤖 Daily digest" issue only on transitions.
#   Runs only on its own weekday crons (08:30 + 16:15 Paris) or manual dispatch, never on the 6-hourly cron.
# Doc header added 2026-07-29 (workflows genealogy enrichment).

defaults:
  run:
    shell: bash

name: Autonomous Verification (P37)

on:
  # Every 6 hours
  schedule:
    - cron: '15 */6 * * *'
    # ci-health job only (verify job ignores these): ≈08:30 and 16:15 Paris on weekdays,
    # summer/winter pairs filtered by scripts/digest/tz-guard.js
    - cron: '30 6 * * 1-5'   # 08:30 Paris (CEST)
    - cron: '30 7 * * 1-5'   # 08:30 Paris (CET)
    - cron: '15 14 * * 1-5'  # 16:15 Paris (CEST)
    - cron: '15 15 * * 1-5'  # 16:15 Paris (CET)
  # Manual trigger
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Run full verification suite'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: autonomous-verification
  cancel-in-progress: false
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  verify:
    name: Run autonomous verification
    # only the original 6-hourly cron (the weekday crons belong to ci-health)
    if: github.event_name != 'schedule' || github.event.schedule == '15 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install
        run: npm ci || npm install

      - name: Run P37 verification
        run: |
          echo "═══ P37 Autonomous Verification ═══"
          node tools/ci/test-multichannel.js
          echo ""
          echo "═══ TITAN v5 compliance ═══"
          node -e "
            const fs=require('fs');
            const FILES=['lib/multichannel/ChannelAdapters.js','lib/multichannel/MultiChannelManager.js','lib/multichannel/ParallelDetector.js','lib/multichannel/TransmissionManager.js','lib/multichannel/ReceptionManager.js','lib/autonomous/AutonomousVerificationEngine.js','lib/security/SecurityGuard.js'];
            let clean=true;
            for(const f of FILES){
              if(!fs.existsSync(f))continue;
              const c=fs.readFileSync(f,'utf8');
              if(/\bsetTimeout\s*\(/.test(c)&&!/safeSetTimeout/.test(c)){console.log('  ❌',f,'raw setTimeout');clean=false;}
              if(/\bsetInterval\s*\(/.test(c)&&!/safeSetInterval/.test(c)){console.log('  ❌',f,'raw setInterval');clean=false;}
              if(/this\.setCapabilityValue\s*\(/.test(c)){console.log('  ❌',f,'raw setCapabilityValue');clean=false;}
            }
            if(clean)console.log('  ✅ TITAN v5 PASS');
          "
          echo ""
          echo "═══ Module integrity ═══"
          node -e "
            const M=require('./lib/multichannel');
            const A=require('./lib/autonomous');
            const S=require('./lib/security/SecurityGuard');
            console.log('  MultiChannelManager:',typeof M.MultiChannelManager);
            console.log('  ParallelDetector:',typeof M.ParallelDetector);
            console.log('  TransmissionManager:',typeof M.TransmissionManager);
            console.log('  ReceptionManager:',typeof M.ReceptionManager);
            console.log('  AutonomousVerificationEngine:',typeof A.AutonomousVerificationEngine);
            console.log('  SecurityGuard:',typeof S.SecurityGuard);
            console.log('  ✅ All modules loadable');
          "

  ci-health:
    name: 🩺 CI health (master + stable-v5 → tracking issue)
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      (github.event_name != 'schedule' || github.event.schedule != '15 */6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    concurrency:
      group: digest-ci-health
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout (scripts only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/digest
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=${{ startsWith(github.event.schedule, '30 ') && '8' || '16' }}
      - name: 🎲 Start jitter (0–120 s, scheduled runs only)
        if: github.event_name == 'schedule' && steps.tz.outputs.run == 'true'
        run: sleep $((RANDOM % 121))
      - name: 🩺 CI health
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_BRANCHES: master,stable-v5
        run: node scripts/digest/ci-health.js
