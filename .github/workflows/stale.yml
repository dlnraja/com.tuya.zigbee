# <<< about
# Mark Stale Issues & PRs
# Triggers: cron: 0 5 * * 1 + workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: "Mark Stale Issues & PRs"

# <!-- badges:start -->
# [![Stale Issues & PRs](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/stale.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/stale.yml)
# <!-- badges:end -->


on:
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  stale:
    name: "Mark Stale Issues & PRs (Never Close)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 45
          days-before-close: -1
          stale-issue-message: >
            This issue has been automatically marked as **stale** because it has not had
            recent activity. It will remain open until a maintainer acts after user confirmation.


            If your device is still not working:

            1. Update to the **[latest test version](https://homey.app/a/com.dlnraja.tuya.zigbee/test/)**

            2. **Remove and re-pair** your device

            3. Share a new diagnostic report on the [Forum](https://community.homey.app/t/140352)
          stale-pr-message: >
            This PR has been automatically marked as **stale**. If the fingerprints
            in this PR are not yet supported, please comment to keep it open.
            It will not be closed automatically.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,enhancement,auto-fix,community-sync,new-device,needs-info"
          exempt-pr-labels: "pinned,security,auto-fix,new-device,pr-fingerprints"
          exempt-all-assignees: true
          operations-per-run: 100
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly marking of stale issues and PRs."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly marking of stale issues and PRs."; fi
          node scripts/lib/report-writer.js --title "stale" --summary "$s" --headers "item|value" --row "job|stale" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" --thanks "the actions/stale maintainers" >> "$GITHUB_STEP_SUMMARY" || true
