# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Collects manufacturer/product pairs from every public source and our own diagnostics, with
#   device-truth locks.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors; the
#   zigpy / ZHA device handler authors; Blakadder's Zigbee device database; JohanBendz's original Tuya Zigbee
#   app (read-only reference).
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Market couples intake (P2231 / P2232)
# Max-source sacred-couple harvest:
#   Blakadder + Z2M + ZHA + deCONZ + Johan + Gmail/diag/crash + forum SHADOW
#   + interviews + device-truth locks + own GitHub intel
# Soft adaptive heuristic (fingerprint-matcher) → NEED_REVIEW only (never applySafe alone)
name: 📡 Market Couples Intake

on:
  schedule:
    # After blakadder-fetch (04:15 UTC) and issue-triage (04:45 UTC), before auto-enrich peak
    - cron: '50 4 * * *'
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Refresh Blakadder/Z2M/ZHA crawlers before cross-ref'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Skip git commit (artifact only)'
        required: false
        type: boolean
        default: false
      apply_safe:
        description: 'Apply apply-safe couples (registry/truth/exact/interview/Z2M)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write  # safe-auto-commit: single refusal comment on the tracking issue
  actions: read  # download digest-leads artifacts (feedback loop)

concurrency:
  group: market-couples-intake
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  # Soft adaptive heuristic ON for NEED_REVIEW hints (same kill-switch as Homey runtime)
  TUYA_FP_HEURISTIC: '1'
  SMART_FETCH_READER_FALLBACK: '1'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  intake:
    name: 📡 Harvest mfr+pid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FIRECRAWL_API_KEY: ${{ vars.FIRECRAWL_DISABLED != 'true' && secrets.FIRECRAWL_API_KEY || '' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install deps
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: Restore intel scraper cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/scraper-cache/
            .cache/scanner-blobs/
          key: ${{ runner.os }}-market-couples-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-market-couples-
            ${{ runner.os }}-intel-cache-

      - name: ♻️ Restore rules-digest (rebuilt only when docs/rules change)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .github/state/rules-digest.json
          key: rules-digest-${{ hashFiles('CORE_RULES.md', 'AGENTS.md', 'AI_CONTEXT_MANDATE.md', 'CONTRIBUTING.md', 'docs/rules/**', 'docs/ARCHITECTURAL_RULES.md', 'docs/DRIVER_MAPPING_POLICY.md', 'docs/DP_MAPPING_REFERENCE.md', 'docs/knowledge/DEVICE_TRUTH.md', '.cursor/rules/**', 'CHANGELOG.md', 'README.md', '.homeychangelog.json', 'docs/automation/**', 'scripts/digest/rules-digest.js') }}

      - name: 🔁 Feedback loop — merge digest leads (issues/PRs, JohanBendz, forum, git history, OCR, links)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Latest daily-digest runs (artifacts kept 14 d); bounded to 12 runs. Heuristic leads are
          # promoted only when externally verified (scripts/digest/leads-merge.js) and none of the
          # digest labels is an apply-safe tier — they only add evidence / review lines.
          mkdir -p digest-leads-in
          for RID in $(gh run list -R "$GITHUB_REPOSITORY" -w daily-digest.yml -L 12 --json databaseId -q '.[].databaseId'); do
            gh run download "$RID" -R "$GITHUB_REPOSITORY" -p 'digest-leads-*' -D "digest-leads-in/$RID" >/dev/null 2>&1 || true
          done
          node scripts/digest/leads-merge.js digest-leads-in
          cat .github/state/digest-leads/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 📡 Market couples intake (P2232 max-source)
        id: intake
        run: |
          ARGS=""
          if [ "${{ inputs.crawl }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--crawl"
          fi
          echo "## 📡 Market couples intake (P2231/P2232)" >> $GITHUB_STEP_SUMMARY
          echo "Sources: Blakadder · Z2M · ZHA · deCONZ · Johan · Gmail/diag/crash · forum · interview · device-truth · GitHub intel" >> $GITHUB_STEP_SUMMARY
          echo "Apply-safe tiers: registry · device_truth · exact · interview · z2m_desc — heuristic = review only" >> $GITHUB_STEP_SUMMARY
          node tools/ci/market-couples-intake.js $ARGS --check 2>&1 | tee market-intake.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 market-intake.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f .github/state/market-couples/intake.json ]; then
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const j=require('./.github/state/market-couples/intake.json');
              console.log('- market-new:', j.marketNew);
              console.log('- apply-safe:', j.applySafe);
              console.log('- pid_default soft:', j.pidDefaultSoft);
              console.log('- heuristic soft:', j.heuristicSoft||0);
              console.log('- knowledge-hit:', j.knowledgeNew||0);
              console.log('- needs review:', j.needsReview);
              console.log('- bySource:', JSON.stringify(j.bySource||{}));
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🛡️ Rules gates (shared, core)
        uses: ./.github/actions/rules-gates

      - name: 🧪 P2231/P2232 market couples tests
        run: node --test test/critical/p2231-market-couples-intake.test.js

      - name: 🔒 Apply-safe couples (dry then apply)
        if: ${{ github.event_name == 'schedule' || inputs.apply_safe != false }}
        run: |
          node tools/ci/apply-market-couples.js 2>&1 | tee apply-dry.log
          node tools/ci/apply-market-couples.js --apply 2>&1 | tee apply-live.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 30 apply-live.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Sync mfs after compose locks (compose_exclusive / couple hygiene)
          node tools/ci/align-mfs-db-intelligent.js --apply 2>&1 | tee align-apply.log || true
          node tools/ci/align-mfs-db-intelligent.js --check 2>&1 | tee align-check.log || true

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: market-couples-${{ github.run_id }}
          path: |
            .github/state/market-couples/
            .github/state/mfr-pid-cross-ref.json
            .github/state/digest-leads/
            .github/state/rules-digest.json
            scripts/sync/data/blakadder.json
            scripts/sync/data/z2m.json
            scripts/sync/data/zha.json
            market-intake.log
            apply-live.log
            align-check.log
          if-no-files-found: warn
          retention-days: 14

      - name: 📝 Commit state + compose (master)
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: |
          node scripts/maintenance/sync-appjson-zigbee.js || true
          # P3086: 608e233c65 committed a pretty-printed app.json with raw {{driverAssetsPath}} images
          # (5.35 MB, P3079 parity red on master). Regenerate app.json from compose with the bot-bump
          # post-processing (flow dedupe + sanitize-manifest, compact), then the same parity + no-loss
          # gate as the bot bump; on drift nothing is committed and the job fails.
          node scripts/maintenance/regen-appjson-from-compose.cjs
          compose_parity_or_die() {
            git show HEAD:app.json > "$RUNNER_TEMP/p3086-base-app.json"
            if ! node scripts/ci/compose-parity-gate.cjs --base="$RUNNER_TEMP/p3086-base-app.json"; then
              echo "::error title=compose parity::app.json differs from a compose rebuild or drops entries vs HEAD; market commit refused"
              git checkout -- app.json
              exit 1
            fi
          }
          compose_parity_or_die
          VER=$(node -p "require('./app.json').version" 2>/dev/null || echo '?')
          # Gated + capped + loop-guarded commit (scripts/ci/safe-auto-commit.js)
          node scripts/ci/safe-auto-commit.js --id=market-couples \
            --message="market(P2232): max-source intake + apply-safe couples v${VER}" \
            --paths="scripts/sync/data/blakadder.json scripts/sync/data/z2m.json scripts/sync/data/zha.json drivers data/mfs_db.json app.json reports/P169_MFS_DB_ALIGN_LATEST.json"
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Collects manufacturer/product pairs from every public source and our own diagnostics, with device-truth locks."; else s="Stopped early ($JOB_STATUS); the red step above says why. Collects manufacturer/product pairs from every public source and our own diagnostics, with device-truth locks."; fi
          node scripts/lib/report-writer.js --title "market-couples-intake" --summary "$s" --headers "item|value" --row "job|intake" --row "result|$JOB_STATUS" --thanks "Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors" --thanks "the zigpy / ZHA device handler authors" >> "$GITHUB_STEP_SUMMARY" || true
