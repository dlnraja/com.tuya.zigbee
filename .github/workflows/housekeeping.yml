# <<< about
# 🧹 Repo Housekeeping (v9.0.368)
# Triggers: cron: 41 3 * * 1 (weekly, Monday 03:41 UTC) + workflow_dispatch
# Secrets: GITHUB_TOKEN only
# Safely tidies the repo root: only unreferenced files matching explicit
# rules are moved (git mv), everything else is skipped and reported.
# Fully read-only when there is nothing safe to move.

name: 🧹 Repo Housekeeping

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-housekeeping
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  tidy:
    name: 🧹 Tidy repository root
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install deps
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline --no-audit || npm install --no-audit
          else
            echo "No package.json"
          fi

      - name: 🧹 Dry-run report
        run: node .github/scripts/repo-housekeeping.js

      - name: 🧹 Apply safe moves
        run: node .github/scripts/repo-housekeeping.js --apply

      - name: 📚 Refresh script registry
        run: node .github/scripts/generate-script-registry.js

      - name: 🔋 Refresh product reference DB
        run: node tools/ci/build-product-reference.js

      - name: 💾 Commit moves (only if any)
        continue-on-error: true
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            [ -f scripts/ci/bot-commit-guard.sh ] && { bash scripts/ci/bot-commit-guard.sh || exit 1; }  # P3093
            git commit -m "🧹 housekeeping: rangement autonome $(date -u +%Y-%m-%d) [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "Nothing to tidy"
          fi
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly tidy of the repo root: only unreferenced files matching explicit rules."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly tidy of the repo root: only unreferenced files matching explicit rules."; fi
          node scripts/lib/report-writer.js --title "housekeeping" --summary "$s" --headers "item|value" --row "job|tidy" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" >> "$GITHUB_STEP_SUMMARY" || true
