# 🤖 Daily Digest (free replacement for the Grok Bot "Homey digest", "Labs digest" and "forum scan" routines)
# Triggers: cron weekdays (Paris 08:16 Homey, 08:49 Labs, 10:23 Forum watch, 11:41 Inspiration JohanBendz —
#   DST-safe via tz-guard) + workflow_dispatch. REPORT-ONLY: never commits, never touches drivers, never publishes.
# Politeness: each slot runs once per weekday, random 0–120 s start jitter, API calls spaced 300–800 ms,
# Discourse: 1 topic request + ≤3 post-window requests spaced 2–5 s, stop + 20 h back-off on 429/403.
# Secrets: GITHUB_TOKEN only. Reads public repos dlnraja/ascendos + dlnraja/pulse-automix.
# Notification = ONE comment on the tracking issue "🤖 Daily digest" (label bot-digest) only when
# something changed; state is kept in that issue body (no commits, no push → no CI churn).
# Folds the latest gmail-diagnostics / fetch-diags results (run status + sanitized artifact).
name: 🤖 Daily Digest

on:
  schedule:
    # GitHub cron is UTC. Two crons per slot: summer (UTC+2) and winter (UTC+1);
    # scripts/digest/tz-guard.js keeps only the one matching Paris time today.
    - cron: '16 6 * * 1-5'   # Homey 08:16 Paris (CEST)
    - cron: '16 7 * * 1-5'   # Homey 08:16 Paris (CET, from 25 Oct 2026)
    - cron: '49 6 * * 1-5'   # Labs 08:49 Paris (CEST)
    - cron: '49 7 * * 1-5'   # Labs 08:49 Paris (CET)
    - cron: '23 8 * * 1-5'   # Forum watch 10:23 Paris (CEST) — offset from forum-poll's :15 to avoid hitting Discourse together
    - cron: '23 9 * * 1-5'   # Forum watch 10:23 Paris (CET)
    - cron: '41 9 * * 1-5'   # Inspiration JohanBendz 11:41 Paris (CEST)
    - cron: '41 10 * * 1-5'  # Inspiration JohanBendz 11:41 Paris (CET)
    - cron: '7 7 * * 1'      # Weekly summary Monday 09:07 Paris (CEST)
    - cron: '7 8 * * 1'      # Weekly summary Monday 09:07 Paris (CET)
    - cron: '5 10 * * 1-5'  # Self-check 12:05 Paris (CEST)
    - cron: '5 11 * * 1-5'  # Self-check 12:05 Paris (CET)
  workflow_dispatch:
    inputs:
      which:
        description: 'Digest to run'
        type: choice
        options: [all, homey, labs, forum, inspiration, weekly, selfcheck]
        default: all
      force:
        description: 'Post a comment even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: daily-digest-${{ github.event.schedule || inputs.which || 'manual' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DIGEST_FORCE: ${{ inputs.force && '1' || '0' }}
  AI_ALLOW_PAID: 'false'
  AI_ALLOW_REMOTE: 'false'

jobs:
  homey:
    name: 🏠 Homey digest
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '16 ')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.which == 'all' || inputs.which == 'homey')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (scripts + drivers/lib/data for enrichment leads, read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/digest
            scripts/sync/data
            drivers
            lib
            data
            .homeycompose/flow
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=8
      - name: 🎲 Start jitter (0–120 s, scheduled runs only)
        if: github.event_name == 'schedule' && steps.tz.outputs.run == 'true'
        run: sleep $((RANDOM % 121))
      - name: 📬 Fetch latest sanitized diagnostics artifact (best-effort)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diag-report
          for wf in gmail-diagnostics.yml fetch-diags.yml; do
            RID=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
            [ -n "$RID" ] && gh run download "$RID" -R "$GITHUB_REPOSITORY" -n sanitized-diagnostics-report -D diag-report && break
          done
          find diag-report -name 'diagnostics-report.json' | head -1
      - name: 🏠 Homey digest
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_REPORT_DIR: diag-report
          DIGEST_LEADS_OUT: digest-leads/homey.json
          DIGEST_JOB: homey
          DIGEST_OCR_MAX: '0'
          DIGEST_LINK_MAX: '0'
        run: node scripts/digest/homey-digest.js
      - name: 📤 Upload feedback-loop leads (consumed by market-couples-intake)
        if: always() && steps.tz.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: digest-leads-homey-${{ github.run_id }}
          path: digest-leads/
          if-no-files-found: ignore
          retention-days: 14

  labs:
    name: 🧪 Labs digest (AscendOS / Pulse)
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '49 ')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.which == 'all' || inputs.which == 'labs')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (scripts only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/digest
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=8
      - name: 🎲 Start jitter (0–120 s, scheduled runs only)
        if: github.event_name == 'schedule' && steps.tz.outputs.run == 'true'
        run: sleep $((RANDOM % 121))
      - name: 🧪 Labs digest
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABS_REPOS: dlnraja/ascendos,dlnraja/pulse-automix
        run: node scripts/digest/labs-digest.js

  forum:
    name: 💬 Forum watch (6 Tuya threads, read-only)
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '23 ')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.which == 'all' || inputs.which == 'forum')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (scripts + driver manifests only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/digest
            scripts/sync/data
            drivers
            lib
            data
            .homeycompose/flow
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=10
      - name: 🎲 Start jitter (0–120 s, scheduled runs only)
        if: github.event_name == 'schedule' && steps.tz.outputs.run == 'true'
        run: sleep $((RANDOM % 121))
      - name: 🔤 Install tesseract (free local OCR for screenshots; best-effort)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PKGS="tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-nld tesseract-ocr-spa tesseract-ocr-ita imagemagick"
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null 2>&1 || \
            { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null; }
          tesseract --version | head -1; tesseract --list-langs | tail -n +2 | tr '\n' ' '
      - name: 💬 Forum watch
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Universal Tuya Zigbee · Tuya Zigbee (JohanBendz) · device-request archive · Smart Life · Tuya Local · Tuya Cloud
          FORUM_TOPICS: '140352,26439,89271,146735,154077,21313'
          FORUM_NOTIFY: any
          FORUM_MAX_REQUESTS: '4'           # global cap across ALL topics per run (unchanged politeness)
          FORUM_BACKOFF_HOURS: '20'
          DIGEST_LEADS_OUT: digest-leads/forum.json
          DIGEST_JOB: forum
          DIGEST_OCR_MAX: '3'               # CDN-hosted screenshots only, never extra forum-host hits
          DIGEST_LINK_MAX: '3'              # linked Z2M / Blakadder device pages
        run: node scripts/digest/forum-watch.js
      - name: 📤 Upload feedback-loop leads (consumed by market-couples-intake)
        if: always() && steps.tz.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: digest-leads-forum-${{ github.run_id }}
          path: digest-leads/
          if-no-files-found: ignore
          retention-days: 14

  inspiration:
    name: 🧭 Inspiration JohanBendz + own repo + git history (read-only)
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '41 ')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.which == 'all' || inputs.which == 'inspiration')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout (scripts + drivers/lib/data, read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/digest
            scripts/sync/data
            drivers
            lib
            data
            .homeycompose/flow
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=11
      - name: 🎲 Start jitter (0–120 s, scheduled runs only)
        if: github.event_name == 'schedule' && steps.tz.outputs.run == 'true'
        run: sleep $((RANDOM % 121))
      - name: 🔤 Install tesseract (free local OCR for screenshots; best-effort)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PKGS="tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-nld tesseract-ocr-spa tesseract-ocr-ita imagemagick"
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null 2>&1 || \
            { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null; }
          tesseract --version | head -1; tesseract --list-langs | tail -n +2 | tr '\n' ' '
      - name: 🧭 Inspiration scan
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPIRATION_OWNER: JohanBendz
          INSPIRATION_MAX_ITEMS: '100'      # ≤100 issues/PRs per run (backlog walked incrementally)
          LOOKUP_CODE_SEARCH_MAX: '5'       # code search is 10 req/min → ≤5 per run, ≥7 s apart
          DIGEST_MAX_API_CALLS: '320'
          DIGEST_LEADS_OUT: digest-leads/inspiration.json
          DIGEST_JOB: inspiration
          DIGEST_OCR_MAX: '5'
          DIGEST_LINK_MAX: '3'
        run: node scripts/digest/inspiration-scan.js
      - name: 🧬 Git history mining (master, stable-v5, bastien-home — incremental)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITMINE_BRANCHES: master,stable-v5,bastien-home
          GITMINE_MAX_PAGES: '5'            # ≤500 commits per branch per run
          DIGEST_MAX_API_CALLS: '40'
          DIGEST_LEADS_OUT: digest-leads/gitmine.json
          DIGEST_JOB: gitmine
        run: node scripts/digest/git-mine.js
      - name: ♻️ Restore firmware-quirk dataset
        if: steps.tz.outputs.run == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .quirks-db
          key: quirks-db-${{ github.run_id }}
          restore-keys: quirks-db-
      - name: 🧩 Firmware quirks (per mfr+pid, external cross-reference, capped)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUIRKS_DB: .quirks-db/quirks.json
          QUIRKS_LEADS_DIR: digest-leads
          QUIRKS_GH_MAX: '4'                # ≤4 issue searches per run, ≥3 s apart
          QUIRKS_DISCOURSE_MAX: '1'         # one community-forum search per run, rotating
          DIGEST_MAX_API_CALLS: '20'
        run: node scripts/digest/quirks-scan.js
      - name: 💾 Save firmware-quirk dataset
        if: always() && steps.tz.outputs.run == 'true' && hashFiles('.quirks-db/quirks.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .quirks-db
          key: quirks-db-${{ github.run_id }}
      - name: 📤 Upload feedback-loop leads (consumed by market-couples-intake)
        if: always() && steps.tz.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: digest-leads-inspiration-${{ github.run_id }}
          path: digest-leads/
          if-no-files-found: ignore
          retention-days: 14

  weekly:
    name: 📅 Weekly summary + driver health score
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '7 ')) ||
       (github.event_name == 'workflow_dispatch' && inputs.which == 'weekly'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (scripts + driver manifests, read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/digest
            drivers
            lib
            data
            .homeycompose/flow
          persist-credentials: false
      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 🕗 Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=9
      - name: 📥 Week inputs (leads artifacts, diagnostics, quirk dataset — best-effort)
        if: steps.tz.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p week-leads diag-report
          for RID in $(gh run list -R "$GITHUB_REPOSITORY" -w daily-digest.yml -L 15 --created ">=$(date -u -d '7 days ago' +%F)" --json databaseId -q '.[].databaseId'); do
            gh run download "$RID" -R "$GITHUB_REPOSITORY" -p 'digest-leads-*' -D "week-leads/$RID" >/dev/null 2>&1 || true
          done
          for wf in gmail-diagnostics.yml fetch-diags.yml; do
            RID=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
            [ -n "$RID" ] && gh run download "$RID" -R "$GITHUB_REPOSITORY" -n sanitized-diagnostics-report -D diag-report && break
          done
          true
      - name: ♻️ Restore firmware-quirk dataset
        if: steps.tz.outputs.run == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .quirks-db
          key: quirks-db-weekly-${{ github.run_id }}
          restore-keys: quirks-db-
      - name: 📅 Weekly summary
        if: steps.tz.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY_LEADS_DIR: week-leads
          WEEKLY_DIAG_DIR: diag-report
          QUIRKS_DB: .quirks-db/quirks.json
        run: node scripts/digest/weekly.js

  # P2802 — free weekday self-check: summarize sweep/CI/gate duplication into Daily digest #557
  # when the script reports a change. Never commits; never publishes. Uses GITHUB_TOKEN only.
  selfcheck:
    name: 🩺 Free self-check → Daily digest #557
    if: >-
      github.repository == 'dlnraja/com.tuya.zigbee' &&
      ((github.event_name == 'schedule' && startsWith(github.event.schedule, '5 1')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.which == 'selfcheck' || inputs.which == 'all')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/digest
            data/leads
            data/progress
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Paris-time guard
        id: tz
        run: node scripts/digest/tz-guard.js --schedule="${{ github.event.schedule }}" --paris-hour=12
      - name: Self-check report (best-effort)
        if: steps.tz.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: node scripts/digest/self-check.js || echo "SELF_CHECK_SKIP"

