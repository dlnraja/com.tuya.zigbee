# Spec 009 — daily, incremental, read-only index of upstream maintainer threads
# (JohanBendz/com.tuya.zigbee issues + PRs + comments, open and closed).
# Stores links + structured fields only (mfr/pid identities, canonical links, batches,
# regression flags, objective counts, authors); never comment text (constitution C1/C5).
# Threads with new activity are flagged needsDeepRead=true for our own deep-read pass.
# Never posts, comments or reacts (X1). Free: GITHUB_TOKEN, Node built-ins, no AI.
name: Johan thread intelligence (daily)

on:
  schedule:
    - cron: '40 3 * * *'  # daily UTC (P2810: was weekdays); history sweep + index
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: johan-thread-intel
  cancel-in-progress: false

defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Incremental index (cursor stored in the output file)
        id: scan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scanners/johan-canonical-index.js --max-pages=${{ vars.JOHAN_INDEX_MAX_PAGES || '10' }}

      - name: Guard — no comment text persisted
        if: steps.scan.outcome == 'success'
        run: |
          node -e '
            const j=require("./data/leads/johan-canonical-index.json");
            const bad=Object.values(j.issues).filter(e=>(e.lastComment&&e.lastComment.excerpt)||(e.objectives||[]).some(o=>o.text));
            if(bad.length){console.error("text found in "+bad.length+" entries");process.exit(1);}
            const pending=Object.values(j.issues).filter(e=>e.needsDeepRead).length;
            console.log("threads pending deep read: "+pending);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY||"/dev/null","Threads pending deep read: "+pending+"\n");'

      - name: Commit index (gated)
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=johan-thread-intel \
            --message="chore(leads): incremental upstream thread index" \
            --paths="data/leads/johan-canonical-index.json data/progress/ledger.json"

      - name: History sweep chunk (free, no AI)
        # WHY(P2802): advance data/leads/sweep-checkpoint.json a little each weekday so the
        # full-history deep-read never stalls. Resume-friendly; ledger records done/deferred.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # P2810: Johan issues (title+body+comments) AND the six forum topics from post 1.
          # P2907: our own repo's issues/PRs too (cursor github.dlnraja.next; it never moved before).
          # P2909: forum chunk 80 -> 180 posts/topic/day (pages of 20, 0.9 s apart, stops on 429/403).
          # Exit 2 = no progress at all (stall) -> visible warning, never a hard failure.
          node scripts/progress/advance-sweep.js --chunk=${{ vars.SWEEP_CHUNK || '15' }} \
            --dl-chunk=${{ vars.SWEEP_DL_CHUNK || vars.SWEEP_CHUNK || '15' }} \
            --forum-chunk=${{ vars.SWEEP_FORUM_CHUNK || '180' }} || \
            { rc=$?; [ "$rc" = 2 ] && echo "::warning::history sweep made no progress this run"; true; }
          node scripts/progress/sweep-crosscheck.js || true

      - name: Acceptance view (canonical threads vs our drivers, free)
        continue-on-error: true
        run: node scripts/scanners/johan-acceptance.js

      - name: Commit sweep checkpoint (gated)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=history-sweep \
            --message="chore(leads): advance history sweep checkpoint" \
            --paths="data/leads/sweep-checkpoint.json data/leads/deep-read-checkpoint.json data/progress/ledger.json data/leads/johan-acceptance.json"

