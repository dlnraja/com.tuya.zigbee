# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Daily cheap probe of the Z2M, ZHA and Johan app heads; when one moved (or weekly) it rebuilds
#   data/ssot/couple-sources.json: per exact mfr+pid couple, the sources that confirm it, its driver, class,
#   gangs, HomeKit service and the custom compensation for non-native capabilities. No AI, ids are
#   regex-extracted only, couples without external proof are marked unverified, nothing is removed.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors; the
#   zigpy / ZHA device handler authors; Blakadder's Zigbee device database; JohanBendz's original Tuya Zigbee
#   app (read-only reference).
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P3136 — SSOT couple enrichment ledger (t731u). Header block is generated by workflow-about.js.
name: SSOT Couple Enrich

on:
  schedule:
    # Daily 04:41 UTC probe; the full rebuild only runs when an upstream source moved
    # (diff-mode cursor) or the last rebuild is older than 7 days (adaptive frequency).
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if upstream cursors did not move'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ssot-couple-enrich
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'

jobs:
  build:
    name: Rebuild couple-sources ledger (no AI, read-only)
    if: vars.SSOT_ENRICH_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Restore upstream cursors
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ssot-cursor
          key: ssot-cursor-${{ github.run_id }}
          restore-keys: ssot-cursor-

      - name: Probe upstream heads (diff mode)
        id: probe
        run: |
          mkdir -p .ssot-cursor
          z2m=$(git ls-remote https://github.com/Koenkk/zigbee-herdsman-converters.git refs/heads/master | cut -c1-40)
          zha=$(git ls-remote https://github.com/zigpy/zha-device-handlers.git refs/heads/dev | cut -c1-40)
          johan=$(git ls-remote https://github.com/JohanBendz/com.tuya.zigbee.git HEAD | cut -c1-40)
          now="$z2m $zha $johan"
          prev=$(cat .ssot-cursor/heads 2>/dev/null || true)
          last=$(cat .ssot-cursor/last 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          run=false
          if [ "${{ inputs.force }}" = "true" ] || [ "$now" != "$prev" ] || [ "$age" -gt 604800 ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "z2m=$z2m" >> "$GITHUB_OUTPUT"; echo "zha=$zha" >> "$GITHUB_OUTPUT"; echo "johan=$johan" >> "$GITHUB_OUTPUT"
          echo "$now" > .ssot-cursor/heads.next
          echo "upstream heads: $now (run=$run, age=${age}s)"

      - name: Setup Node
        if: steps.probe.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch sources at pinned heads (data only, never executed)
        if: steps.probe.outputs.run == 'true'
        env:
          Z2M: ${{ steps.probe.outputs.z2m }}
          ZHA: ${{ steps.probe.outputs.zha }}
          JOHAN: ${{ steps.probe.outputs.johan }}
        run: |
          mkdir -p /tmp/src/zha
          [[ "$Z2M" =~ ^[0-9a-f]{40}$ ]] && curl -fsSL --max-time 60 -o /tmp/src/tuya.ts "https://raw.githubusercontent.com/Koenkk/zigbee-herdsman-converters/$Z2M/src/devices/tuya.ts" || echo "z2m soft-skip"
          [[ "$ZHA" =~ ^[0-9a-f]{40}$ ]] && curl -fsSL --max-time 90 "https://codeload.github.com/zigpy/zha-device-handlers/tar.gz/$ZHA" | tar xz -C /tmp/src/zha --wildcards '*/zhaquirks/*' || echo "zha soft-skip"
          [[ "$JOHAN" =~ ^[0-9a-f]{40}$ ]] && curl -fsSL --max-time 60 -o /tmp/src/johan.json "https://raw.githubusercontent.com/JohanBendz/com.tuya.zigbee/$JOHAN/app.json" || echo "johan soft-skip"

      - name: Rebuild ledger (additive; regex id extraction only)
        if: steps.probe.outputs.run == 'true'
        run: |
          node tools/ci/ssot-couple-enrich.js --z2m=/tmp/src/tuya.ts \
            --zha="$(ls -d /tmp/src/zha/*/zhaquirks 2>/dev/null | head -1)" --johan=/tmp/src/johan.json

      - name: Diff
        id: diff
        run: |
          if git diff --quiet -- data/ssot/couple-sources.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          mv .ssot-cursor/heads.next .ssot-cursor/heads
          if [ "${{ steps.probe.outputs.run }}" = "true" ]; then date +%s > .ssot-cursor/last; fi

      - name: Save upstream cursors
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ssot-cursor
          key: ssot-cursor-${{ github.run_id }}

      - name: Upload ledger
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: ssot-couple-sources
          path: data/ssot/couple-sources.json
          retention-days: 3

  commit:
    name: Commit ledger (gated)
    needs: build
    if: needs.build.outputs.changed == 'true' && vars.SSOT_ENRICH_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write  # safe-auto-commit: single refusal comment on the tracking issue
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download ledger
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ssot-couple-sources
          path: data/ssot

      - name: Validate shape then commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e 'const d=require("./data/ssot/couple-sources.json");if(!d._meta||!d.couples||!d.drivers)process.exit(1);for(const k of Object.keys(d.couples))if(!/^_t[a-z0-9]{2,5}_[a-z0-9]{4,16}\|[A-Za-z0-9_. +/\-]{2,40}$/.test(k))throw new Error("bad key "+k)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=ssot-couple-enrich \
            --message="chore(ssot): refresh couple-sources ledger (P3136) [skip ci]" \
            --paths="data/ssot/couple-sources.json"
