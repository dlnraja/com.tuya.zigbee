# 🔄 Self-Improve Orchestrator (v9.0.389)
# Triggers: cron: 53 2 * * 2 (Tuesday 02:53 UTC) + workflow_dispatch
# Secrets: GITHUB_TOKEN only — ZERO external API calls, ZERO cost.
#
# Weekly autonomous self-improvement loop, reusing ONLY existing repo scripts:
#   1. Rebuild product-reference DB (local data sources)
#   2. Case-variant completion (pairing robustness)
#   3. Refresh docs index + script registry
#   4. Full test suite — commit happens ONLY if tests are green
#   5. Security scan + JS syntax audit (report)
# Publishing stays on the existing verified pipelines (never auto-published here).

name: 🔄 Self-Improve

on:
  schedule:
    - cron: '53 2 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-improve
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  improve:
    name: 🔄 Weekly self-improvement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ▶️ Resume quota-deferred tasks (P92.88)
        continue-on-error: true
        run: |
          echo "## ▶️ Reprise des tâches différées (quota)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "
          (async () => {
            const qr = require('./.github/scripts/quota-resume');
            let ai = null;
            try { ai = require('./.github/scripts/ai-helper'); } catch {}
            const canRun = () => { try { return ai ? ai.budgetAllows('gemini') : false; } catch { return false; } };
            await qr.processPending(async (task) => {
              if (task.id === 'ai-dp-extract') {
                require('child_process').execSync('node .github/scripts/ai-dp-extract.js', { stdio: 'inherit' });
                return true;
              }
              return false;
            }, canRun);
          })();
          " >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install deps
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: 🔋 Rebuild product-reference DB
        continue-on-error: true
        run: node tools/ci/build-product-reference.js

      - name: 🔤 Complete case variants (pairing)
        continue-on-error: true
        run: |
          node tools/ci/case-variant-fixer.js || true
          node tools/ci/case-variant-fixer.js --apply || true
          node tools/ci/mfs-db-dedupe.js --apply || true
          node tools/ci/align-mfs-db-intelligent.js --apply || true
          node tools/ci/compose-mfsdb-class-guard.js || true
          node tools/ci/max-coverage-investigate.js || true
          node tools/ci/battery-button-intelligence-gate.js || true
          node tools/ci/rules-enforcement-matrix.js || true

      - name: 📦 Refresh native firmware updates (Homey 13.2+)
        continue-on-error: true
        run: node tools/ci/build-firmware-updates.js --apply || true

      - name: 📚 Refresh docs index + script registry + README
        continue-on-error: true
        run: |
          node tools/ci/generate-docs-index.js || true
          node .github/scripts/generate-script-registry.js || true
          node .github/scripts/generate-readme.js || true

      - name: 🧪 Full test suite (gate)
        id: tests
        run: npm test

      - name: 🔍 Audits (report only, non-blocking)
        continue-on-error: true
        run: |
          echo "## 🔄 Self-Improve report $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node tools/ci/js-syntax-audit.js >> $GITHUB_STEP_SUMMARY 2>&1 || true
          node scripts/ci/security-scanner.js 2>&1 | tail -8 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🛡️ Backport candidates (master → stable, soak > 7j)
        continue-on-error: true
        run: |
          echo "## 🛡️ Backport candidates" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git clone --depth 1 --branch stable-v5 https://github.com/dlnraja/com.tuya.zigbee.git ../stable 2>/dev/null || true
          node tools/ci/backport-candidates.js >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🤖 AI quota report (billing guard visibility)
        continue-on-error: true
        run: |
          echo "## 🤖 AI quota (daily caps)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node tools/ci/ai-quota-report.js >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🧠 AI DP extraction (500-char truncation, guarded chain)
        continue-on-error: true
        run: |
          echo "## 🧠 AI DP extraction" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node .github/scripts/ai-dp-extract.js >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 💾 Commit improvements (only when tests are green)
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "🔄 self-improve: product-reference, case variants, docs $(date -u +%Y-%m-%d) [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "Nothing to improve this week"
          fi
