# 🇺‌🇳‌🇮‌🇫‌🇮‌🇪‌🇩‌ ‌🇨‌🇴‌🇳‌🇸‌🇴‌🇱‌🇮‌🇩‌🇦‌🇹‌🇮‌🇴‌🇳‌ ‌🇻‌8‌.‌5‌.‌1‌7‌ — ENABLED
name: 🔍 Verify, Diagnostics & Publish Test
# <!-- badges:start -->
# [![🔍 Verify, Diagnostics & Publish Test](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/verified-publish-and-diagnostics.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/verified-publish-and-diagnostics.yml)
# <!-- badges:end -->


on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version à publier (ex: 8.5.17)'
        required: true
        default: '8.5.17'
      run_diagnostics:
        description: "Lancer l'analyse des logs de crash"
        type: boolean
        default: true
      bisect_trial:
        description: 'P3034: bisect trial number (manual trial run). Required to upload/promote master while docs/knowledge/athom-bisect-state.json status=running'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  # 1. Verification de l'accessibilité et de la syntaxe
  verify-and-lint:
    name: 🕵️ Vérification & Syntaxe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
          node-version: '22' # Requis pour Homey SDK v3 / Node 22 env

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🛡️ GitHub Actions & YAML Policy Gate
        run: npm run check:yaml

      - name: ⏱️ Homey Timer Context Guard
        run: npm run check:timer-context

      - name: 🗣️ Google Assistant / Alexa Voice-Safety Gate
        run: npm run check:voice

      - name: 🚫 Syntax Guard (Prevent Recursive Crashes)
        run: |
          echo "🔍 Vérification stricte de la syntaxe sur tous les fichiers critiques..."
          
          # 1. Vérification globale
          find lib drivers -name "*.js" -exec node -c {} +
          echo "✅ Syntaxe globale OK."

          # 2. Vérifications spécifiques post-crash (v7.4.6 & v7.4.8 patterns)
          # Pattern v7.4.8: Erreur ternaire/if hybride dans tuyaUtils.js
          if grep -rn "if.*return.*:.*null" lib/utils/tuyaUtils.js; then
             echo "❌ ERREUR BLOQUANTE: Pattern 'if ... return ... : null' détecté dans tuyaUtils.js. Voir PR #274."
             exit 1
          fi
          
          # Pattern v7.4.6: Parenthèse en trop dans AdvancedAnalytics.js
          if grep -rn "Math.round.*safeDivide.*10))" lib/analytics/AdvancedAnalytics.js; then
             echo "❌ ERREUR BLOQUANTE: Parenthèse excédentaire détectée dans AdvancedAnalytics.js."
             exit 1
          fi

          echo "✅ Patterns de crash critiques vérifiés et absents."

      - name: Normalize Homey manifest before validation
        run: npm run fix:generated-flow-args

      - name: Validate App Manifest
        run: npx homey app validate --level=publish

      - name: Sanitize generated manifest after validation
        run: npm run fix:generated-flow-args && npm run check:homey-guidelines

  # 2. Analyse des Diagnostics (Simulation du dump email)
  analyze-diagnostics:
    name: 📧 Analyse des Crashs & Dump Emails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-and-lint
    if: ${{ github.event.inputs.run_diagnostics == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📥 Traitement du Dump de Crashs (v7.4.8 & v7.4.6)
        run: |
          echo "📂 Création du rapport d'analyse anonymisé..."
          mkdir -p reports/diagnostics
          
          # Rapport basé sur les erreurs fournies par l'utilisateur
          cat > reports/diagnostics/crash-analysis.md << 'EOF'
          # 📊 Rapport d'Analyse des Crashs (Anonymisé)
          ## 🚨 Patterns Critiques Identifiés
          
          | Version | Fichier | Ligne | Erreur | Cause Racine |
          |---------|---------|-------|--------|--------------|
          | **v7.4.8** | `lib/utils/tuyaUtils.js` | 118 | `SyntaxError: Unexpected token ':'` | Mélange invalide `if` / opérateur ternaire. |
          | **v7.4.6** | `lib/analytics/AdvancedAnalytics.js` | 215 | `SyntaxError: Unexpected token ')'` | Parenthèse fermante orpheline dans `Math.round`. |
          
          ## 📝 Analyse des Emails Utilisateurs
          - **Impact**: 100% des devices sur v7.4.8 crashent au démarrage (`Unable to initialize app`).
          - **Firmware**: Affecte Homey Pro 2019 (v12/v13) et 2023 (v13).
          - **Action**: Le fix syntaxique est **OBLIGATOIRE** avant toute publication.
          EOF
          
          echo "✅ Rapport généré dans reports/diagnostics/"

      - name: Upload Diagnostic Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: crash-analysis-report
          path: reports/diagnostics/

  # 3. Build et Publication
  # P3034: no master upload/promotion while an Athom bisect runs, except a manual dispatch with bisect_trial.
  bisect-hold:
    name: "P3034 bisect hold"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hold_upload: ${{ steps.bh.outputs.hold_upload }}
      hold_promote: ${{ steps.bh.outputs.hold_promote }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/bisect-hold.js
            docs/knowledge/athom-bisect-state.json
            .homeycompose/app.json
          sparse-checkout-cone-mode: false
      - name: P3034 bisect hold
        id: bh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BISECT_TRIAL: ${{ inputs.bisect_trial }}  # P3034: no '||' coercion, trial '0' passes verbatim
        run: node .github/scripts/bisect-hold.js

  # P3036: green CI + spacing + busy gate before any Athom upload (docs/knowledge/P3036_ATHOM_PUBLISH_POLICY.md).
  p3036-gate:
    name: "P3036 Athom publish gate"
    needs: bisect-hold
    if: needs.bisect-hold.outputs.hold_promote != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set
      - name: Install dependencies (read-only build snapshot)
        run: npm ci --prefer-offline --no-audit --ignore-scripts || npm install --ignore-scripts
      - name: P3036 publish gate
        id: gate
        uses: ./.github/actions/athom-publish-gate
        with:
          app_id: ${{ github.ref_name == 'stable-v5' && 'com.dlnraja.tuya.zigbee.stable' || (github.ref_name == 'bastien-home' && 'com.dlnraja.tuya.zigbee.bastien' || 'com.dlnraja.tuya.zigbee') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          homey_pat: ${{ secrets.HOMEY_PAT }}
          transient_retry: 'false'
          wait_ms: '1200000'

  build-and-publish:
    name: 🚀 Build & Publish Test Channel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify-and-lint, bisect-hold, p3036-gate]
    # P3034: the Athom publish action also lands on Test; held while a bisect runs.
    # P3036: and only when the publish gate says go (green CI, spacing, no build processing).
    if: needs.bisect-hold.outputs.hold_promote != 'true' && needs.p3036-gate.outputs.go == 'true'
    # P3036: one lock per app shared by every publish workflow (job level: the workflow group differs).
    concurrency:
      group: athom-publish-${{ github.ref_name == 'stable-v5' && 'stable' || (github.ref_name == 'bastien-home' && 'bastien' || 'master') }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Install Homey CLI
        run: npm install -g @athombv/homey-cli

      - name: Build App
        run: |
          echo "📦 Building version ${{ github.event.inputs.target_version }}..."
          # Note: Normalement géré par homey app publish, mais simulé ici pour le log
          # homey app build
          # ls -lh com.dlnraja.tuya.zigbee-*.tar.gz
          echo "✅ Build simulé pour l'artifact."

      - name: 🚀 Publish to Test Channel
        uses: athombv/github-action-homey-app-publish@48be66b7f2f870c22b6117d7bb84dfa06c4fc309 # v1
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: 🔍 Vérification Post-Publication
        run: |
          echo "🌐 URL de Vérification :"
          echo "https://homey.app/en-us/app/com.dlnraja.tuya.zigbee/Universal-Tuya/test/"
          echo "⏳ Attendre 2-5 minutes pour la mise à jour du store..."
