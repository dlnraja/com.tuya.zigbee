# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Blocks PRs with bad versions, duplicate manufacturer/product pairs or broken manifests.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# 🚦 PR Gate (v9.0.584+)
# Triggers: pull_request sur master et stable-v5 | Secrets: GITHUB_TOKEN only
# Bloque les PRs qui: versions invalides/désynchronisées, conflits
# Sacred Couple (mfr multi-drivers sans désambiguïsation PID),
# P2138 matrix (mfr+pid only — no invent), anti-bot locks,
# ou régressions de routage (tests critiques).

name: 🚦 PR Gate

on:
  pull_request:
    branches: [master, stable-v5]

permissions:
  contents: read

# v9.0.419 (P92.126): mandatory bash default — integrity gate WFL_SHELL_MISSING
defaults:
  run:
    shell: bash

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  gate:
    name: 🚦 Version + Sacred Couple + routing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install deps
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: 🚦 PR gate (version + Sacred Couple)
        run: node tools/ci/pr-gate.js --branch=${{ github.base_ref }}

      # P2964 rescued by P3062: report-only until the legacy "changelog" wrapper readers are migrated.
      - name: 📐 P2964 Homey SDK v3 rules (report-only)
        run: |
          node tools/ci/homey-sdk-rules.js --compose --report-only
          node tools/ci/homey-sdk-rules-doc.js --check
          npx mocha test/critical/p2964-homey-sdk-rules.test.js --timeout 10000

      - name: 🔍 JS syntax audit (all repo files)
        run: node tools/ci/js-syntax-audit.js

      - name: 🔥 lib smoke-test (require every lib module)
        run: node tools/ci/lib-smoke-test.js

      - name: 🧪 P2940 test pairing gate (report-only, blocks NEW untested lib/drivers files from 2026-11-04)
        run: |
          git fetch --no-tags --unshallow origin 2>/dev/null || true
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          node tools/ci/test-pairing-gate.js --base="origin/${{ github.base_ref }}"

      - name: 🛡️ Rules gates (shared) - anti-bot, P2138 sacred-couple matrix, P214 adaptation, Spec 002 native-matrix, flow titleFormatted
        uses: ./.github/actions/rules-gates
        with:
          only: anti-bot,p2138,p214,native-matrix,flow-title

      - name: 🛡️ P217 fork harvest sacred-couple gate
        run: node tools/ci/p217-fork-harvest-gate.js

      - name: 🛡️ P216 ZCL battery half-percent gate
        run: node tools/ci/p216-zcl-battery-half-percent-gate.js

      - name: 🛡️ Layer coverage gate
        run: node tools/ci/layer-coverage-gate.js

      - name: 🧪 Critical routing tests (mocha)
        run: npx mocha test/critical/*.test.js --timeout 10000

      - name: 🧪 P2138 + Poll Control (node:test)
        run: |
          node --test test/critical/p2138-bseed-wall-dimmer.test.js
          node --test test/critical/poll-control-policy.test.js
          node --test test/critical/p2436-homey-match-moes-bot-mocks.test.js
          node --test test/critical/p2437-ai-forfait-cursor-hooks.test.js
          node --test test/critical/p2438-multi-source-harvest-ai-limit.test.js
          node --test test/critical/p2439-kaflzta4-smart-knob-button.test.js
          npm run check:p244x
          npm run check:p246x
          npm run check:p248x
          npm run check:p249x
          npm run check:p257x
          npm run check:p283x
          npm run check:p2580
          npm run check:publish
