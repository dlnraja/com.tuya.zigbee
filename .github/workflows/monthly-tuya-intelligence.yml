# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Monthly link audit of our references; schedule off until its commit step is fixed.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters contributors; zigpy / ZHA, deCONZ,
#   tuya-local, tinytuya and localtuya authors; Blakadder's Zigbee device database.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Monthly Tuya Intelligence & URL Audit v9.0.34
# Monthly URL audit and intelligence enrichment
name: 🌙 Monthly Tuya Intelligence & URL Audit

# <!-- badges:start -->
# [![🌙 Monthly Tuya Intelligence & URL Audit](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/monthly-tuya-intelligence.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/monthly-tuya-intelligence.yml)
# <!-- badges:end -->


on:
  # Cron désactivé 2026-08-04 (audit no-op) : le step "Commit and Push" échoue
  # chaque mois (permissions: contents read → push 403 github-actions[bot],
  # continue-on-error masque l'échec, run vert trompeur). Effet net zéro.
  # Réactiver après passage à GH_PAT / verified-git-push.sh.
  # schedule:
  #   - cron: '9 1 1 * *' # Once a month on the 1st at 01:09 UTC (staggered: was 00:00)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read


concurrency:
  group: monthly-tuya-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  audit-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install Dependencies
        run: npm install axios cheerio

      - name: "🔴 Step 1: Challenge All URLs"
        continue-on-error: true
        run: node .github/scripts/challenge-all-urls.js

      - name: "🟠 Step 2: Run Intelligent Enrichment Engine"
        continue-on-error: true
        run: node .github/scripts/ai-enrichment-engine.js
        env:
          OPENAI_API_KEY: '' # cancelled paid plan (2026-10): provider neutralized
          ANTHROPIC_API_KEY: '' # cancelled paid plan (2026-10): provider neutralized
          GEMINI_API_KEY: ${{ vars.AI_DISABLED != 'true' && secrets.GEMINI_API_KEY || '' }}

      - name: "🟡 Step 3: Run Ultimate Validation"
        continue-on-error: true
        run: node scripts/ULTIMATE_CHECK.js

      - name: "📝 Step 4: Generate Monthly Intelligence Summary"
        continue-on-error: true
        run: |
          echo "# 🌙 Monthly Intelligence Summary - $(date +'%Y-%m')" > reports/MONTHLY_SUMMARY.md
          echo "## 📊 Stats" >> reports/MONTHLY_SUMMARY.md
          grep -E "total|alive|dead" reports/url_audit_report.json >> reports/MONTHLY_SUMMARY.md
          echo "## ✨ New Enrichment Data" >> reports/MONTHLY_SUMMARY.md
          jq -r '.data[] | "* [" + .title + "](" + .url + ") - " + .description' data/enriched_intelligence.json >> reports/MONTHLY_SUMMARY.md

      - name: "🟢 Step 5: Commit and Push Changes"
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/enriched_intelligence.json reports/URL_AUDIT.md reports/url_audit_report.json reports/MONTHLY_SUMMARY.md
          git commit -m "chore(intelligence): monthly automated url audit and enrichment [skip ci]" || echo "No changes to commit"
          # P3025: bare `git push` was rejected whenever another bot pushed first
          bash .github/scripts/git-push-retry.sh --branch "${GITHUB_REF_NAME}"
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Monthly link audit of our references; schedule off until its commit step is fixed."; else s="Stopped early ($JOB_STATUS); the red step above says why. Monthly link audit of our references; schedule off until its commit step is fixed."; fi
          node scripts/lib/report-writer.js --title "monthly-tuya-intelligence" --summary "$s" --headers "item|value" --row "job|audit-and-enrich" --row "result|$JOB_STATUS" --thanks "Koen Kanters and the zigbee-herdsman-converters contributors" --thanks "zigpy / ZHA, deCONZ, tuya-local, tinytuya and localtuya authors" >> "$GITHUB_STEP_SUMMARY" || true
