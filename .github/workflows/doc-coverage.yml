# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Lists modules, gates and workflows that no doc describes yet. Report only, never fails.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P3032: documentation coverage report. Read-only, report mode: lists modules, gates, workflows,
# env flags, drivers and KB files that no hand-written doc names yet. Never fails, never pushes.
# Doc: docs/knowledge/KB/DOC_COVERAGE.md (generated by scripts/kb/doc-coverage.js)

name: "Doc Coverage (P3032)"

on:
  push:
    branches: [master, stable-v5, bastien-home]
    paths:
      - "docs/**"
      - "lib/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CREDITS.md"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: doc-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Doc coverage (report only)
        run: |
          node scripts/kb/doc-coverage.js --stdout > "$RUNNER_TEMP/doc-coverage.md" || true
          cat "$RUNNER_TEMP/doc-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          node scripts/kb/doc-coverage.js --check || true
          node scripts/kb/code-reference.js --check || true
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Lists modules, gates and workflows that no doc describes yet. Report only, never fails."; else s="Stopped early ($JOB_STATUS); the red step above says why. Lists modules, gates and workflows that no doc describes yet. Report only, never fails."; fi
          node scripts/lib/report-writer.js --title "doc-coverage" --summary "$s" --headers "item|value" --row "job|report" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" >> "$GITHUB_STEP_SUMMARY" || true
