# P3032: documentation coverage report. Read-only, report mode: lists modules, gates, workflows,
# env flags, drivers and KB files that no hand-written doc names yet. Never fails, never pushes.
# Doc: docs/knowledge/KB/DOC_COVERAGE.md (generated by scripts/kb/doc-coverage.js)

name: "Doc Coverage (P3032)"

on:
  push:
    branches: [master, stable-v5, bastien-home]
    paths:
      - "docs/**"
      - "lib/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CREDITS.md"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: doc-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Doc coverage (report only)
        run: |
          node scripts/kb/doc-coverage.js --stdout > "$RUNNER_TEMP/doc-coverage.md" || true
          cat "$RUNNER_TEMP/doc-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          node scripts/kb/doc-coverage.js --check || true
          node scripts/kb/code-reference.js --check || true
