# Fleet Intelligent Enrich (P2372)
# All driver classes + free-scrape budget + AI forfait. Never paid overage.
# Cron staggered off auto-enrich */4 and forum-poll :15 — avoids scrape lockouts.
# Triggers: cron 35 1,13 * * * + workflow_dispatch

name: 🧠 Fleet Intelligent Enrich (P2372)

on:
  schedule:
    # Twice daily 01:35 and 13:35 UTC — between enrich */4 and forum :15 herds
    - cron: '35 1,13 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply enrichments (false = dry-run report only)'
        required: false
        type: boolean
        default: true
      crawl:
        description: 'Crawl external sources (Z2M/ZHA/Blakadder). Prefer false if caches warm.'
        required: false
        type: boolean
        default: false
      skip_commit:
        description: 'Skip git commit even if apply=true'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write # safe-auto-commit: single refusal comment on the tracking issue

concurrency:
  group: fleet-intelligent-enrich
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  AI_PLAN_MODE: forfait
  AI_ALLOW_PAID: 'false'
  AI_GLOBAL_DAILY_CAP: '80'
  AI_SOFT_STOP_PERCENT: '60'
  AI_FORCE_LOCAL: 'true'
  GMAIL_DIAG_AI_MAX: '0'
  FORUM_AUTO_POST: '0'
  SHADOW_FORUM: '1'
  SMART_FETCH_READER_FALLBACK: '1'
  FIRECRAWL_DAILY_MAX: '3'
  FREE_SCRAPE_BROWSER: '0'
  TUYA_FP_HEURISTIC: '1'
  AI_ALLOW_REMOTE: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  fleet-enrich:
    name: Fleet enrich all driver classes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FIRECRAWL_API_KEY: ${{ vars.FIRECRAWL_DISABLED != 'true' && secrets.FIRECRAWL_API_KEY || '' }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        # WHY(P2383): prefer setup-node@v5 — security/policy gate warning
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Restore intel source cache (ETag + scanner TTL + manifest)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/scraper-cache
            .cache/scanner-blobs
            .cache/scanners
            .github/state/intelligent-source-manifest.json
          key: intel-source-diff-${{ hashFiles('package-lock.json', 'config/enrichment/source-registry.json') }}-${{ github.workflow }}
          restore-keys: |
            intel-source-diff-
            intel-cache-
            auto-enrich-cache-
            scraper-cache-

      - name: AI forfait preflight
        run: node tools/ci/ai-plan-guard.js --preflight || true

      - name: Free-scrape budget preflight
        run: node tools/ci/free-scrape-budget.js --preflight || true

      - name: Intelligent source diff (cache-first plan)
        run: node tools/ci/intelligent-source-diff.js || true

      - name: Driver-class coverage (all types)
        run: node tools/ci/driver-class-fleet-enrich.js

      - name: Fleet intelligent enrich
        id: fleet
        run: |
          ARGS="--skip-crawl"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="--apply --skip-crawl"
          fi
          if [ "${{ inputs.crawl }}" = "true" ]; then
            ARGS="--apply --crawl"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled: apply from cache (no crawl storm) — crawls live on blakadder/auto-enrich
            ARGS="--apply --skip-crawl"
          fi
          if [ "${{ inputs.apply }}" = "false" ]; then
            ARGS="--skip-crawl"
          fi
          echo "Running: node tools/ci/fleet-intelligent-enrich.js $ARGS"
          node tools/ci/fleet-intelligent-enrich.js $ARGS 2>&1 | tee fleet-enrich.log
          echo "### Fleet enrich" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/fleet-enrich-$(date -u +%F)/summary.json ]; then
            node -e "const j=require('./reports/fleet-enrich-'+new Date().toISOString().slice(0,10)+'/summary.json'); console.log(JSON.stringify({ok:j.ok,delta:j.delta,baseline:j.baseline,final:j.final},null,2))" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/driver-class-enrich-$(date -u +%F)/summary.json ]; then
            echo "### Driver classes" >> "$GITHUB_STEP_SUMMARY"
            node -e "const j=require('./reports/driver-class-enrich-'+new Date().toISOString().slice(0,10)+'/summary.json'); console.log(JSON.stringify({totals:j.totals,classes:Object.fromEntries(Object.entries(j.classes||{}).map(([k,v])=>[k,v.count]))},null,2))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sacred + anti-bot gates
        run: |
          node tools/ci/strip-registry-forbidden-compose.js --apply
          # P2797: keep dual-couple removals, resync app.json fingerprints with compose, then block the
          # commit on drift, flow-title loss or a reverted couple resolution (ff1de8d2e).
          node tools/ci/enforce-dual-couple-legacy.js --sync
          # Shared list (scripts/ci/rules-gates.js, profile full = core + compose/app.json sync).
          node scripts/ci/rules-gates.js --profile=full
          node --test test/critical/p2794-dual-couples.test.js test/critical/p2692-publish-heal-energy.test.js test/critical/p2433-hobeian-fodv6bkr-enrich.test.js
          node tools/ci/p2519-anti-regression-enrich-gate.js
          node tools/ci/free-scrape-budget.js --report >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit enrichment (skip ci)
        if: ${{ (github.event_name == 'schedule' || inputs.apply == true) && inputs.skip_commit != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # WHY(ci-consolidation 2026-10): 7/12 recent failures were this push step (pull --rebase on a
          # dirty tree, then non-fast-forward). safe-auto-commit stages → gates → commits → rebase-retries.
          node scripts/ci/safe-auto-commit.js --id=fleet-enrich \
            --message="fleet-enrich: intelligent all-class coverage (P2372)" \
            --paths="drivers data app.json docs/knowledge reports config/enrichment tools/ci lib/scraper lib/flow"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-enrich-${{ github.run_id }}
          path: |
            reports/fleet-enrich-*/
            reports/driver-class-enrich-*/
            fleet-enrich.log
            .cache/scraper-cache/_free-scrape-budget.json
            .github/state/intelligent-source-manifest.json
          retention-days: 7
      # P3021b: ledger wiring (same pattern as gmail-diagnostics P2908 / forum-poll P2909).
      - name: Ledger intake (P3021b)
        id: p3021b_ledger
        if: always() && inputs.skip_commit != true
        continue-on-error: true
        run: |
          git pull -q --ff-only origin master || echo "::warning::ledger intake: could not fast-forward, writing on the checkout"
          node scripts/progress/ledger-intake.js run fleet-intelligent-enrich "reports/fleet-enrich-$(date -u +%F)/summary.json"
      - name: Commit ledger (gated, P3021b)
        if: always() && steps.p3021b_ledger.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/safe-auto-commit.js --id=fleet-intelligent-enrich-ledger --max-per-day=4 \
            --message="chore(ledger): fleet-intelligent-enrich findings" \
            --paths="data/progress/ledger.json"

  # P2936: full cross-research of every item this workflow handles (kill switch: vars.XR_ENABLED=false,
  # report-only: vars.XR_APPLY=false). Bounded (max items, net/OCR caps), cached, no paid API.
  cross-research:
    needs: [fleet-enrich]
    if: ${{ always() && vars.XR_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
    concurrency:
      group: cross-research-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: ./.github/actions/cross-research
        env:
          XR_ENABLED: ${{ vars.XR_ENABLED }}
          XR_APPLY: ${{ vars.XR_APPLY }}
        with:
          items: needs-info
          max: '120'
          id: xr-fleet-intelligent-enrich
