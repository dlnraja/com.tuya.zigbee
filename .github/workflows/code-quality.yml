# Code Quality Check (PR + push)
#
# Re-enabled after P10 with:
#   - upstream-guard (no writes to Johan)
#   - concurrency control
#   - path filter
#   - 15 min timeout
#   - DRY_RUN by default for sensitive ops
#
# Triggers:
#   - PR to master/main/stable-v5
#   - Push to those branches on .js, .json, .yml files
#   - Weekly schedule (Wednesdays 03:00 UTC)
#   - Manual dispatch

name: code-quality

on:
  pull_request:
    branches: [master, main, stable-v5]
  push:
    branches: [master, main, stable-v5]
    paths:
      - '**/*.js'
      - 'drivers/**/*.json'
      - '.github/workflows/**'
      - 'package*.json'
  schedule:
    - cron: '20 4 * * 3'  # Weekly Wednesday 04:20, clear of nightly 03:45, self-heal 04:00, and blakadder 04:15
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: code-quality
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  upstream-guard:
    name: Upstream Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 5
      - name: Verify no upstream writes
        run: |
          if grep -r "JohanBendz/com.tuya.zigbee" .github/workflows/ 2>/dev/null | grep -v upstream-guard.yml | grep -q "push\|create\|POST"; then
            echo "::error::Workflow has potential upstream write — review required"
            exit 1
          fi
          echo "✓ No upstream writes detected"

  code-quality:
    name: Quality Checks
    needs: upstream-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci --prefer-offline --no-audit
        if: hashFiles('package-lock.json') != ''
        # Fallback for repos without lock file

      - name: Install deps (no lock)
        run: npm install --prefer-offline --no-audit --no-save
        if: hashFiles('package-lock.json') == ''

      - name: Lint JS
        id: lint
        run: |
          if [ -f .eslintrc* ] || [ -f eslint.config.* ]; then
            npx eslint --max-warnings=0 . 2>&1 | tail -50 || true
          else
            echo "(no eslint config, skipping)"
          fi
        continue-on-error: true

      - name: Voice safety check
        id: voice
        run: npm run check:voice 2>&1 | tail -50
        continue-on-error: true

      - name: JSON schema validation
        id: json
        run: |
          ERRORS=0
          for f in drivers/*/driver.compose.json; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "  ❌ INVALID JSON: $f"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS invalid driver.compose.json files"
            exit 1
          fi
          echo "✓ All driver.compose.json files valid"

      - name: Anti-bot + P2138 sacred-couple matrix + P244x flow/knob
        id: sacred
        run: |
          node tools/ci/anti-bot-regression-gate.js
          node tools/ci/p2138-sacred-couple-matrix-gate.js
          npm run check:p244x
          npm run check:flow-titleformatted
          npm run check:p246x
          npm run check:p248x
          npm run check:p249x
          npm run check:p257x
          npm run check:p2580
          npm run check:publish

      - name: Driver health check
        id: health
        run: |
          if [ -f scripts/validation/check-driver-health.js ]; then
            node scripts/validation/check-driver-health.js 2>&1 | tail -30 || true
          fi
        continue-on-error: true

      - name: Alibaba OCR intelligent (P2592 free soft)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          OCR_INSTALL: '1'
          OCR_FROM: 'HEAD~40'
          OCR_TO: 'HEAD'
          AI_FORCE_LOCAL: 'true'
          AI_ALLOW_PAID: 'false'
        run: |
          if [ ! -f tools/ci/ocr-intelligent-cron.js ]; then
            echo "ocr-intelligent-cron missing — skip"
            exit 0
          fi
          npm install -g @alibaba-group/open-code-review 2>/dev/null || true
          node tools/ci/ocr-intelligent-cron.js || echo "OCR_SOFT_WARN"

      - name: Build summary
        if: always()
        env:
          # Pass PR ref through env to avoid shell injection from fork branch names
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          {
            echo "## 🔍 Code Quality — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- Lint: ${{ steps.lint.outcome == 'success' && '✅' || '⚠️' }}"
            echo "- JSON: ${{ steps.json.outcome == 'success' && '✅' || '❌' }}"
            echo "- Sacred: ${{ steps.sacred.outcome == 'success' && '✅' || '❌' }}"
            echo "- Health: ${{ steps.health.outcome == 'success' && '✅' || '⚠️' }}"
            echo ""
            echo "**Run**: ${{ github.run_id }}"
            echo "**Trigger**: ${{ github.event_name }} $PR_HEAD_REF"
          } >> $GITHUB_STEP_SUMMARY
