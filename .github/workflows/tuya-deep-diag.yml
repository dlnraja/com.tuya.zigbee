# Tuya Deep Diagnostics Recovery
# Triggers: workflow_dispatch | Secrets: GH_PAT,GMAIL_APP_PASSWORD,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_EMAIL,GMAIL_REFRESH_TOKEN,GOOGLE_API_KEY,HOMEY_EMAIL,HOMEY_PASSWORD,HOMEY_PAT,HOMEY_PAT_API
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: "Tuya Deep Diagnostics Recovery"

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "Optional Homey diagnostic/report ID to correlate"
        required: false
      good_build:
        description: "Optional known-good Athom build id for dashboard comparison"
        required: false
      bad_build:
        description: "Optional failing Athom build id for dashboard comparison"
        required: false
      all_history:
        description: "Fetch historical Gmail diagnostics for correlation"
        type: boolean
        default: false
        required: false
      since:
        description: "Optional start date for IMAP search, for example 2019-01-01"
        required: false
      until:
        description: "Optional exclusive end date for IMAP search, for example 2024-01-01"
        required: false
      max_results:
        description: "Maximum Gmail diagnostics to fetch per IMAP window"
        default: "500"
        required: false
      max_total_results:
        description: "Maximum Gmail diagnostics to keep across all IMAP windows"
        default: "5000"
        required: false
      chunk_days:
        description: "Split historical IMAP fetch into N-day windows; 0 disables chunking"
        default: "0"
        required: false
      reprocess:
        description: "Ignore processed Gmail diagnostic state"
        type: boolean
        default: false
        required: false
      require_access:
        description: "Fail the workflow when Gmail IMAP and OAuth diagnostics access are both unavailable"
        type: boolean
        default: false
        required: false
      download_archives:
        description: "Download build archives during dashboard comparison"
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

permissions:
  contents: read
  issues: read

concurrency:
  group: tuya-deep-diag-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit || npm install

      - name: Crash regression guard - Homey timer context
        run: npm run check:timer-context

      - name: Fetch Gmail crash diagnostics
        continue-on-error: true
        timeout-minutes: 8
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_DIAG_AI_MAX: "0"
          GMAIL_DIAG_ALL_HISTORY: ${{ github.event.inputs.all_history || 'false' }}
          GMAIL_DIAG_SINCE: ${{ github.event.inputs.since || '' }}
          GMAIL_DIAG_UNTIL: ${{ github.event.inputs.until || '' }}
          GMAIL_DIAG_MAX_RESULTS: ${{ github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_MAX_TOTAL_RESULTS: ${{ github.event.inputs.max_total_results || github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '0' }}
          GMAIL_DIAG_STATE_LIMIT: ${{ github.event.inputs.max_total_results || '5000' }}
          GMAIL_DIAG_REPROCESS: ${{ github.event.inputs.reprocess || 'false' }}
          GMAIL_DIAG_REQUIRE_ACCESS: ${{ github.event.inputs.require_access || 'false' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "true"
        run: node .github/scripts/fetch-gmail-diagnostics.js

      - name: Homey dashboard and device diagnostics
        continue-on-error: true
        timeout-minutes: 8
        env:
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/homey-token-refresh.js || true
          node scripts/automation/dashboard-monitor.js --latest || true
          node scripts/automation/version-intelligence-report.js || true
          node .github/scripts/homey-device-diagnostics.js || true
          node .github/scripts/collect-diagnostics.js || true

      - name: Free scrape harvest (forum + Z2M + Reddit) then diag UUID hints
        continue-on-error: true
        timeout-minutes: 12
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CRAWL4AI_URL: ${{ secrets.CRAWL4AI_URL }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          node tools/ci/free-scrape-crossref.js --topic=140352 --focus=2137 \
            --queries="Tuya SOS Homey,water leak IAS,UNSUPPORTED_CLUSTER,invert alarm" || true
          node scripts/ci/diag-investigate-orchestrator.js --self-test || true

      - name: Fetch Homey app-diag by UUID (report_id)
        if: ${{ github.event.inputs.report_id != '' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          HOMEY_DIAG_UUID: ${{ github.event.inputs.report_id }}
          HOMEY_DIAG_PUPPETEER: "1"
          TARGET_APP_ID: com.dlnraja.tuya.zigbee
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          npm install puppeteer --no-save
          node scripts/ci/fetch-homey-app-diag-by-uuid.js "$HOMEY_DIAG_UUID" || true
          node scripts/ci/scan-homey-crashes-for-uuid.js "$HOMEY_DIAG_UUID" --puppeteer || true
          node scripts/ci/gmail-search-diag-uuid.js "$HOMEY_DIAG_UUID" || true

      - name: Fetch harvested diag UUIDs from free-scrape hints
        if: ${{ github.event.inputs.report_id == '' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DIAG_MAX_UUIDS: "5"
        run: node scripts/ci/diag-investigate-orchestrator.js --fetch-diags --max-uuids=5 || true

      - name: Athom Developer Dashboard full diag
        continue-on-error: true
        timeout-minutes: 10
        env:
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          TARGET_APP_ID: com.dlnraja.tuya.zigbee
        run: |
          npm install puppeteer --no-save
          ARGS=()
          if [ -n "${{ github.event.inputs.good_build }}" ]; then ARGS+=("${{ github.event.inputs.good_build }}"); fi
          if [ -n "${{ github.event.inputs.bad_build }}" ]; then ARGS+=("${{ github.event.inputs.bad_build }}"); fi
          if [ "${{ github.event.inputs.download_archives }}" = "true" ]; then ARGS+=("--download"); fi
          node .github/scripts/athom-puppeteer-full-diag.js "${ARGS[@]}"

      - name: Privacy gate
        if: always()
        run: node .github/scripts/privacy-redactor.js diagnostics .github/state/diagnostics-report.json .github/state/diagnostics-crossref.yml .github/state/homey-device-report.json .github/state/dashboard-monitor-report.json screenshots/full-diag-report.json .github/state/homey-app-diag

      - name: Diagnostic history gate
        if: always()
        run: npm run check:diag-history --if-present

      - name: Upload sanitized diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tuya-deep-diag-${{ github.run_id }}
          path: |
            diagnostics/summary.json
            .github/state/diagnostics-report.json
            .github/state/homey-device-report.json
            .github/state/dashboard-monitor-report.json
            .github/state/version-intelligence-report.json
            .github/state/homey-app-diag/
            .github/state/free-scrape/
            .github/state/diag-orchestrator/
            docs/WORKING_VERSIONS_REFERENCE.md
            screenshots/full-diag-report.json
          if-no-files-found: warn
          retention-days: 14
