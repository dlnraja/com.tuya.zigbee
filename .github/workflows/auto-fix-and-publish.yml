# 🤖 Auto-Fix + Publish Pipeline
# Triggers: cron: 5 */6 * * * + push,schedule,workflow_dispatch | Secrets: HOMEY_PAT
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: 🤖 Auto-Fix + Publish Pipeline

on:
  push:
    branches: [master, stable-v5]
  schedule:
    - cron: '5 */6 * * *'  # Every 6 hours
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write
  issues: write  # needed by the "🔔 Notify on failure" step (POST /issues/420/comments was 403)

# v9.0.256 (P62.3): Move HOMEY_PUBLISH env vars to workflow level so they
# apply to ALL steps in ALL jobs (not just the publish step). The step-level
# env block doesn't propagate to the npm subshell on all GHA runner images,
# so the prepare-publish step was still seeing limit 26.00 MB.
env:
  # P138: Align with Auto-Publish / publish-stable (50). Prepared dir is now
  # ~37 MB uncompressed (gzipped ~18 MB); the old 35 MB gate false-failed CI
  # while Athom still accepts the tarball. prepare-publish.js default is 50.
  HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB: "50"
  HOMEY_PUBLISH_SOURCE_MAX_MB: "50"
  HOMEY_ZIGBEE_MAX_TOTAL_COMBOS: "20000"
  HOMEY_ZIGBEE_MAX_DRIVER_COMBOS: "2000"

concurrency:
  # Per-branch so master and stable-v5 do not serialize/race on one lock.
  group: auto-fix-and-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 100
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline --no-audit || npm install --no-audit

      - name: 🗣️ Google Assistant / Alexa voice-safety gate
        run: npm run check:voice

      - name: 🤖 Run auto-fix-all
        run: node scripts/validation/auto-fix-all.js || true

      - name: Dedupe driver flow cards (app.json + .homeycompose)
        run: node tools/ci/sync-appjson-flow-dedupe.js --apply || true

      # P99: Homey compose matching is case-sensitive — ensure canonical+lower forms
      - name: "🔤 Ensure manufacturer case variants (P99)"
        run: node tools/ci/ensure-case-variants.js --apply

      # v9.0.262 (P63.3): Re-inject manual driver fixes (HOBEIAN P61 etc.)
      # AFTER the auto-fix-all has run, BEFORE the build/publish. The
      # auto-publish bot regenerates driver.compose.json from canonical
      # templates and may drop manual fingerprints. This step re-applies
      # the fixes so the compiled manifest (app.json) and the source
      # stay in sync.
      - name: "🔁 Re-inject manual driver fixes (P63.3)"
        run: node tools/ci/re-inject-manual-fixes.js

      # P94+: hard-fail if bot reintroduced known wrong Sacred Couple routings
      # (complements re-inject repair with a detect gate before publish commit)
      - name: "🛡️ Anti-bot regression gate (P94+)"
        run: node tools/ci/anti-bot-regression-gate.js

      - name: "🛡️ P2138 sacred-couple matrix gate"
        run: node tools/ci/p2138-sacred-couple-matrix-gate.js

      # P102: Device I/O façade smoke + bare ZigBeeDevice gate
      - name: "🔌 P102 DeviceIOFacade smoke"
        run: npm run io:smoke

      - name: "📡 P109 RF coexistence smoke"
        run: npm run check:rf

      - name: "🧱 P102 bare ZigBeeDevice gate"
        run: npm run check:bare-zigbee

      - name: "🧷 P117 unbound .catch(this.error) gate"
        run: node tools/ci/fix-unbound-catch-this-error.js --gate

      - name: "➗ P120 adaptive double-division soft gate"
        continue-on-error: true
        run: node tools/ci/adaptive-double-division-gate.js

      # Soft intelligent enrich (forum/johan proposals) — never dumps to generic_tuya
      - name: "🧠 Bidirectional enrich (CI + sacred couple)"
        continue-on-error: true
        run: node tools/ci/bidirectional-enricher.js || true

      # Infer from incomplete local corpora (HIGH-confidence sacred rehomes only)
      - name: "🔍 Infer-enrich from incomplete (dry-run then apply)"
        continue-on-error: true
        run: |
          node tools/ci/infer-enrich-from-incomplete.js --dry-run || true
          node tools/ci/infer-enrich-from-incomplete.js --apply || true
          node tools/ci/ensure-case-variants.js --apply || true

      # P101: re-apply high-confidence #439 sacred-couple lot2 (idempotent)
      - name: "🔀 Sacred-couple lot2 (#439 typed rehomes)"
        continue-on-error: true
        run: node tools/ci/apply-p101-sacred-lot2.js --apply || true

      - name: "🔁 Re-inject after enrich (keep manual overrides)"
        run: node tools/ci/re-inject-manual-fixes.js

      # Enrich/Blakadder can reintroduce climate catch-all collisions — strip again
      # continue-on-error: same-category residual conflicts (39) are non-blocking
      - name: "🔧 FP conflict resolve (post-enrich)"
        continue-on-error: true
        run: node scripts/automation/fix-fingerprint-conflicts.js --soft-exit

      # P217: conflict resolve must not win over HOBEIAN/Wing sacred couples
      - name: "🔁 Re-inject after conflict resolve"
        run: node tools/ci/re-inject-manual-fixes.js

      - name: "🛡️ Anti-bot gate (post-enrich)"
        run: node tools/ci/anti-bot-regression-gate.js --strip

      - name: "🛡️ P217 fork harvest sacred-couple gate"
        run: node tools/ci/p217-fork-harvest-gate.js

      - name: "🛡️ P2138 sacred-couple matrix gate"
        run: node tools/ci/p2138-sacred-couple-matrix-gate.js

      - name: "🛡️ Regression lessons gate (MUST-KEEP fatals)"
        run: node tools/ci/regression-lessons-gate.js

      - name: "📧 Gmail/dashboard crash pattern gate (P100)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm run check:diag-protocol || true
          node .github/scripts/privacy-redactor.js \
            .github/state/gmail-crash-patterns.json \
            .github/state/gmail-unique-fps.json \
            .github/state/gmail-fps-crossref-v2.json \
            .github/state/sacred-couple-dry-gate.json || true

      - name: "🕷️ Light Z2M/ZHA sync (schedule/dispatch only)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          if [ ! -f tools/ci/mega-crawler.js ]; then
            echo "mega-crawler missing — skip light sync"
            exit 0
          fi
          timeout 200 npm run sync:z2m-zha:light || echo "z2m/zha light sync skipped/failed (non-blocking)"

      - name: 📊 Dashboard monitor
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          # P2323: Athom client needs ≥60s; 30s wall clock was cutting soft-alert short
          HOMEY_API_TIMEOUT_MS: "120000"
        run: timeout 150 node scripts/automation/dashboard-monitor.js --latest || true

      - name: "📧 Re-scan crash patterns after dashboard carto"
        continue-on-error: true
        run: |
          node tools/ci/gmail-crash-pattern-gate.js || true
          node .github/scripts/privacy-redactor.js .github/state/gmail-crash-patterns.json .github/state/dashboard-monitor-report.json || true

      - name: 📋 Check processing_failed builds
        id: processing_check
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          # P2325/P2385: refuse bump-loop when hang + healthy Test
          HOMEY_API_TIMEOUT_MS: "120000"
        run: |
          node .github/scripts/processing-failure-republish-check.js
          echo "### P139/P2325 republish gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Refuse patch bump when Athom \`processing_failed\` / socket hang up and Test is already healthy." >> "$GITHUB_STEP_SUMMARY"

      - name: 🔁 Bump version for Homey recovery publish
        # P139: only bump when recovery checker says so — never on bare
        # workflow_dispatch (that caused patch spam on socket hang up).
        if: env.publish_recovery_requires_bump == 'true'
        env:
          BUMP_LEVEL: patch
          HOMEY_CHANGELOG: ${{ env.publish_recovery_changelog || 'Stability improvements and Homey test publication retry.' }}
        run: |
          echo "Recovery publish reason: ${publish_recovery_reason:-manual workflow dispatch}"
          node .github/scripts/bump-homey-version.js

      - name: 🔐 Redact dashboard diagnostics before committing
        if: always()
        run: node .github/scripts/privacy-redactor.js .github/state/dashboard-monitor-report.json || true

      - name: 💾 Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          restore_volatile_artifacts() {
            for path in .github/state diagnostics screenshots screenshots-debug promote-screenshots push-promote-screenshots .homeybuild; do
              git restore -- "$path" 2>/dev/null || true
            done
          }
          stage_auto_fix_paths() {
            for path in drivers lib app.json .homeycompose .homeychangelog.json CHANGELOG.md README.md docs .cursorrules AI_INSTRUCTIONS.md package.json package-lock.json data/mfs_db.json tools/ci; do
              [ -e "$path" ] && git add "$path"
            done
          }
          restore_volatile_artifacts
          stage_auto_fix_paths
          if ! git diff --staged --quiet; then
            git commit -m "🤖 auto-fix-all: automated fixes [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-master}"
            restore_volatile_artifacts
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::group::Remaining tracked changes before rebase"
              git status --short
              echo "::endgroup::"
              # Soft: leftover dirty trees are usually race noise; restore again
              # and continue. Hard-fail only blocks the next scheduled run.
              restore_volatile_artifacts
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "::warning::Uncommitted tracked changes remain after restore; skipping auto-fix push (retry next run)"
                exit 0
              fi
            fi
            git fetch origin "$BRANCH"
            if ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              # Rebase conflicts (typically app.json version bumps raced with a
              # concurrent push) used to fail the whole run. Auto-fix commits
              # are idempotent and regenerated next run, so on conflict we
              # abort and resync to origin instead of failing.
              if ! git rebase -X ours "origin/$BRANCH"; then
                echo "::warning::Rebase conflict on origin/$BRANCH; dropping auto-fix commit and resyncing (fixes are regenerated on the next run)"
                git rebase --abort || true
                git reset --hard "origin/$BRANCH"
              fi
            else
              echo "origin/$BRANCH is already an ancestor of HEAD; skipping rebase"
            fi
            # P198: retry push on concurrent ref lock / non-fast-forward races
            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:"refs/heads/$BRANCH"; then
                pushed=1
                break
              fi
              echo "::warning::Auto-fix push attempt ${attempt} failed; fetch+rebase and retry"
              git fetch origin "$BRANCH"
              if ! git rebase -X ours "origin/$BRANCH"; then
                git rebase --abort || true
                git reset --hard "origin/$BRANCH"
                echo "::warning::Giving up auto-fix push after rebase conflict (regenerated next run)"
                exit 0
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::Auto-fix push exhausted retries; skipping (regenerated next run)"
              exit 0
            fi
            git fetch origin "$BRANCH"
            git merge-base --is-ancestor HEAD "origin/$BRANCH" || {
              echo "::warning::Auto-fix commit HEAD not reachable from origin/$BRANCH after push (race); OK next run"
              exit 0
            }
          else
            echo "No auto-fix changes to commit"
          fi

      - name: 🚀 Publish if needed
        # P193/P217/P2385: never Homey-publish 5.12 from this workflow while master 9.0 soaks.
        # Publish ONLY when recovery gate set trigger_publish=true — bare workflow_dispatch
        # must NOT bypass P139 (that spam-bumped on socket hang up).
        if: env.trigger_publish == 'true' && github.ref_name != 'stable-v5'
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          # P138: Match workflow-level 50 MB (prepared dir ~37 MB uncompressed).
          HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB: "50"
          HOMEY_PUBLISH_SOURCE_MAX_MB: "50"
          HOMEY_ZIGBEE_MAX_TOTAL_COMBOS: "20000"
          HOMEY_ZIGBEE_MAX_DRIVER_COMBOS: "2000"
          HOMEY_ZIGBEE_MAX_CASE_FORMS: "2"
          HOMEY_API_TIMEOUT_MS: "120000"
          HOMEY_BUILD_POLL_TIMEOUT_MS: "360000"
          HOMEY_DRAFT_WAIT_MS: "600000"
          HOMEY_HEALTHY_TEST_PATCH_LAG: "8"
        run: |
          # v9.0.255 (P62.2): Also export in the shell because npm subshells
          # don't always inherit step env blocks on all GHA runner images.
          export HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB HOMEY_PUBLISH_SOURCE_MAX_MB
          export HOMEY_ZIGBEE_MAX_TOTAL_COMBOS HOMEY_ZIGBEE_MAX_DRIVER_COMBOS HOMEY_ZIGBEE_MAX_CASE_FORMS
          export HOMEY_API_TIMEOUT_MS HOMEY_BUILD_POLL_TIMEOUT_MS HOMEY_DRAFT_WAIT_MS
          echo "Limits: HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB=$HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB MB"
          npx homey app build
          node scripts/maintenance/fix-large-images.js
          node scripts/maintenance/optimize-build-images.cjs
          node scripts/maintenance/optimize-build-svgs.cjs
          node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json
          npm run prepare-publish
          PUBLISH_DIR="${HOMEY_PUBLISH_DIR:-$(node -p "require('path').join(require('os').tmpdir(), 'homey-publish-temp')")}"
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "::error::Prepared publish directory is missing: $PUBLISH_DIR"
            echo "::error::Hint: prepare-publish must run in the same job; check HOMEY_PUBLISH_DIR / .homeybuild"
            exit 1
          fi
          echo "Using PUBLISH_DIR=$PUBLISH_DIR"
          cd "$PUBLISH_DIR"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          else
            npm install --omit=dev --ignore-scripts --no-audit --no-fund
          fi
          run_homey_cli_publish() {
            if [ -x "$GITHUB_WORKSPACE/node_modules/.bin/homey" ]; then
              HOMEY_HEADLESS=1 HOMEY_PAT="$HOMEY_PAT" "$GITHUB_WORKSPACE/node_modules/.bin/homey" app publish --path "$PUBLISH_DIR"
            else
              HOMEY_HEADLESS=1 HOMEY_PAT="$HOMEY_PAT" npx homey app publish --path "$PUBLISH_DIR"
            fi
          }
          set +e
          publish_output=$(run_homey_cli_publish 2>&1)
          publish_status=$?
          if [ "$publish_status" -ne 0 ] && printf '%s\n' "$publish_output" | grep -Eiq 'Timeout after [0-9]+ms|fetch failed|ETIMEDOUT|ECONNRESET|ECONNABORTED|socket hang up|too many requests|\b429\b|processing_failed'; then
            echo "::warning::Homey CLI publish hit a transient Athom hang; retrying via direct Athom Apps API with extended timeouts."
            fallback_output=$(HOMEY_PAT="$HOMEY_PAT" HOMEY_API_TIMEOUT_MS="${HOMEY_API_TIMEOUT_MS:-120000}" HOMEY_BUILD_POLL_TIMEOUT_MS="${HOMEY_BUILD_POLL_TIMEOUT_MS:-360000}" node "$GITHUB_WORKSPACE/scripts/direct-api-publish.js" --path "$PUBLISH_DIR" --channel test 2>&1)
            fallback_status=$?
            publish_output="$(printf '%s\n%s' "$publish_output" "$fallback_output")"
            publish_status=$fallback_status
          fi
          set -e
          printf '%s\n' "$publish_output"
          if [ "$publish_status" -ne 0 ]; then
            if printf '%s\n' "$publish_output" | grep -Eiq 'already been published|currently in review|socket hang up|SOFT-EXPECT|peer-test|P139'; then
              echo "::warning::P139 Athom transient / already published — leaving last healthy Test in place"
              exit 0
            fi
            exit "$publish_status"
          fi
          echo "Draft publish completed"

      - name: 📊 Post-publish dashboard check
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_API_TIMEOUT_MS: "120000"
        run: |
          sleep 60
          timeout 150 node scripts/automation/dashboard-monitor.js --latest || true

      - name: 🔔 Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // P202: never hardcode a closed issue (was spam-commenting #420 on every Auto-Fix failure)
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `⚠️ Auto-Fix pipeline failed. Check [run #${context.runId}](${url})`;
            core.summary.addRaw(body).write();
            core.warning(body);
            // Optional: comment only on an OPEN issue whose body mentions AutofixNotify, else skip
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'autofix-notify',
              per_page: 1,
            });
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }
