# What it does: Weekly read-only look at other Zigbee/Tuya/Wi-Fi apps in the Homey store to spot gaps.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors; the
#   zigpy / ZHA device handler authors; Blakadder's Zigbee device database; JohanBendz's original Tuya Zigbee
#   app (read-only reference); the authors of the other Homey store apps we compare with.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P2657 — Homey Store peer probe (read-only Athom API)
# Catalog Zigbee/Tuya/WiFi peers for complementary enrich. Never forum POST.
name: Homey Store Peer Probe

on:
  schedule:
    # Weekly Sunday 05:40 UTC (staggered from blakadder / forum-poll)
    - cron: '40 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homey-store-peer-probe
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  probe:
    name: Probe Athom peers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Probe Homey Store peers
        run: node tools/ci/homey-store-peer-probe.js

      - name: Contre quoi gate
        run: npm run check:p2657

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: homey-store-peers-report
          path: reports/homey-store-peers-*/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit report if changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/homey-store-peers-*/SUMMARY.md reports/homey-store-peers-*/athom-probe-wide.json || true
          if git diff --staged --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "chore(P2657): refresh Homey Store peer probe [skip ci]"
          # P3025: shared race-safe push (old pull-before-commit failed on the dirty tree; push||true hid losses)
          bash .github/scripts/git-push-retry.sh --branch master || echo "::warning::P3025 peer probe not pushed (see git-push-retry log)"
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly read-only look at other Zigbee/Tuya/Wi-Fi apps in the Homey store to spot gaps."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly read-only look at other Zigbee/Tuya/Wi-Fi apps in the Homey store to spot gaps."; fi
          node scripts/lib/report-writer.js --title "homey-store-peer-probe" --summary "$s" --headers "item|value" --row "job|probe" --row "result|$JOB_STATUS" --thanks "Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors" --thanks "the zigpy / ZHA device handler authors" --thanks "the authors of the other Homey store apps we compare with" >> "$GITHUB_STEP_SUMMARY" || true
