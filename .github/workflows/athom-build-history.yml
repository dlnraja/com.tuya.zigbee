# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Lists the Athom build history of our three apps (read-only) to study processing failures.
# Ideas from (thank you): Athom's official Homey app GitHub Actions (athombv); the Homey developer docs on
#   build channels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Triggers: workflow_dispatch | Secrets: HOMEY_PAT (read-only Athom build list)
# WHY(P2930, 21/10/2026 Paris): socket hang up / processing_failed root-cause study needs the
# full Athom build history (state + timestamps) of the three apps as a natural experiment.
# Read-only: lists builds, never uploads, never changes a channel.
name: Athom build history (read-only)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Builds per app'
        default: '200'
permissions:
  contents: read
concurrency:
  group: athom-build-history
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: mkdir -p "$RUNNER_TEMP/h" && cd "$RUNNER_TEMP/h" && npm init -y >/dev/null && npm install --no-audit --no-fund homey@4.4.1
      - name: Dump build history
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_BUILD_LIMIT: ${{ inputs.limit }}
          HOMEY_API_TIMEOUT_MS: '120000' # P3034: master list > 10 s
        run: |
          for app in com.dlnraja.tuya.zigbee com.dlnraja.tuya.zigbee.stable com.dlnraja.tuya.zigbee.bastien; do
            (cd "$RUNNER_TEMP/h" && node "$GITHUB_WORKSPACE/scripts/ci/homey-build-status.js" "$app" > /dev/null) || true
            node -e "const d=require('$GITHUB_WORKSPACE/data/status/homey-build-status-'+process.argv[1]+'.json');console.log(process.argv[1],'list_ms='+d.list_ms,'count='+d.list_count,'kept='+d.builds.length,'err='+(d.error||''))" "$app" || true
          done
          ls data/status/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: athom-build-history
          path: data/status/homey-build-status-*.json
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Lists the Athom build history of our three apps (read-only) to study processing failures."; else s="Stopped early ($JOB_STATUS); the red step above says why. Lists the Athom build history of our three apps (read-only) to study processing failures."; fi
          node scripts/lib/report-writer.js --title "athom-build-history" --summary "$s" --headers "item|value" --row "job|history" --row "result|$JOB_STATUS" --thanks "Athom's official Homey app GitHub Actions (athombv)" --thanks "the Homey developer docs on build channels" >> "$GITHUB_STEP_SUMMARY" || true
