# What it does: Merges Dependabot updates once checks are green.
# Ideas from (thank you): Renovate and Dependabot for the merge-when-green pattern; the actions/stale and
#   actions/labeler maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Dependabot Auto-Merge
# Triggers: pull_request | Secrets: GH_PAT
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: Dependabot Auto-Merge

# <!-- badges:start -->
# [![Dependabot Auto-Merge](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/dependabot-auto-merge.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/dependabot-auto-merge.yml)
# <!-- badges:end -->


on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read   # P3048: wait-pr-checks reads the workflow runs of the PR head SHA

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

defaults:
  run:
    shell: bash

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 45   # P3048: waits for the PR gates (max 35 min of polite polling)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate before merge
        id: validate
        run: |
          npm ci --prefer-offline --no-audit || npm install
          node --check app.js
          echo "valid=true" >> $GITHUB_OUTPUT

      # P3048 t539u (b): master has no branch protection, so --auto merged right away. Merge only when every
      # workflow on the PR head SHA finished green (Homey App Validate / Node 22 tests / Syntax Check required).
      - name: Wait for the PR gates
        id: gates
        if: steps.validate.outputs.valid == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/automation/wait-pr-checks.cjs --sha="$HEAD_SHA" --self="Dependabot Auto-Merge" --min-required="${{ steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && '2' || '1' }}"

      - name: Auto-approve patch/minor updates
        if: (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') && steps.validate.outputs.valid == 'true' && steps.gates.outputs.green == 'true'
        run: gh pr review -R dlnraja/com.tuya.zigbee --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch/minor updates
        if: (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') && steps.validate.outputs.valid == 'true' && steps.gates.outputs.green == 'true'
        run: gh pr merge -R dlnraja/com.tuya.zigbee --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Gates not green, left for review
        if: steps.gates.outcome == 'success' && steps.gates.outputs.green != 'true'
        env:
          REASON: ${{ steps.gates.outputs.reason }}
        run: echo "::notice title=Dependabot gate::not merged — ${REASON}"

      - name: Label major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit -R dlnraja/com.tuya.zigbee "$PR_URL" --add-label "major-update,needs-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Merges Dependabot updates once checks are green."; else s="Stopped early ($JOB_STATUS); the red step above says why. Merges Dependabot updates once checks are green."; fi
          node scripts/lib/report-writer.js --title "dependabot-auto-merge" --summary "$s" --headers "item|value" --row "job|auto-merge" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" >> "$GITHUB_STEP_SUMMARY" || true
