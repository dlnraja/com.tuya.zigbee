# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Weekly incremental refresh of the knowledge base from public device projects, delivered as one
#   draft PR.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters contributors; zigpy / ZHA, deCONZ,
#   tuya-local, tinytuya and localtuya authors; Blakadder's Zigbee device database.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P-KB: incremental knowledge-base refresh (Z2M, ZHC, ZHA, deCONZ, Blakadder, tuya-local, tinytuya, localtuya, Johan, zigbee-clusters, OTA)
# Mirrors are cached between runs (actions/cache) so git fetch is incremental; outputs are byte-identical when nothing moved.
# Never pushes to a release branch: changes land as one draft PR (data/kb is excluded from the Homey bundle).
name: KB refresh (weekly)
on:
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: kb-refresh
  cancel-in-progress: true
env:
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  GMAIL_DIAG_AI_MAX: '0'
defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/kb
          key: kb-mirrors-${{ github.run_id }}
          restore-keys: kb-mirrors-
      - name: Refresh KB
        env:
          KB_DIR: ${{ github.workspace }}/.cache/kb
        run: bash scripts/kb/refresh.sh
      - name: Open draft PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/kb data/leads/kb-enrich-candidates.json docs/knowledge/KB
          if git diff --cached --quiet; then echo "KB unchanged"; exit 0; fi
          b="kb/refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f scripts/ci/bot-commit-guard.sh ] && { bash scripts/ci/bot-commit-guard.sh || exit 1; }  # P3093
          git checkout -b "$b" && git commit -m "chore(kb): incremental KB refresh [skip ci]"
          git push -u origin "$b"
          gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$b" --title "KB refresh $(date -u +%F)" --body "Automated incremental KB refresh (facts + commit-pinned links only)."
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Weekly incremental refresh of the knowledge base from public device projects, delivered as one draft PR."; else s="Stopped early ($JOB_STATUS); the red step above says why. Weekly incremental refresh of the knowledge base from public device projects, delivered as one draft PR."; fi
          node scripts/lib/report-writer.js --title "kb-refresh" --summary "$s" --headers "item|value" --row "job|refresh" --row "result|$JOB_STATUS" --thanks "Koen Kanters and the zigbee-herdsman-converters contributors" --thanks "zigpy / ZHA, deCONZ, tuya-local, tinytuya and localtuya authors" >> "$GITHUB_STEP_SUMMARY" || true
