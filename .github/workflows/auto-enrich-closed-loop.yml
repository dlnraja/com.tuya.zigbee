# 🔄 Auto-Enrich Closed Loop (P69)
# Triggers: cron: 0 */4 * * * + workflow_dispatch | Secrets: GH_PAT,GMAIL_APP_PASSWORD,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_EMAIL,GMAIL_REFRESH_TOKEN,HOMEY_PAT,HOMEY_PAT_API
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: 🔄 Auto-Enrich Closed Loop (P69)

on:
  schedule:
    # Every 4 hours (00, 04, 08, 12, 16, 20 UTC). Coordinates with:
    # - 02:00 UTC: mega-crawl (full sweep)
    # - 03:30 UTC: recurrent-orchestrator
    # - 04:00 UTC: safe-sync-stable
    # - 04:15 UTC: blakadder-fetch
    # - 22:00 UTC Sunday: gmail diagnostics
    # - 30 3 *: nightly audit
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: 'Skip external crawling (faster dry-run)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no commits)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-enrich-loop
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB: "30"
  HOMEY_PUBLISH_SOURCE_MAX_MB: "30"
  HOMEY_ZIGBEE_MAX_TOTAL_COMBOS: "60000"
  HOMEY_ZIGBEE_MAX_DRIVER_COMBOS: "10000"

jobs:
  closed-loop:
    name: 🔄 Run Closed Loop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
      HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install deps
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline --no-audit || npm install --no-audit
          else
            echo "No package.json"
          fi

      # P55: restore scanner cache
      - name: 📥 Restore scanner caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/scanner-blobs/
            .cache/scraper-cache/
          key: auto-enrich-cache-${{ github.run_id }}
          restore-keys: |
            auto-enrich-cache-

      - name: 🔄 Run Closed Loop
        id: loop
        run: |
          ARGS=""
          if [ "${{ inputs.skip_crawl }}" = "true" ]; then ARGS="$ARGS --skip-crawl"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "## 🔄 Auto-Enrich Closed Loop (P99 CI)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node tools/ci/auto-enrich-closed-loop.js $ARGS 2>&1 | tee auto-enrich.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .github/state/auto-enrich/loop.json ]; then
            echo "### Summary JSON" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat .github/state/auto-enrich/loop.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🌐 Multi-source enrich orchestrator (P114)"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        env:
          FORUM_AUTO_POST: "0"
          REPLY_TOPICS: "140352"
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ ! -f tools/ci/multi-source-enrich-orchestrator.js ]; then
            echo "multi-source orchestrator missing — skip"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/ci/multi-source-enrich-orchestrator.js --skip-scan || true
          else
            # Known routes + sacred lots only (no blind Johan truncations)
            node tools/ci/multi-source-enrich-orchestrator.js --apply || true
          fi
          if [ -f .github/state/multi-source/enrich-report.json ]; then
            echo "### Multi-source enrich" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "const j=require('./.github/state/multi-source/enrich-report.json'); console.log(JSON.stringify({mode:j.mode,ok:j.ok,phases:j.phases.map(p=>({name:p.name,ok:p.ok}))},null,2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🔍 Infer-enrich from incomplete"
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/ci/infer-enrich-from-incomplete.js --dry-run || true
          else
            node tools/ci/infer-enrich-from-incomplete.js --dry-run || true
            node tools/ci/infer-enrich-from-incomplete.js --apply || true
          fi

      # Defense in depth — also run outside the loop script so a partial
      # loop still leaves manifests CI-safe before any follow-up jobs.
      - name: "🔤 Ensure case variants (P99)"
        if: always() && inputs.dry_run != true
        run: node tools/ci/ensure-case-variants.js --apply

      - name: "🔁 Re-inject manual fixes"
        if: always() && inputs.dry_run != true
        run: node tools/ci/re-inject-manual-fixes.js

      - name: "🛡️ Anti-bot regression gate"
        if: always()
        run: node tools/ci/anti-bot-regression-gate.js

      - name: "🛡️ Regression lessons gate (MUST-KEEP fatals)"
        if: always()
        run: node tools/ci/regression-lessons-gate.js

      # READ-ONLY scan of cloud Smart Life thread (never posts/replies)
      - name: "Forum 146735 READ-ONLY silent scan"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ ! -f tools/ci/forum-fetch-146735.js ]; then
            echo "forum-fetch-146735.js missing — skip"
            exit 0
          fi
          node tools/ci/forum-fetch-146735.js || echo "146735 fetch failed (non-blocking)"
          node tools/ci/apply-forum-146735-silent.js || echo "146735 apply dry-run failed (non-blocking)"

      # READ-ONLY multi-topic (140352+146735+26439+89271+43287+157628). Never replies.
      - name: "Forum silent multi-topic scan (P108 / T157628)"
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REPLY_TOPICS: "140352"
          FORUM_AUTO_POST: "0"
        run: |
          if [ ! -f tools/ci/forum-silent-multi-scan.js ]; then
            echo "forum-silent-multi-scan.js missing — skip"
            exit 0
          fi
          node tools/ci/forum-silent-multi-scan.js --max=40 || echo "silent multi-scan failed (non-blocking)"
          node tools/ci/forum-ai-paste-gate.js --scan-defaults || echo "ai-paste gate warn"
          if [ -f tools/ci/apply-forum-silent-multi.js ]; then
            node tools/ci/apply-forum-silent-multi.js || echo "silent multi apply dry-run warn"
          fi
          if [ -f .github/state/forum/multi-silent-digest.json ]; then
            echo "Silent multi-scan digest written (FORUM_AUTO_POST=0)"
            node -e "const d=require('./.github/state/forum/multi-silent-digest.json'); console.log(JSON.stringify(d.totals))"
          fi

      # READ-ONLY extended satellite thread FP scan (never posts)
      - name: "Forum threads scan (READ-ONLY FP diff)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FORUM_AUTO_POST: "0"
        run: |
          if [ ! -f tools/ci/forum-threads-scan.js ]; then
            echo "forum-threads-scan.js missing — skip"
            exit 0
          fi
          node tools/ci/forum-threads-scan.js || echo "forum-threads-scan failed (non-blocking)"

      - name: "📧 Diag protocol gate (crash + sacred-couple cross-ref + dry apply)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm run check:diag-protocol || true
          node .github/scripts/privacy-redactor.js \
            .github/state/gmail-crash-patterns.json \
            .github/state/gmail-unique-fps.json \
            .github/state/gmail-fps-crossref-v2.json \
            .github/state/sacred-couple-dry-gate.json || true

      - name: "🕷️ Light Z2M/ZHA sync (best-effort, OOM-safe)"
        if: always() && inputs.skip_crawl != true
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          if [ ! -f tools/ci/mega-crawler.js ]; then
            echo "mega-crawler missing — skip light sync"
            exit 0
          fi
          timeout 200 npm run sync:z2m-zha:light || echo "z2m/zha light sync skipped/failed (non-blocking)"

      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: auto-enrich-loop
          path: |
            .github/state/auto-enrich/
            .github/state/multi-source/
            .github/state/gmail-crash-patterns.json
            .github/state/gmail-fps-crossref-v2.json
            .github/state/sacred-couple-dry-gate.json
            auto-enrich.log
          if-no-files-found: warn
          retention-days: 14

      # Auto-PR if loop discovered new FPs
      - name: 🔀 Open PR if changes
        if: steps.loop.outputs.committed == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const loop = JSON.parse(fs.readFileSync('.github/state/auto-enrich/loop.json', 'utf8'));
            if (loop.errors.length > 0) {
              core.setFailed(`Auto-enrich loop completed with ${loop.errors.length} errors. See artifacts.`);
              return;
            }
            // No PR for scheduled runs - just push to master
            // safe-sync-stable handles the stable-v5 sync separately
            console.log('Loop completed. Changes committed to master.');
