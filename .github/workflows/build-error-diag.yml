# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Opens the Athom build page in a headless browser to read why a build failed (manual or daily).
# Ideas from (thank you): Athom's official Homey app GitHub Actions (athombv); the Homey developer docs on
#   build channels.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# 🔍 Build Error Diagnostic (Puppeteer)
# Triggers: cron: 17 2 * * * + workflow_dispatch | Secrets: HOMEY_EMAIL,HOMEY_PASSWORD
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: 🔍 Build Error Diagnostic (Puppeteer)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Specific build ID to diagnose (optional — defaults to latest failed)'
        required: false
        default: ''
  # Cron désactivé 2026-08-04 (audit no-op) : screenshots Puppeteer vers un
  # artifact jamais téléchargé, 0 action corrective ; la supervision des builds
  # Athom est déjà assurée toutes les 6h par auto-fix-and-publish.
  # schedule:
  #   # Run nightly at 02:17 UTC to capture the latest build error
  #   - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: build-error-diag
  cancel-in-progress: false

defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  diagnose:
    name: 🔍 Extract real build error from dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Install Puppeteer + deps
        run: npm install puppeteer homey-api --no-save

      - name: Run diagnostic v2 (API-first + Puppeteer fallback + HTML dump)
        env:
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          echo "## 🔍 Build Error Diagnostic v2" >> $GITHUB_STEP_SUMMARY
          node .github/scripts/build-error-diag-v2.js || true

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: build-error-diag
          path: |
            screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Print report (latest error)
        if: always()
        run: |
          echo "### 📋 Build Error Report" >> $GITHUB_STEP_SUMMARY
          if [ -f screenshots/build-error-report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat screenshots/build-error-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No report file produced — check screenshots artifact._" >> $GITHUB_STEP_SUMMARY
          fi
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Opens the Athom build page in a headless browser to read why a build failed (manual or daily)."; else s="Stopped early ($JOB_STATUS); the red step above says why. Opens the Athom build page in a headless browser to read why a build failed (manual or daily)."; fi
          node scripts/lib/report-writer.js --title "build-error-diag" --summary "$s" --headers "item|value" --row "job|diagnose" --row "result|$JOB_STATUS" --thanks "Athom's official Homey app GitHub Actions (athombv)" --thanks "the Homey developer docs on build channels" >> "$GITHUB_STEP_SUMMARY" || true
