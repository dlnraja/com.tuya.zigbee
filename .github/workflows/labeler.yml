# PR Labeler
# Triggers: pull_request_target | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: "PR Labeler"

# <!-- badges:start -->
# [![PR Labeler](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/labeler.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/labeler.yml)
# <!-- badges:end -->


on:
  # P2206-ALLOW-PRT: labels only — does NOT checkout PR head / untrusted code
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  label:
    name: "Auto-Label PR"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
