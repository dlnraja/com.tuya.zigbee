name: "🚀 Publish Stable to Test"

# <!-- badges:start -->
# [![🚀 Publish Stable to Test](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/publish-stable.yml/badge.svg)](https://github.com/dlnraja/com.tuya.zigbee/actions/workflows/publish-stable.yml)
# <!-- badges:end -->


concurrency:
  group: publish-stable-v5
  # P139 / P193: never kill mid Athom draft/promote (orphan builds + socket hang up).
  cancel-in-progress: false

on:
  push:
    branches:
      - stable-v5
  workflow_dispatch:
    inputs:
      force_test:
        description: 'Promote to Test even if master 9.0.x is soaking (overwrites shared App ID)'
        type: boolean
        default: false
      force_publish:
        description: 'Force Athom createBuild even if soft-expect would skip (P139 one-shot)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  # P2384: longer Athom API / draft wait (socket hang up mitigation)
  HOMEY_API_TIMEOUT_MS: "120000"
  HOMEY_BUILD_POLL_TIMEOUT_MS: "360000"
  HOMEY_DRAFT_WAIT_MS: "600000"
  HOMEY_HEALTHY_TEST_PATCH_LAG: "8"
  # v5.12.0: 431 drivers × assets still overshoots the 26 MB default.
  # v5.12.4 (P75.1): Bumped 45 → 50 MB to match master after .homeyignore
  # pruning reduces the source directory to ~40 MB. The gzipped tarball
  # is ~18 MB (well under Homey's 7-20 MB tar limit).
  HOMEY_PUBLISH_FINAL_MAX_MB: "50"
  HOMEY_PUBLISH_MAX_UNCOMPRESSED_MB: "50"
  HOMEY_PUBLISH_SOURCE_MAX_MB: "50"
  # v5.12.1 (P58.10): 2874 FPs (P19) × productId expand to 20,444 combos,
  # exceeding the default 20,000 limit. 30,000 gives headroom.
  # v5.12.1 (P59 sync): stable has 30,211 combos (more than master due to
  # driver differences over time). 35,000 covers stable with headroom.
  HOMEY_ZIGBEE_MAX_TOTAL_COMBOS: "17000"
  HOMEY_ZIGBEE_MAX_DRIVER_COMBOS: "2000"
  HOMEY_ZIGBEE_MAX_CASE_FORMS: "2"

jobs:
  # WHY(P2400): bare workflow_dispatch while push-publish already ran for this SHA
  # double-hits Athom (P139 orphan drafts). Skip unless force_publish=true.
  dispatch-dedupe:
    name: "Dispatch dedupe (P2400)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - name: Skip redundant workflow_dispatch
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "push/schedule — no dispatch dedupe"
            exit 0
          fi
          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "force_publish=true — allow dispatch"
            exit 0
          fi
          # Look for a successful push-triggered run of this workflow for the same tip SHA (last 2h)
          JSON=$(gh api "repos/$REPO/actions/workflows/publish-stable.yml/runs?event=push&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha==\"$SHA\" and .conclusion==\"success\" and .status==\"completed\")] | .[0] // empty" \
            || true)
          if [ -n "$JSON" ] && [ "$JSON" != "null" ]; then
            echo "P2400: tip SHA already published via push — skipping redundant workflow_dispatch"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::P2400 skipped duplicate Stable publish dispatch (push already succeeded for $SHA)"
            exit 0
          fi
          echo "No successful push publish for this SHA — continue dispatch"

  upstream-guard:
    name: "🛡️ Upstream Guard"
    needs: dispatch-dedupe
    if: needs.dispatch-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no upstream writes
        run: |
          if grep -rE "(push|create|POST).*JohanBendz" .github/workflows/ 2>/dev/null | grep -v upstream-guard.yml; then
            echo "::error::Workflow has potential upstream write"
            exit 1
          fi
          echo "✓ No upstream writes"

  pre-validation:
    name: "Pre-Validation"
    needs: upstream-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install
      - name: Crash regression guard - Homey timer context
        run: npm run check:timer-context
      - name: Regression lessons gate (MUST-KEEP fatals)
        run: node tools/ci/regression-lessons-gate.js
      - name: Google Assistant / Alexa voice-safety gate
        run: npm run check:voice
      - name: SDK3 Validation
        run: |
          SDK=$(node -p "require('./app.json').sdk || require('./app.json').sdkVersion")
          if [ "$SDK" != "3" ]; then
            echo "::error::Invalid SDK: $SDK (expected 3)"
            exit 1
          fi
          echo "SDK3 validated"
      - name: Dedupe driver flow cards (app.json + .homeycompose)
        run: node tools/ci/sync-appjson-flow-dedupe.js --apply
      - name: Validate App
        run: npx homey app validate --level publish
      - name: Sanitize generated manifest after validation
        run: node scripts/maintenance/sanitize-manifest.cjs app.json .homeybuild/app.json

  soak:
    name: "Shared App ID soak guard"
    needs: upstream-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.soak.outputs.skip }}
      reason: ${{ steps.soak.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: Shared App ID soak guard
        id: soak
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          STABLE_FORCE_TEST: ${{ github.event.inputs.force_test || 'false' }}
        run: node .github/scripts/refuse-stable-test-overwrite.js

  publish:
    name: "Publish to Draft"
    needs: [pre-validation, soak]
    if: needs.soak.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WHY(P2355): Homey build may bump patch in-job; promote must wait that version.
    outputs:
      uploaded_version: ${{ steps.uploaded_version.outputs.version }}
      app_id: ${{ steps.uploaded_version.outputs.app_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build App
        run: npx homey app build
      - name: Sanitize Built Manifest
        run: |
          node scripts/maintenance/fix-large-images.js
          node scripts/maintenance/optimize-build-images.cjs
          node scripts/maintenance/optimize-build-svgs.cjs
          node scripts/maintenance/sanitize-manifest.cjs .homeybuild/app.json
      # P94: Homey build regenerates app.json from .homeycompose; package.json can lag.
      # Align package.json (+ root app.json) to built version before prepare-publish guard.
      - name: Sync versions after Homey build
        run: |
          node -e '
            const fs = require("fs");
            const built = JSON.parse(fs.readFileSync(".homeybuild/app.json", "utf8"));
            const v = built.version;
            for (const f of ["package.json", "app.json", ".homeybuild/package.json"]) {
              if (!fs.existsSync(f)) { console.log("skip missing", f); continue; }
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              if (j.version !== v) {
                console.log("Align " + f + ": " + j.version + " -> " + v);
                j.version = v;
                fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              } else {
                console.log("OK " + f + "=" + v);
              }
            }
          '
      # WHY(P2355): export post-build version so promote job does not use stale checkout app.json
      - name: Export uploaded version
        id: uploaded_version
        run: |
          V=$(node -p "require('./.homeybuild/app.json').version || require('./app.json').version")
          AID=$(node -p "require('./app.json').id")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app_id=$AID" >> "$GITHUB_OUTPUT"
          echo "P2355 uploaded_version=$V app_id=$AID"
      - name: Ensure changelog for current and next patch
        env:
          HOMEY_CHANGELOG: 'Reliability improvements.'
        run: node .github/scripts/ensure-next-changelog.js
      - name: Prepare Publish Directory
        run: npm run prepare-publish
      - name: Publish to Draft
        id: publish
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true && '1' || '0' }}
        run: |
          PUBLISH_DIR="${HOMEY_PUBLISH_DIR:-$(node -p "require('path').join(require('os').tmpdir(), 'homey-publish-temp')")}"
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "::error::Prepared publish directory is missing: $PUBLISH_DIR"
            echo "::error::Hint: prepare-publish must run in the same job; check HOMEY_PUBLISH_DIR / .homeybuild"
            exit 1
          fi
          echo "Using PUBLISH_DIR=$PUBLISH_DIR"
          cd "$PUBLISH_DIR"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          else
            npm install --omit=dev --ignore-scripts --no-audit --no-fund
          fi
          run_homey_cli_publish() {
            if [ -x "$GITHUB_WORKSPACE/node_modules/.bin/homey" ]; then
              HOMEY_HEADLESS=1 HOMEY_PAT="$HOMEY_PAT" "$GITHUB_WORKSPACE/node_modules/.bin/homey" app publish --path "$PUBLISH_DIR"
            else
              HOMEY_HEADLESS=1 HOMEY_PAT="$HOMEY_PAT" npx homey app publish --path "$PUBLISH_DIR"
            fi
          }
          set +e
          if [ "${HOMEY_FORCE_PUBLISH:-0}" = "1" ]; then
            echo "::notice::HOMEY_FORCE_PUBLISH=1 — one-shot direct-api-publish --force (P139 override)"
            publish_output=$(HOMEY_PAT="$HOMEY_PAT" HOMEY_API_TIMEOUT_MS="${HOMEY_API_TIMEOUT_MS:-120000}" HOMEY_BUILD_POLL_TIMEOUT_MS="${HOMEY_BUILD_POLL_TIMEOUT_MS:-360000}" node "$GITHUB_WORKSPACE/scripts/direct-api-publish.js" --path "$PUBLISH_DIR" --channel test --force 2>&1)
            publish_status=$?
          else
            publish_output=$(run_homey_cli_publish 2>&1)
            publish_status=$?
            if [ "$publish_status" -ne 0 ] && printf '%s\n' "$publish_output" | grep -Eiq 'Timeout after [0-9]+ms|fetch failed|ETIMEDOUT|ECONNRESET|ECONNABORTED|socket hang up|too many requests|\b429\b|processing_failed'; then
              echo "::warning::Homey CLI publish hit a transient Athom hang; retrying via direct Athom Apps API with extended timeouts."
              fallback_output=$(HOMEY_PAT="$HOMEY_PAT" HOMEY_API_TIMEOUT_MS="${HOMEY_API_TIMEOUT_MS:-120000}" HOMEY_BUILD_POLL_TIMEOUT_MS="${HOMEY_BUILD_POLL_TIMEOUT_MS:-360000}" node "$GITHUB_WORKSPACE/scripts/direct-api-publish.js" --path "$PUBLISH_DIR" --channel test 2>&1)
              fallback_status=$?
              publish_output="$(printf '%s\n%s' "$publish_output" "$fallback_output")"
              publish_status=$fallback_status
            fi
          fi
          set -e
          printf '%s\n' "$publish_output"
          if [ "$publish_status" -ne 0 ]; then
            if printf '%s\n' "$publish_output" | grep -Eiq 'already been published|currently in review'; then
              echo "::warning::Homey reports this version is already published or in review; continuing so test promotion can proceed."
            else
              exit "$publish_status"
            fi
          fi
          echo "Draft publish completed"

  soak-summary:
    name: "Soak decision"
    needs: [soak, pre-validation]
    if: always() && needs.soak.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record soak decision
        run: |
          echo "## Shared App ID soak" >> "$GITHUB_STEP_SUMMARY"
          echo "skip=${{ needs.soak.outputs.skip }} reason=${{ needs.soak.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.soak.outputs.skip }}" = "true" ]; then
            echo "Draft upload skipped so 5.12.x cannot overwrite soaking 9.0 Test." >> "$GITHUB_STEP_SUMMARY"
          fi

  promote:
    name: "Promote to Test"
    needs: [pre-validation, publish, soak]
    # Skip entirely while master 9.0.x occupies the shared Test slot.
    if: needs.soak.outputs.skip != 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit || npm install
      - name: Shared App ID soak guard
        id: soak
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          STABLE_FORCE_TEST: ${{ github.event.inputs.force_test || 'false' }}
        run: node .github/scripts/refuse-stable-test-overwrite.js
      - name: Wait for Athom draft processing
        if: steps.soak.outputs.skip != 'true'
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          APP_ID: ${{ needs.publish.outputs.app_id }}
          HOMEY_EXPECTED_VERSION: ${{ needs.publish.outputs.uploaded_version }}
          # WHY(P2416): Athom processing_failed must soft-continue (P139) — promote/verify decide.
          HOMEY_DRAFT_SOFT_EXPECT: '1'
          HOMEY_HEALTHY_TEST_PATCH_LAG: '32'
        run: node .github/scripts/wait-athom-draft-ready.js
      - name: Install Puppeteer
        if: steps.soak.outputs.skip != 'true'
        continue-on-error: true
        run: npm install puppeteer --no-save
      - name: Promote via Browser (Puppeteer)
        id: promote_puppeteer
        if: steps.soak.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          APP_ID: ${{ needs.publish.outputs.app_id }}
          TARGET_APP_ID: ${{ needs.publish.outputs.app_id }}
          HOMEY_EXPECTED_VERSION: ${{ needs.publish.outputs.uploaded_version }}
        run: node .github/scripts/auto-promote-puppeteer.js
      - name: Promote via API (PAT)
        id: promote_api
        if: steps.soak.outputs.skip != 'true' && steps.promote_puppeteer.outcome != 'success'
        continue-on-error: true
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          APP_ID: ${{ needs.publish.outputs.app_id }}
          HOMEY_EXPECTED_VERSION: ${{ needs.publish.outputs.uploaded_version }}
        run: node .github/scripts/auto-publish-draft.js
      - name: Verify draft promotion result
        id: verify_test
        if: steps.soak.outputs.skip != 'true'
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_API_TIMEOUT_MS: "120000"
          APP_ID: ${{ needs.publish.outputs.app_id }}
          HOMEY_EXPECTED_VERSION: ${{ needs.publish.outputs.uploaded_version }}
        run: |
          if [ "${{ steps.promote_puppeteer.outcome }}" != "success" ] && \
             [ "${{ steps.promote_api.outcome }}" != "success" ]; then
            echo "::warning::All stable draft-to-test promotion tiers returned non-success; verifying actual Homey channel state before failing."
          fi
          # P2325 BOTH: soft-continue when Athom hang + healthy .stable Test
          node .github/scripts/verify-test-version.js
          echo "### P2325 verify soft-continue" >> "$GITHUB_STEP_SUMMARY"
          echo "Healthy Test + transient hang → exit 0 (no Stable republish spam / P139)." >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: |
          VER=$(node -p "require('./app.json').version" 2>/dev/null || echo "?")
          APP_ID=$(node -p "require('./app.json').id" 2>/dev/null || echo "?")
          echo "## Stable Publish" >> $GITHUB_STEP_SUMMARY
          echo "v$VER | APP_ID: $APP_ID" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **APP_ID warning**: master and stable share \`com.dlnraja.tuya.zigbee\`. Promoting stable to Test overwrites the master Test slot (and vice versa). Prefer Live for production stable, or republish master last if Test must stay on 9.x." >> $GITHUB_STEP_SUMMARY
          echo "Soak guard skip=${{ steps.soak.outputs.skip }} reason=${{ steps.soak.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
      - name: Full diagnostics sweep - sanitized
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_DIAG_AI_MAX: "0"
          GMAIL_DIAG_REQUIRE_ACCESS: "false"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "true"
        run: |
          run_diag() {
            local seconds="$1"
            shift
            local label="$*"
            echo "::group::${label}"
            if timeout --kill-after=30s "${seconds}s" "$@"; then
              echo "[diag] completed: ${label}"
            else
              local code=$?
              echo "::warning title=Diagnostics command timed out or failed::${label} exited with code ${code}"
            fi
            echo "::endgroup::"
          }

          run_diag 180 node .github/scripts/fetch-gmail-diagnostics.js
          run_diag 90 node scripts/automation/dashboard-monitor.js --latest --json
          run_diag 120 node .github/scripts/homey-device-diagnostics.js
          run_diag 120 node .github/scripts/collect-diagnostics.js
          run_diag 60 node .github/scripts/privacy-redactor.js diagnostics .github/state/diagnostics-report.json .github/state/diagnostics-crossref.yml .github/state/homey-device-report.json .github/state/dashboard-monitor-report.json
          run_diag 60 node scripts/ci/diagnostic-history-gate.js --json
