# Continuous Flow — Consolidated daily workflow
#
# Replaces 10+ scheduled workflows:
#   - daily-maintenance.yml
#   - enrich-drivers.yml
#   - weekly-external-sync.yml (weekly)
#   - weekly-fingerprint-sync.yml (weekly)
#   - johan-sdk3-sync.yml (weekly)
#   - bilat-fp-sync.yml
#   - fetch-diags.yml
#   - upstream-auto-triage.yml (weekly)
#   - test-api-keys.yml
#   - sync-changelog-readme.yml (changelog → README sync, reintroduced 2026-07-29)
#   - shadow-policy-check.yml (only on push)
#
# Resource guard:
#   - Manual dispatch only (schedule removed 2026-10-11, see DECISION below)
#   - Concurrency: cancel-in-progress on new run
#   - Timeout: 30 min
#   - Manual dispatch for apply mode
#   - DRY_RUN by default
# DECISION(P2797c/P2802): push trigger removed (wasted ~30 dry-run runs / 48 h). Do not re-add push.
# DECISION(2026-10-11): daily schedule removed too — manual workflow_dispatch only.
#   The scheduled run was always DRY_RUN and its commit step is apply-only, so nothing was ever kept.
#   Run 38041096392 (2026-10-10) showed the enrichers are hollow on a fresh CI checkout: their
#   inputs (.github/state z2m/ZHA/johan dumps, multi-device plan) are gitignored local state, so
#   variant finder analysed 0 mfrs, bidirectional enricher applied 0, multi-device exited 1 on a
#   missing plan, enrich-sacred-couples crashed on a hard-coded local path, and shadow-mode re-read
#   stale local docs. The only real signal (homey app validate --level publish + family/publish
#   gates) already runs on every master push in unified-ci. Apply mode stays available by hand.
#
# Outputs:
#   - .github/state/*.json reports (artifact; committed only in mode=apply via safe-auto-commit)
#   - Workflow run summary

name: continuous-flow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (dry-run, apply, metrics)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - metrics
      max_mfrs:
        description: 'Maximum new mfrs to apply (safety)'
        required: false
        default: '3'
        type: string
  # WHY(P2797c): push trigger removed. On push the job always ran in dry-run mode (DRY_RUN unless
  # mode=apply) and its commit step is apply-only, so ~30 runs / 48 h (~6 min each) produced nothing;
  # the same gates already run in syntax-check / code-quality / unified-ci on every push.

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# Cancel previous runs to save resources
concurrency:
  group: continuous-flow
  cancel-in-progress: true

# 30 min hard timeout
defaults:
  run:
    shell: bash
# P2542 forfait / local-first (auto-injected)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # WHY(ci-consolidation 2026-10): was contents: read, so the manual mode=apply push could never succeed.
      contents: write
      issues: write
      pull-requests: write
    env:
      DRY_RUN: ${{ github.event.inputs.mode != 'apply' && 'true' || 'false' }}
      MAX_MFRS: ${{ github.event.inputs.max_mfrs || '3' }}
      NODE_VERSION: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      # P73.5: Inlined the upstream-guard check (was a reusable workflow,
      # but GHA kept treating the file as a local action and failing with
      # 'Can't find action.yml'. Inline check is simpler and avoids the bug.)
      - name: Upstream guard (no writes to Johan)
        id: guard
        run: |
          # dry-run and apply modes only write to dlnraja/com.tuya.zigbee
          # (this repo). For continuous-flow specifically, we never
          # write to upstream because the workflow is DRY_RUN by default
          # and the only 'apply' mode also targets our fork. So this is
          # a no-op safety check that always passes.
          echo "is_safe=true" >> $GITHUB_OUTPUT
          echo "✓ Continuous-flow targets dlnraja/com.tuya.zigbee (safe)"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Install deps (cached)
        run: npm ci --prefer-offline --no-audit
        if: hashFiles('package-lock.json') != ''

      - name: Install deps (no lock)
        run: npm install --prefer-offline --no-audit --no-save
        if: hashFiles('package-lock.json') == ''

      - name: Audit Johan references
        id: audit-johan
        run: node tools/ci/audit-johan-references.js
        continue-on-error: true

      - name: Run shadow-mode v2
        id: shadow
        run: node tools/shadow-mode/shadow-mode-v2.js --all
        continue-on-error: true

      - name: Run bidirectional enricher
        id: enricher
        run: node tools/ci/bidirectional-enricher.js
        continue-on-error: true

      - name: Run mfs-db enricher
        id: mfs
        run: node tools/ci/mfs-db-enricher.js

      - name: P24.9 — Sacred Couple auto-enrichment
        id: sacred-couples
        run: node tools/ci/enrich-sacred-couples.js
        continue-on-error: true

      - name: Run intelligent variant finder
        id: variants
        run: node tools/ci/intelligent-variant-finder.js
        continue-on-error: true

      - name: Detect multi-device mfrs
        id: multi
        run: node tools/ci/detect-multi-device-mfrs.js
        continue-on-error: true

      # Reintroduced 2026-07-29: function of deleted sync-changelog-readme.yml
      # (daily changelog → README "Latest Updates" sync; script still present,
      # committed back in apply mode via the "Commit state" step below).
      - name: Sync changelog to README
        id: changelog-sync
        run: node scripts/automation/sync-changelog-readme.js
        continue-on-error: true

      - name: Validate app (AggregateError + process errors check)
        id: validate
        run: |
          set +e
          OUTPUT=$(npx homey app validate --level publish 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT" | tail -50
          if [ $EXIT -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "AggregateError"; then
              echo "::error::AggregateError detected — run tools/ci/fix-empty-mfr-aggregateerror.js"
            fi
            if echo "$OUTPUT" | grep -qE "TypeError:|RangeError:|SyntaxError:"; then
              echo "::error::Process error detected in master"
            fi
            exit $EXIT
          fi
        continue-on-error: true

      - name: Build summary
        id: summary
        if: always()
        run: |
          {
            echo "## 🌒 Continuous Flow — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Step | Status |"
            echo "| --- | --- |"
            echo "| shadow-mode | ${{ steps.shadow.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| enricher | ${{ steps.enricher.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| mfs | ${{ steps.mfs.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| variants | ${{ steps.variants.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| multi | ${{ steps.multi.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| changelog-sync | ${{ steps.changelog-sync.outcome == 'success' && '✅' || '⚠️' }} |"
            echo "| validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} |"
            echo ""
            echo "**Mode**: ${{ github.event.inputs.mode || 'schedule' }}"
            echo "**DRY_RUN**: ${{ env.DRY_RUN }}"
            echo "**MAX_MFRS**: ${{ env.MAX_MFRS }}"
            echo "**Run ID**: ${{ github.run_id }}"
            echo "**Trigger**: ${{ github.event_name }}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: continuous-flow-reports-${{ github.run_id }}
          path: |
            .github/state/forum-integration-report.json
            .github/state/johan-integration-report.json
            .github/state/bidirectional-enrichment-report.json
            .github/state/mfs-enrichment-report.json
            .github/state/intelligent-variants.json
            .github/state/multi-device-detection.json
            tools/shadow-mode/state.json
          if-no-files-found: ignore
          retention-days: 14

      - name: "🛡️ Rules gates (shared, core; anti-bot strip after enrich)"
        if: always()
        uses: ./.github/actions/rules-gates
        with:
          strip: 'true'

      - name: "🛡️ Family + publish path gates (soft)"
        if: always()
        continue-on-error: true
        run: |
          npm run check:p244x || echo "P244x soft warn"
          npm run check:p246x || echo "P246x soft warn"
          npm run check:p248x || echo "P248x soft warn"
          npm run check:p249x || echo "P249x soft warn"
          npm run check:p257x || echo "P257x soft warn"
          npm run check:p283x || echo "P283x soft warn"
          npm run check:p2580 || echo "P2580 soft warn"
          npm run check:publish || echo "check:publish soft warn"

      - name: Commit state (apply only)
        if: github.event.inputs.mode == 'apply' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Gated + capped + loop-guarded commit (scripts/ci/safe-auto-commit.js): local gates on the
          # staged files, max 1 auto-commit/day, rebase-retry push, refusal → single comment on #557.
          node scripts/ci/safe-auto-commit.js --id=continuous-flow --branch="${GITHUB_REF_NAME}" \
            --message="continuous-flow: apply enrichments (run ${{ github.run_id }})" --paths="."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Continuous flow failed. Check the workflow run for details."
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
