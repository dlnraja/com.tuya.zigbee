# What it does: Plans dependency and data updates; schedule off, manual only.
# Ideas from (thank you): Renovate and Dependabot for the merge-when-green pattern; the actions/stale and
#   actions/labeler maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# 🧠 Smart Update Orchestrator
# Triggers: cron: 30 1 * * * + workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: 🧠 Smart Update Orchestrator

on:
  # Cron désactivé 2026-08-04 (audit no-op) : en schedule, le plan est calculé
  # puis jeté (résumé de step uniquement, contents: read, aucun commit ni
  # déclenchement — le trigger mega-crawl n'existe qu'en workflow_dispatch).
  # schedule:
  #   # Daily 01:30 UTC, after knowledge-graph runs but before mega-crawl
  #   - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger mega-crawl with skip flags for fresh sources'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Just print the plan, do not trigger anything'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
defaults:
  run:
    shell: bash


concurrency:
  group: smart-update
  cancel-in-progress: true
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  plan:
    name: 📋 Compute update plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This job ran node on the runner's default toolchain with no dependencies
      # installed, so any require() of a package would have thrown.
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit || npm install

      - name: 🧠 Compute plan
        id: plan
        run: |
          echo "## 🧠 Smart Update Plan" >> $GITHUB_STEP_SUMMARY
          node tools/ci/smart-update-orchestrator.js >> $GITHUB_STEP_SUMMARY

      - name: 🪙 Token sanity check
        run: |
          echo "## 🪙 Token Sanity" >> $GITHUB_STEP_SUMMARY
          node tools/ci/token-sanity-check.js >> $GITHUB_STEP_SUMMARY

      - name: 🔄 Trigger mega-crawl if requested
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/ci/smart-update-orchestrator.js --trigger --silent
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Plans dependency and data updates; schedule off, manual only."; else s="Stopped early ($JOB_STATUS); the red step above says why. Plans dependency and data updates; schedule off, manual only."; fi
          node scripts/lib/report-writer.js --title "smart-update" --summary "$s" --headers "item|value" --row "job|plan" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" >> "$GITHUB_STEP_SUMMARY" || true
