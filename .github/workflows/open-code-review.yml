# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Twice a week: deterministic file selection and Homey rules for review; skipped when nothing
#   relevant changed.
# Ideas from (thank you): GitHub Actions docs; rhysd (actionlint); the Athom homey CLI docs for the validate
#   levels; Alibaba's Open Code Review project for the review flow idea.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# P2582 / P2592 — Alibaba Open Code Review (Homey Universal Tuya)
# WHY: free deterministic file selection + Homey rules; forfait → delegate only (no OCR LLM).
# Intelligent cron: skip when no drivers/lib/workflows/tools/ci changes.
# Soft-hooks: code-quality, project-resilience, recurrent-orchestrator, auto-enrich, forum-poll.

name: Open Code Review

on:
  schedule:
    # Mon + Thu 05:50 UTC — after project-resilience 05:20; before bot-triage herd
    - cron: '50 5 * * 1,4'
  pull_request:
    paths:
      - 'drivers/**'
      - 'lib/**'
      - '.github/workflows/**'
      - 'tools/ci/**'
      - '.opencodereview/**'
      - 'config/architecture/open-code-review-ssot.json'
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'git from ref (default HEAD~40)'
        required: false
        default: 'HEAD~40'
      to_ref:
        description: 'git to ref'
        required: false
        default: 'HEAD'
      force:
        description: 'Run even if no interesting path changes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      full_llm_review:
        description: 'Run ocr review with LLM if OCR_LLM_AUTH_TOKEN set (default false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_call:
    inputs:
      from_ref:
        required: false
        type: string
        default: 'HEAD~40'
      to_ref:
        required: false
        type: string
        default: 'HEAD'
      force:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-code-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  ocr-delegate:
    name: OCR intelligent (forfait-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_FORCE_LOCAL: 'true'
      AI_ALLOW_REMOTE: 'false'
      AI_PLAN_MODE: forfait
      AI_ALLOW_PAID: 'false'
      OCR_INSTALL: '1'
      OCR_FROM: ${{ inputs.from_ref || github.event.inputs.from_ref || 'HEAD~40' }}
      OCR_TO: ${{ inputs.to_ref || github.event.inputs.to_ref || 'HEAD' }}
      OCR_FORCE: ${{ (inputs.force == true || github.event.inputs.force == 'true') && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Contre quoi gate P2582
        run: npm run check:p2582

      - name: Install Open Code Review CLI (free)
        run: npm install -g @alibaba-group/open-code-review

      - name: Intelligent OCR delegate preview
        run: node tools/ci/ocr-intelligent-cron.js

      - name: Optional full LLM review
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_llm_review == 'true' }}
        continue-on-error: true
        env:
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_BASE_URL: ${{ vars.OCR_LLM_BASE_URL }}
        run: |
          if [ -z "${OCR_LLM_AUTH_TOKEN:-}" ]; then
            echo "OCR_LLM_AUTH_TOKEN unset — skip full review (forfait default)"
            exit 0
          fi
          mkdir -p reports
          ocr review --from "${OCR_FROM}" --to "${OCR_TO}" \
            --rule .opencodereview/rule.json \
            --format json --output reports/ocr-review.json || true

      - name: Upload OCR artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: ocr-intelligent-${{ github.run_id }}
          path: |
            reports/ocr-*.json
            reports/ocr-intelligent-*/**
          if-no-files-found: warn
          retention-days: 14
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Twice a week: deterministic file selection and Homey rules for review; skipped when nothing relevant changed."; else s="Stopped early ($JOB_STATUS); the red step above says why. Twice a week: deterministic file selection and Homey rules for review; skipped when nothing relevant changed."; fi
          node scripts/lib/report-writer.js --title "open-code-review" --summary "$s" --headers "item|value" --row "job|ocr-delegate" --row "result|$JOB_STATUS" --thanks "GitHub Actions docs" --thanks "rhysd (actionlint)" --thanks "Alibaba's Open Code Review project for the review flow idea" >> "$GITHUB_STEP_SUMMARY" || true
