# P2582 — Alibaba Open Code Review (Homey Universal Tuya)
# WHY: deterministic review file selection + Homey rules; forfait → delegate only (no OCR LLM by default).
# MASTER_ONLY tooling. workflow_dispatch — never cron spam.

name: Open Code Review

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'git from ref (default HEAD~30)'
        required: false
        default: 'HEAD~30'
      to_ref:
        description: 'git to ref'
        required: false
        default: 'HEAD'
      full_llm_review:
        description: 'Run ocr review with LLM if OCR_LLM_AUTH_TOKEN set (default false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: open-code-review-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ocr-delegate:
    name: OCR delegate preview (forfait-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_FORCE_LOCAL: 'true'
      AI_ALLOW_REMOTE: 'false'
      AI_PLAN_MODE: forfait
      AI_ALLOW_PAID: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 40

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Open Code Review CLI
        run: npm install -g @alibaba-group/open-code-review

      - name: Contre quoi gate P2582
        run: npm run check:p2582

      - name: Delegate preview JSON
        run: |
          mkdir -p reports
          FROM_REF='${{ inputs.from_ref }}'
          TO_REF='${{ inputs.to_ref }}'
          ocr delegate preview --from "$FROM_REF" --to "$TO_REF" --format json \
            --rule .opencodereview/rule.json \
            > reports/ocr-delegate-preview.json || true
          test -s reports/ocr-delegate-preview.json
          node -e "const p=require('./reports/ocr-delegate-preview.json'); console.log('reviewable', p.reviewable_count, 'excluded', p.excluded_count);"

      - name: Optional full LLM review
        if: ${{ inputs.full_llm_review == 'true' }}
        continue-on-error: true
        env:
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_BASE_URL: ${{ vars.OCR_LLM_BASE_URL }}
        run: |
          if [ -z "${OCR_LLM_AUTH_TOKEN:-}" ]; then
            echo "OCR_LLM_AUTH_TOKEN unset — skip full review (forfait default)"
            exit 0
          fi
          ocr review --from '${{ inputs.from_ref }}' --to '${{ inputs.to_ref }}' \
            --rule .opencodereview/rule.json \
            --format json --output reports/ocr-review.json || true

      - name: Upload OCR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr-delegate-${{ github.run_id }}
          path: reports/ocr-*.json
          if-no-files-found: warn
          retention-days: 14
