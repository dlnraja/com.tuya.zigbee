# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Collects one day of repo, forum and crash activity into a private report. The schedule is off;
#   the orchestrator covers it.
# Ideas from (thank you): Renovate and Dependabot for the merge-when-green pattern; the actions/stale and
#   actions/labeler maintainers.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Activity Monitor (P30)
# Triggers: cron: 0 4 * * * + workflow_dispatch | Secrets: GITHUB_TOKEN only
# Doc header added 2026-07-29 (workflows genealogy enrichment).

defaults:
  run:
    shell: bash

name: Activity Monitor (P30)

# P30 — Daily cron that fetches all GH activity + forum + local crashes.
# Generates a snapshot for analysis and commits the cache.

on:
  # Cron désactivé 2026-08-04 (audit no-op) : sous-ensemble strict du
  # recurrent-orchestrator (03:30 — étapes 4, 7, 8 : fetch-all-activity,
  # temporal-monitor, session-start). 0 commit, artifacts jamais téléchargés.
  # Reste lançable via workflow_dispatch.
  # schedule:
  #   # Daily at 04:00 UTC (after shadow-mode at 03:00)
  #   - cron: '0 4 * * *'
  workflow_dispatch:

# Least privilege: push of the activity snapshot + read-only GH API scans
permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: activity-monitor
  cancel-in-progress: false
# P2562 forfait + local-smart-learn (all workflows)
env:
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  fetch-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Restore activity state cache
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .github/state/activity-snapshot.json
            .github/state/temporal-monitor-state.json
            .github/state/temporal-monitor-report.json
            .github/state/activity-cache.json
          key: activity-monitor-state-${{ github.run_id }}
          restore-keys: |
            activity-monitor-state-

      - name: Run Activity Fetcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/ci/fetch-all-activity.js

      - name: Run Temporal Monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/ci/temporal-monitor.js

      - name: Run Session-Start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/ci/session-start.js

      - name: Upload Activity Snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: activity-snapshot
          path: |
            .github/state/activity-snapshot.json
            .github/state/temporal-monitor-report.json
            .github/state/activity-cache.json
          retention-days: 30

      - name: Print Summary
        run: |
          if [ -f .github/state/activity-snapshot.json ]; then
            echo "## 📊 Activity Snapshot Summary" >> $GITHUB_STEP_SUMMARY
            GH_OPENS=$(node -e "const j=require('./.github/state/activity-snapshot.json'); console.log(j.github?.openIssues?.length || 0)" 2>/dev/null || echo 0)
            FORUM=$(node -e "const j=require('./.github/state/activity-snapshot.json'); console.log(j.forum?.details?.length || 0)" 2>/dev/null || echo 0)
            echo "- Open GH issues: $GH_OPENS" >> $GITHUB_STEP_SUMMARY
            echo "- Forum topics with full posts: $FORUM" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f .github/state/temporal-monitor-report.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🔍 Temporal Monitor" >> $GITHUB_STEP_SUMMARY
            FIXES=$(node -e "const j=require('./.github/state/temporal-monitor-report.json'); console.log(j.newFixesAvailable || 0)" 2>/dev/null || echo 0)
            INVESTIGATE=$(node -e "const j=require('./.github/state/temporal-monitor-report.json'); console.log(j.needInvestigation || 0)" 2>/dev/null || echo 0)
            echo "- Fixes available: $FIXES" >> $GITHUB_STEP_SUMMARY
            echo "- Need investigation: $INVESTIGATE" >> $GITHUB_STEP_SUMMARY
          fi
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Collects one day of repo, forum and crash activity into a private report. The schedule is off; the orchestrator covers it."; else s="Stopped early ($JOB_STATUS); the red step above says why. Collects one day of repo, forum and crash activity into a private report. The schedule is off; the orchestrator covers it."; fi
          node scripts/lib/report-writer.js --title "activity-monitor" --summary "$s" --headers "item|value" --row "job|fetch-activity" --row "result|$JOB_STATUS" --thanks "Renovate and Dependabot for the merge-when-green pattern" --thanks "the actions/stale and actions/labeler maintainers" >> "$GITHUB_STEP_SUMMARY" || true

      # State persists via the cache step above (security policy: state files
      # must never be committed to git — see security-scanner).
