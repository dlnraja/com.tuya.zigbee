# Fetch Homey Diagnostics
# Triggers: cron: 25 */6 * * * + workflow_dispatch | Secrets: GMAIL_APP_PASSWORD,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_EMAIL,GMAIL_REFRESH_TOKEN
# Doc header added 2026-07-29 (workflows genealogy enrichment).

name: Fetch Homey Diagnostics

on:
  schedule:
    - cron: '25 */6 * * *' # Run every 6 hours
  workflow_dispatch:
    inputs:
      all_history:
        description: "Fetch historical diagnostics instead of the rolling window"
        type: boolean
        default: false
        required: false
      since:
        description: "Optional start date for IMAP search, for example 2019-01-01"
        required: false
      until:
        description: "Optional exclusive end date for IMAP search, for example 2024-01-01"
        required: false
      max_results:
        description: "Maximum matching emails to fetch per IMAP window"
        default: "500"
        required: false
      max_total_results:
        description: "Maximum matching emails to keep across all IMAP windows"
        default: "5000"
        required: false
      chunk_days:
        description: "Split historical IMAP fetch into N-day windows; 0 disables chunking"
        default: "0"
        required: false
      reprocess:
        description: "Ignore processed state and rebuild the diagnostic chronology"
        type: boolean
        default: false
        required: false
      require_access:
        description: "Fail the workflow when Gmail IMAP and OAuth diagnostics access are both unavailable"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-diags
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AI_PLAN_MODE: forfait
  AI_ALLOW_PAID: 'false'
  AI_GLOBAL_DAILY_CAP: '400'
  AI_SOFT_STOP_PERCENT: '85'
  GMAIL_DIAG_AI_MAX: '0'
  FORUM_AUTO_POST: '0'
  SHADOW_FORUM: '1'

jobs:
  fetch-diags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit || npm install

      - name: Restore intel scraper cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/scraper-cache/
            .cache/scanner-blobs/
            .cache/scanners/
          key: ${{ runner.os }}-intel-cache-${{ hashFiles('package-lock.json') }}-${{ github.workflow }}
          restore-keys: |
            ${{ runner.os }}-intel-cache-

      - name: "P2227 AI forfait + security preflight"
        continue-on-error: true
        run: |
          node tools/ci/ai-plan-guard.js --preflight || true
          node tools/ci/ai-quota-report.js || true
          npm run security-scan || echo "security-scan warn"

      - name: "P2226 Gmail auth cascade probe (plugin IDE-only → IMAP → OAuth → local)"
        continue-on-error: true
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
        run: |
          node .github/scripts/gmail-auth-cascade.js --json | tee gmail-cascade.json || true
          echo "### Gmail auth cascade" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -n 40 gmail-cascade.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Note: Cursor Gmail plugin is IDE-only. CI uses GitHub secrets IMAP→OAuth→local." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Diagnostics from Gmail
        id: gmail_fetch
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          HOMEY_EMAIL: ${{ secrets.HOMEY_EMAIL }}
          HOMEY_PASSWORD: ${{ secrets.HOMEY_PASSWORD }}
          GMAIL_ALLOW_LOCAL_FALLBACK: "1"
          GMAIL_DIAG_ALL_HISTORY: ${{ github.event.inputs.all_history || 'false' }}
          GMAIL_DIAG_SINCE: ${{ github.event.inputs.since || '' }}
          GMAIL_DIAG_UNTIL: ${{ github.event.inputs.until || '' }}
          GMAIL_DIAG_MAX_RESULTS: ${{ github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_MAX_TOTAL_RESULTS: ${{ github.event.inputs.max_total_results || github.event.inputs.max_results || '100' }}
          GMAIL_DIAG_CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '0' }}
          GMAIL_DIAG_STATE_LIMIT: ${{ github.event.inputs.max_total_results || '5000' }}
          GMAIL_DIAG_REPROCESS: ${{ github.event.inputs.reprocess || 'false' }}
          GMAIL_DIAG_REQUIRE_ACCESS: ${{ github.event.inputs.require_access || 'false' }}
          GMAIL_DIAG_AI_MAX: "0"
          DRY_RUN: "true"
        run: |
          set +e
          # Prefer dedicated Gmail secrets; alias Homey SSO only for IMAP fallback
          if [ -z "${GMAIL_EMAIL:-}" ] && [ -n "${HOMEY_EMAIL:-}" ]; then
            export GMAIL_EMAIL="$HOMEY_EMAIL"
            echo "::notice::Using HOMEY_EMAIL as GMAIL_EMAIL alias for IMAP cascade"
          fi
          if [ -z "${GMAIL_APP_PASSWORD:-}" ] && [ -n "${HOMEY_PASSWORD:-}" ]; then
            export GMAIL_APP_PASSWORD="$HOMEY_PASSWORD"
            echo "::notice::Using HOMEY_PASSWORD as GMAIL_APP_PASSWORD alias (app-password preferred)"
          fi
          if [ -z "${GMAIL_EMAIL:-}" ] && [ -z "${GMAIL_REFRESH_TOKEN:-}" ]; then
            echo "::warning::No live Gmail secrets — attempting L3 local-reader fallback"
          fi
          node .github/scripts/fetch-gmail-diagnostics.js
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::Gmail diagnostics fetch failed with exit code $code; privacy gates and sanitized state commit will still run."
          fi
          exit 0

      - name: Privacy and diagnostic gates
        if: always()
        run: |
          node .github/scripts/privacy-redactor.js .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/diagnostics-crossref.yml diagnostics
          npm run check:diag-history

      - name: "Render diagnostic TREAT summary (P2211)"
        if: always()
        continue-on-error: true
        run: |
          if [ -f tools/ci/render-diag-treat.js ] && [ -f .github/state/diagnostics-report.json ]; then
            node tools/ci/render-diag-treat.js || echo "render-diag-treat warn"
          fi

      - name: "Silent enrichment — diag + forum (P2215)"
        if: always()
        continue-on-error: true
        timeout-minutes: 18
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REPLY_TOPICS: "140352"
          FORUM_AUTO_POST: "0"
        run: |
          if [ ! -f tools/ci/silent-enrichment-orchestrator.js ]; then
            echo "orchestrator missing — legacy diag steps"
            node tools/ci/audit-sacred-couple-dps.js || true
            node tools/ci/forum-silent-multi-scan.js --max=40 || true
            node tools/ci/forum-actionable-processor.js --no-chain || true
            exit 0
          fi
          node tools/ci/silent-enrichment-orchestrator.js --phase=diag --skip-scan || echo "diag enrich warn"
          node tools/ci/silent-enrichment-orchestrator.js --phase=forum --skip-scan || echo "forum enrich warn"
          node tools/ci/silent-enrichment-orchestrator.js --phase=users --skip-scan || echo "user impact warn"
          if [ -f tools/ci/inventory-features-bugs.js ]; then
            node tools/ci/inventory-features-bugs.js --write-report || echo "inventory warn"
          fi
          if [ -f tools/ci/project-resilience-orchestrator.js ]; then
            node tools/ci/project-resilience-orchestrator.js --write-report --critical-first --critical-only || echo "resilience critical warn"
          fi
          if [ -f reports/resilience-$(date -u +%F)/INVENTORY.md ]; then
            echo "### Inventory (P2225)" >> $GITHUB_STEP_SUMMARY
            head -n 25 "reports/resilience-$(date -u +%F)/INVENTORY.md" >> $GITHUB_STEP_SUMMARY || true
          fi

      # P2326: pull Homey crash/diags by UUID from forum media + known inbox codes
      - name: "P2326 Inbox diag UUID harvest + Athom fetch"
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_API_TIMEOUT_MS: "60000"
        run: |
          echo "## P2326 inbox diag UUID harvest" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tools/ci/forum-media-deep-scan.js ]; then
            node tools/ci/forum-media-deep-scan.js --max=20 --topics=140352,89271 || true
          fi
          if [ -f tools/ci/inbox-diag-uuid-harvest.js ]; then
            if [ -n "${HOMEY_PAT:-}" ]; then
              node tools/ci/inbox-diag-uuid-harvest.js --fetch --max=8 || echo "uuid harvest warn"
            else
              node tools/ci/inbox-diag-uuid-harvest.js || echo "uuid list warn"
            fi
          fi
          node .github/scripts/privacy-redactor.js .github/state/inbox-diag-harvest .github/state/homey-app-diag || true
          if [ -f .github/state/inbox-diag-harvest/latest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 2000 .github/state/inbox-diag-harvest/latest.json >> "$GITHUB_STEP_SUMMARY" || true
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Regression lessons gate (MUST-KEEP fatals)"
        if: always()
        run: node tools/ci/regression-lessons-gate.js

      - name: "P100 Diag protocol gate (crash + sacred-couple cross-ref + dry apply)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm run check:diag-protocol || true
          node .github/scripts/privacy-redactor.js \
            .github/state/gmail-crash-patterns.json \
            .github/state/gmail-unique-fps.json \
            .github/state/gmail-fps-crossref-v2.json \
            .github/state/sacred-couple-dry-gate.json || true

      - name: "Light Z2M/ZHA sync (best-effort, OOM-safe)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SMART_FETCH_READER_FALLBACK: "1"
        run: |
          if [ ! -f tools/ci/mega-crawler.js ]; then
            echo "mega-crawler missing — skip light sync"
            exit 0
          fi
          timeout 200 npm run sync:z2m-zha:light || echo "z2m/zha light sync skipped/failed (non-blocking)"

      - name: "🔍 Infer-enrich from incomplete (dry-run)"
        if: always()
        continue-on-error: true
        run: node tools/ci/infer-enrich-from-incomplete.js --dry-run || true

      # READ-ONLY scan of cloud Smart Life thread (never posts/replies)
      - name: "Forum 146735 READ-ONLY silent scan"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ ! -f tools/ci/forum-fetch-146735.js ]; then
            echo "forum-fetch-146735.js missing — skip"
            exit 0
          fi
          node tools/ci/forum-fetch-146735.js || echo "146735 fetch failed (non-blocking)"
          if [ -f tools/ci/apply-forum-146735-silent.js ]; then
            # Dry-run only in CI — never auto-apply compose mutations from external thread
            node tools/ci/apply-forum-146735-silent.js || echo "146735 apply dry-run failed (non-blocking)"
          fi
          node .github/scripts/privacy-redactor.js \
            .github/state/forum/topic-146735-summary.json \
            .github/state/forum/topic-146735-actionable.json \
            .github/state/forum/topic-146735-apply-report.json || true

      - name: "Forum silent multi-topic scan (P108 / T157628)"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REPLY_TOPICS: "140352"
          FORUM_AUTO_POST: "0"
        run: |
          if [ -f tools/ci/silent-enrichment-orchestrator.js ]; then
            node tools/ci/silent-enrichment-orchestrator.js --phase=forum --skip-scan --with-media || echo "forum enrich warn"
          else
            node tools/ci/forum-silent-multi-scan.js --max=40 || echo "silent multi-scan failed (non-blocking)"
            node tools/ci/forum-ai-paste-gate.js --scan-defaults || echo "ai-paste gate warn"
            node tools/ci/forum-actionable-processor.js --no-chain || echo "forum actionable processor warn (non-blocking)"
          fi
          if [ -f tools/ci/compensate-incomplete-reports.js ]; then
            node tools/ci/compensate-incomplete-reports.js --apply-safe --skip-investigate || echo "compensate soft warn"
          fi
          node .github/scripts/privacy-redactor.js \
            .github/state/forum/multi-silent-digest.json \
            .github/state/forum/multi-silent-new-fps.json \
            .github/state/forum/actionable-processor-report.json || true

      - name: "Forum media deep scan (READ-ONLY screenshots)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMART_FETCH_READER_FALLBACK: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FORUM_AUTO_POST: "0"
        run: |
          if [ ! -f tools/ci/forum-media-deep-scan.js ]; then
            echo "forum-media-deep-scan.js missing — skip"
            exit 0
          fi
          node tools/ci/forum-media-deep-scan.js --max=40 --topics=140352,26439,89271 || echo "media scan failed (non-blocking)"
          node .github/scripts/privacy-redactor.js \
            .github/state/forum/forum-media-deep.json || true

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          node .github/scripts/privacy-redactor.js .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/diagnostics-crossref.yml .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json diagnostics
          git add .github/state/diagnostics-state.json .github/state/diagnostics-report.json .github/state/gmail-token-health.json .github/state/diagnostics-crossref.yml .github/state/gmail-crash-patterns.json .github/state/gmail-unique-fps.json .github/state/gmail-fps-crossref-v2.json .github/state/sacred-couple-dry-gate.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update diagnostics report from Gmail [skip ci]"
            bash scripts/ci/verified-git-push.sh master
          else
            echo "No sanitized diagnostic state changes to push"
          fi

      - name: Assert Gmail diagnostics access
        if: always() && steps.gmail_fetch.outputs.exit_code != '0' && github.event.inputs.require_access == 'true'
        run: |
          echo "::error::Gmail diagnostics could not authenticate via IMAP or OAuth fallback. Refresh GMAIL_EMAIL/GMAIL_APP_PASSWORD and GMAIL_REFRESH_TOKEN secrets, then rerun Fetch Homey Diagnostics."
          exit 1
