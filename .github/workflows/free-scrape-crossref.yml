# >>> about (P3069) — generated from .github/workflow-about.json, edit there then run scripts/ci/workflow-about.js --write
# What it does: Nightly cross-reference through free, keyless readers (Jina, Microlink, Wayback). Never posts.
# Ideas from (thank you): Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors; the
#   zigpy / ZHA device handler authors; Blakadder's Zigbee device database; JohanBendz's original Tuya Zigbee
#   app (read-only reference); Jina Reader, Microlink, AllOrigins and the Internet Archive for free read
#   access.
# Ground rules: free GitHub minutes; any AI step is optional and stays inside included free quotas; public
#   posting stays off or ledger-gated.
# <<< about
# Free Scrape Cross-Ref — keyless-first intelligence harvest
# Uses Jina/Microlink/AllOrigins/Wayback (+ optional Crawl4AI/Firecrawl budget).
# Silent enrichment only — NEVER posts to Homey Community.

name: Free Scrape Cross-Ref

on:
  schedule:
    # Staggered from mega-crawl (02:00) — 02:45 UTC
    - cron: '45 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Homey forum topic id'
        required: false
        default: '140352'
      focus:
        description: 'Focus post number'
        required: false
        default: '2137'
      queries:
        description: 'Comma-separated search queries'
        required: false
        default: 'Tuya SOS Homey,UNSUPPORTED_CLUSTER dimmer,water leak IAS,invert alarm polarity'
      fetch_diags:
        description: 'After scrape, fetch Homey/Gmail for harvested diag UUIDs (needs secrets)'
        type: boolean
        default: false
        required: false
      max_uuids:
        description: 'Max diagnostic UUIDs to fetch when fetch_diags=true'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: free-scrape-crossref
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  SMART_FETCH_READER_FALLBACK: '1'
  FIRECRAWL_DAILY_MAX: '5'
  AI_PLAN_MODE: 'forfait'
  AI_FORCE_LOCAL: 'true'
  AI_ALLOW_REMOTE: 'false'
  AI_ALLOW_PAID: 'false'
  AI_ENSEMBLE: 'false'
  AI_MAP_REDUCE: 'false'
  AI_FULL_CONTEXT: 'false'
  GMAIL_DIAG_AI_MAX: '0'
  LOCAL_SMART_LEARN: 'true'
  LOCAL_ENERGY_LEARN: 'true'

jobs:
  crossref:
    name: Free multi-source cross-ref
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/npm-cache-key.sha256  # P3026: version-free key, one npm cache per dependency set

      - name: Install deps (lightweight)
        run: npm ci --prefer-offline --no-audit --ignore-scripts || npm install --ignore-scripts

      - name: Restore scraper cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/scraper-cache/
            .cache/scanner-blobs/
            .cache/scanners/
          key: ${{ runner.os }}-intel-cache-${{ hashFiles('package-lock.json') }}-${{ github.workflow }}
          restore-keys: |
            ${{ runner.os }}-intel-cache-
            free-scrape-

      - name: Run free scrape cross-ref
        env:
          FIRECRAWL_API_KEY: ${{ vars.FIRECRAWL_DISABLED != 'true' && secrets.FIRECRAWL_API_KEY || '' }}
          CRAWL4AI_URL: ${{ secrets.CRAWL4AI_URL }}
        run: |
          node tools/ci/free-scrape-crossref.js \
            --topic="${{ github.event.inputs.topic || '140352' }}" \
            --focus="${{ github.event.inputs.focus || '2137' }}" \
            --queries="${{ github.event.inputs.queries || 'Tuya SOS Homey,UNSUPPORTED_CLUSTER dimmer,water leak IAS,invert alarm polarity' }}"

      - name: Source registry ingestion (changes only, free)
        # W10: data/sources/registry.json -> proposals in data/leads/source-proposals.json; cursors in
        # data/sources/state.json so each run processes only what changed. No AI, bounded API calls.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/source-registry.js --max-calls 300 | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/state.json data/leads/source-proposals.json
          git diff --cached --quiet && exit 0
          [ -f scripts/ci/bot-commit-guard.sh ] && { bash scripts/ci/bot-commit-guard.sh || exit 1; }  # P3093
          git commit -m "chore(sources): registry ingestion cursors + proposals [skip ci]"
          # P3025: shared race-safe push; --prefer-local = old "-X theirs" (bot cursor wins on its own state file)
          bash .github/scripts/git-push-retry.sh --branch "${GITHUB_REF_NAME}" --prefer-local && exit 0
          echo "::warning::could not push source registry state"

      - name: Optional Homey/Gmail fetch for harvested diag UUIDs
        if: ${{ github.event.inputs.fetch_diags == true || github.event.inputs.fetch_diags == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          HOMEY_REFRESH_TOKEN: ${{ secrets.HOMEY_REFRESH_TOKEN }}
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
          HOMEY_PAT_API: ${{ secrets.HOMEY_PAT_API }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DIAG_MAX_UUIDS: ${{ github.event.inputs.max_uuids || '5' }}
        run: node scripts/ci/diag-investigate-orchestrator.js --fetch-diags --max-uuids="${{ github.event.inputs.max_uuids || '5' }}"

      - name: Diag scripts self-test (inventory smoke)
        if: always()
        continue-on-error: true
        run: node scripts/ci/diag-investigate-orchestrator.js --self-test

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24, P3025b)
        with:
          name: free-scrape-crossref
          path: |
            .github/state/free-scrape/
            .github/state/diag-orchestrator/
            .github/state/homey-app-diag/
            .cache/scraper-cache/_firecrawl-budget.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize
        if: always()
        run: |
          if [ -f .github/state/free-scrape/dashboard-snippet.json ]; then
            echo "## Free scrape cross-ref" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .github/state/free-scrape/dashboard-snippet.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dashboard snippet produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      # P3069: short summary through the shared helper, on success and on failure.
      - name: Short summary (shared report helper)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f scripts/lib/report-writer.js ] || exit 0
          if [ "$JOB_STATUS" = "success" ]; then s="Finished cleanly. Nightly cross-reference through free, keyless readers (Jina, Microlink, Wayback). Never posts."; else s="Stopped early ($JOB_STATUS); the red step above says why. Nightly cross-reference through free, keyless readers (Jina, Microlink, Wayback). Never posts."; fi
          node scripts/lib/report-writer.js --title "free-scrape-crossref" --summary "$s" --headers "item|value" --row "job|crossref" --row "result|$JOB_STATUS" --thanks "Koen Kanters and the zigbee-herdsman-converters / Zigbee2MQTT contributors" --thanks "the zigpy / ZHA device handler authors" --thanks "Jina Reader, Microlink, AllOrigins and the Internet Archive for free read access" >> "$GITHUB_STEP_SUMMARY" || true
