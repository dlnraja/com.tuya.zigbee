<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" fill="none">
  <rect x="0" y="0" width="960" height="960" fill="#E8F0F7"/>
  <!-- Wall plate -->
  <rect x="280" y="280" width="400" height="400" rx="200" fill="#FFFFFF" stroke="#2C5282" stroke-width="20"/>
  <!-- Dial ring -->
  <circle cx="480" cy="480" r="160" fill="#E8F0F7" stroke="#4299E1" stroke-width="10"/>
  <!-- Position indicator (knob) -->
  <circle cx="480" cy="380" r="40" fill="#4299E1"/>
  <circle cx="480" cy="380" r="20" fill="#FFFFFF"/>
  <!-- Tick marks -->
  <line x1="320" y1="480" x2="350" y2="480" stroke="#2C5282" stroke-width="12" stroke-linecap="round"/>
  <line x1="610" y1="480" x2="640" y2="480" stroke="#2C5282" stroke-width="12" stroke-linecap="round"/>
  <line x1="480" y1="320" x2="480" y2="350" stroke="#2C5282" stroke-width="12" stroke-linecap="round"/>
  <line x1="480" y1="610" x2="480" y2="640" stroke="#2C5282" stroke-width="12" stroke-linecap="round"/>
  
</svg>