<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" fill="none">
  <rect x="0" y="0" width="960" height="960" fill="#E8F0F7"/>
  <!-- PIR sensor body -->
  <rect x="320" y="280" width="320" height="400" rx="40" fill="#FFFFFF" stroke="#2C5282" stroke-width="16"/>
  <!-- Lens (dome) -->
  <ellipse cx="480" cy="440" rx="100" ry="120" fill="#4299E1" opacity="0.7"/>
  <ellipse cx="480" cy="440" rx="60" ry="80" fill="#1A365D"/>
  <!-- LED indicator -->
  <circle cx="480" cy="640" r="16" fill="#F56565"/>
  <!-- Detection waves (left/right) -->
  <path d="M 220 480 Q 180 440 220 400" stroke="#00B5D8" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 200 480 Q 140 420 200 360" stroke="#00B5D8" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 740 480 Q 780 440 740 400" stroke="#00B5D8" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 760 480 Q 820 420 760 360" stroke="#00B5D8" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.6"/>
  
</svg>