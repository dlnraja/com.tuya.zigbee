<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" fill="none">
  <rect x="0" y="0" width="960" height="960" fill="#E8F0F7"/>
  <!-- Sun circle -->
  <circle cx="480" cy="420" r="160" fill="#ED8936"/>
  <circle cx="480" cy="420" r="120" fill="#00B5D8"/>
  <!-- Sun rays (8 directions) -->
  <line x1="480" y1="180" x2="480" y2="240" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="480" y1="600" x2="480" y2="660" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="240" y1="420" x2="300" y2="420" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="660" y1="420" x2="720" y2="420" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="360" y2="300" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="600" y1="300" x2="640" y2="260" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="320" y1="580" x2="360" y2="540" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <line x1="600" y1="540" x2="640" y2="580" stroke="#ED8936" stroke-width="20" stroke-linecap="round"/>
  <!-- LUX text -->
  <text x="480" y="800" font-family="Arial, sans-serif" font-size="80" fill="#2C5282" text-anchor="middle" font-weight="bold">LUX</text>
  <text x="480" y="900" font-family="Arial, sans-serif" font-size="64" fill="#2C5282" text-anchor="middle" font-weight="bold">LIGHT</text>
</svg>