<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{font-family:-apple-system,Roboto,sans-serif;padding:12px;font-size:14px}
label{display:block;margin-top:10px;font-weight:600}
input,select{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}
button{margin-top:14px;padding:10px;width:100%}
.msg{margin-top:10px;padding:8px;border-radius:4px;display:none}
.err{background:#fde8e8;color:#9b1c1c}.ok{background:#e6f6ea;color:#1e6b35}
small{color:#666}
</style></head>
<body>
<!-- P3070 repair view (Bastien): this driver has no repair handler, so the view only explains
     where to change the connection details instead of offering a form that cannot save. -->
<p>This device has no repair steps.</p>
<p><small>To change its IP address or key, open the device, then Settings. If it stays offline, remove it and pair it again.</small></p>
<button id="close">Close</button>
<script>
function onHomeyReady(Homey){ Homey.ready(); document.getElementById("close").onclick=function(){ Homey.done(); }; }
</script>
</body></html>
